                      onChange={(e) => setAircraftStatus(c.key, e.target.value)}
                      style={{ marginLeft: "auto", fontFamily: FONT_MONO, fontSize: 10, padding: "0px 2px",
                        border: `1px solid ${c.down ? tx(T.red) : T.line}`,
                        color: c.down ? tx(T.red) : tx(T.ink3), background: "transparent", maxWidth: 112 }}>
                      {statusOptions(c.ac.status).map(([v, n2]) => <option key={v} value={v}>{n2}</option>)}
                    </select>
                  ) : c.down ? (
                    <span style={{ marginLeft: "auto", color: tx(T.red) }}>{statusCode(c.ac.status)}</span>
                  ) : null}
                </div>
                {c.down && c.ac.downTo && (
                  <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.amber) }}>
                    BACK {fmtDate(c.ac.downTo).slice(0, 9)}
                  </div>
                )}
              </div>
              );
            })}
          </div>

          <div ref={gridRef} className="flex relative" style={{ height: BOARD_H }}>
            <TimeGutter suppress={[marks.civilStart, marks.sunrise, marks.sunset, marks.civilEnd,
              ...taskBands.filter(bandOnBoard).map((t) => toMin(t.start)),
              isToday ? nowMin : null]} />

            {/* dedicated-task hours, washed across the whole board behind the bookings */}
            <div className="absolute" style={{ left: 0, right: 0, top: 0, bottom: 0, pointerEvents: "none", zIndex: 0 }}>
              {taskBands.filter((t) => bandOnBoard(t) && (onScale(toMin(t.start)) || onScale(toMin(t.end)))).map((t) => {
                const top = yFor(Math.max(toMin(t.start), OPEN_MIN));
                const h = yFor(Math.min(toMin(t.end), CLOSE_MIN)) - top;
                return (
                  <div key={t.id} className="absolute" style={{ left: 0, right: 0, top, height: h,
                    background: t.strong
                      ? `repeating-linear-gradient(45deg, ${tint(t.color, 0.34)} 0 7px, ${tint(t.color, 0.2)} 7px 14px)`
                      : tint(t.color, 0.16),
                    borderTop: `${t.strong ? 2 : 1}px solid ${tint(t.color, t.strong ? 0.85 : 0.5)}`,
                    borderBottom: `${t.strong ? 2 : 1}px solid ${tint(t.color, t.strong ? 0.85 : 0.5)}` }}>
                    <button onClick={(e) => { if (!canEdit) return; e.stopPropagation(); setSel({ type: "band", bandId: t.id }); }}
                      title={canEdit ? `Edit ${t.label}` : t.label}
                      style={{ position: "absolute", left: 2, top: 1, width: GUTTER - 4, textAlign: "left",
                        fontFamily: FONT_MONO, fontSize: 10, lineHeight: "10px",
                        letterSpacing: "0.06em", color: tx(t.color), textTransform: "uppercase",
                        whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                        pointerEvents: "auto", background: T.paper, padding: "0px 2px", borderRadius: 2 }}>
                      {t.label}
                    </button>
                  </div>
                );
              })}
            </div>

            {/* daylight markers and the current time, drawn across every column */}
            <div className="absolute" style={{ left: 0, right: 0, top: 0, bottom: 0, pointerEvents: "none", zIndex: 20 }}>
              {[
                { m: marks.civilStart, label: "CT", full: "Civil twilight begins", color: tx(T.cyan), dash: "3 4" },
                { m: marks.sunrise, label: "SR", full: "Sunrise", color: tx(T.amber), dash: "" },
                { m: marks.sunset, label: "SS", full: "Sunset", color: tx(T.amber), dash: "" },
                { m: marks.civilEnd, label: "NT", full: "Night begins — end of evening civil twilight", color: tx(T.cyan), dash: "3 4" },
              ].filter((x) => onScale(x.m)).map((x) => (
                <div key={x.label} className="absolute" style={{ left: 0, right: 0, top: yFor(x.m) }}>
                  <div style={{ borderTop: `1px ${x.dash ? "dashed" : "solid"} ${x.color}`, opacity: 0.75 }} />
                  <span title={`${x.full} ${toHHMM(x.m)}`}
                    style={{ position: "absolute", left: 0, top: -6, width: GUTTER - 4, textAlign: "right",
                      fontFamily: FONT_MONO, fontSize: 10, lineHeight: "11px", letterSpacing: "0.02em",
                      color: x.color, background: T.paper, paddingRight: 3 }}>
                    {x.label} {toHHMM(x.m)}
                  </span>
                </div>
              ))}

              {isToday && onScale(nowMin) && (
                <div className="absolute" style={{ left: 0, right: 0, top: yFor(nowMin) }}>
                  <div style={{ borderTop: `2px solid ${T.red}` }} />
                  {/* bug marker pointing at the line, as on a heading tape */}
                  <span style={{ position: "absolute", left: GUTTER - 1, top: -5, width: 0, height: 0,
                    borderTop: "5px solid transparent", borderBottom: "5px solid transparent",
                    borderLeft: `6px solid ${solidBg(T.red)}` }} />
                  <span style={{ position: "absolute", left: 0, top: -8, width: GUTTER - 6, textAlign: "right",
                    fontFamily: FONT_MONO, fontSize: 10, fontWeight: 600, color: "#FFFFFF", background: solidBg(T.red),
                    padding: "0px 4px", borderRadius: "2px 0 0 2px", letterSpacing: "0.06em" }}>
                    {toHHMM(nowMin)}
                  </span>
                </div>
              )}
            </div>
            {byFleet && STAFF_REF.enabled && (
              <div className="relative shrink-0"
                style={{ width: TA_LANE_W, borderRight: `2px solid ${T.line}`, background: tint(T.ink, 0.03) }}>
                <GridLines />
                {taLane.map((s) => {
                  const bTop = Math.max(s.startMin, OPEN_MIN), bBot = Math.min(s.endMin, CLOSE_MIN);
                  const top = yFor(bTop);
                  const h = Math.max(yFor(bBot) - top, 18);

                  /* task windows that fall inside this shift */
                  const inBands = taskBands.filter(bandOnTa).map((t) => {
                    const bs = Math.max(toMin(t.start), bTop), be = Math.min(toMin(t.end), bBot);
                    return be > bs ? { t, bs, be } : null;
                  }).filter(Boolean);

                  /* put the shift's own names in the biggest stretch the bands leave free,
                     so they never sit on top of a window's label */
                  let free = [[bTop, bBot]];
                  inBands.forEach(({ bs, be }) => {
                    free = free.flatMap(([a, z]) => {
                      if (be <= a || bs >= z) return [[a, z]];
                      const out = [];
                      if (bs > a) out.push([a, bs]);
                      if (be < z) out.push([be, z]);
                      return out;
                    });
                  });
                  const slot = free.sort((a, b) => (b[1] - b[0]) - (a[1] - a[0]))[0] || [bTop, bBot];

                  return (
                    <div key={s.id} title={`${s.name} ${fmtH(s.start)}–${fmtH(s.end)}`}
                      onClick={(e) => { if (!canEdit) return; e.stopPropagation(); setSel({ type: "tashift", shiftId: s.id }); }}
                      title={canEdit ? "Edit this shift" : ""}
                      className="absolute" style={{
                        top: top + 1, height: h - 2, left: 3, right: 3, cursor: canEdit ? "pointer" : "default",
                        background: `linear-gradient(180deg, ${tint(s.color, 0.28)} 0%, ${tint(s.color, 0.16)} 100%)`,
                        border: `1px solid ${tint(s.color, 0.5)}`, borderLeft: `4px solid ${s.color}`,
                        borderRadius: 2, padding: "2px 4px", overflow: "hidden" }}>
                      {/* names centred in the block — the hours are already on the time gutter */}
                      <div className="absolute flex flex-col items-center justify-center"
                        style={{ left: 0, right: 0, top: (slot[0] - bTop) * PX_PER_MIN,
                          height: Math.max((slot[1] - slot[0]) * PX_PER_MIN, 16),
                          padding: "0px 4px", zIndex: 2, pointerEvents: "none" }}>
                        {s.names.map((n) => (
                          <div key={n} style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 13, lineHeight: "16px",
                            color: T.ink, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                            maxWidth: "100%", textAlign: "center" }}>{n}</div>
                        ))}
                        {s.names.length < s.need && canEdit && (
                          <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.red), textAlign: "center" }}>
                            + add {s.need - s.names.length}
                          </div>
                        )}
                        {s.names.length === 0 && !canEdit && (
                          <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3), textAlign: "center" }}>
                            not posted
                          </div>
                        )}
                      </div>

                      {/* the dedicated-task hour inside this shift */}
                      {inBands.map(({ t, bs, be }) => {
                        /* whoever is on the shift that runs out during this window — they cover it */
                        const outgoing = taLane.find((x) => x.endMin > bs && x.endMin <= be) || s;
                        const cover = outgoing.names;
                        const bandH = (be - bs) * PX_PER_MIN;
                        return (
                          <div key={t.id} className="absolute flex flex-col items-center justify-center"
                            title={`${t.label} ${t.start}–${t.end}${cover.length ? ` · ${cover.join(", ")}` : ""}`}
                            onClick={(e) => { if (!canEdit) return; e.stopPropagation(); setSel({ type: "band", bandId: t.id }); }}
                            style={{ left: 0, right: 0, top: (bs - bTop) * PX_PER_MIN,
                              height: bandH, overflow: "hidden", cursor: "pointer", zIndex: 3,
                              background: tint(t.color, 0.42), borderTop: `1px solid ${t.color}`, borderBottom: `1px solid ${t.color}` }}>
                            {cover.length > 0 ? cover.map((n) => (
                              <div key={n} style={{ fontFamily: FONT_UI, fontSize: 13, fontWeight: 600, color: T.ink,
                                lineHeight: "15px", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                                maxWidth: "100%", textAlign: "center" }}>{n}</div>
                            )) : (
                              <span style={{ fontFamily: FONT_UI, fontSize: 13, fontWeight: 600, color: tx(t.color),
                                whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                                maxWidth: "100%", textAlign: "center" }}>{t.label}</span>
                            )}
                            {bandH >= 30 && cover.length > 0 && (
                              <span style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em",
                                color: tx(t.color), whiteSpace: "nowrap" }}>{t.label}</span>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            )}
            {columns.map((c, ci) => (
              <div key={c.key} className="relative flex-1"
                onClick={(e) => clickEmpty(e, c)}
                title="Click to add a booking here"
                style={{ borderLeft: `1px solid ${T.lineSoft}`, background: c.down ? tint(T.red, 0.08) : "transparent",
                  cursor: canEdit ? "copy" : "default", minWidth: colW }}>
                <GridLines />

                {/* instructor tab: hatch only the days they have booked off */}
                {!byFleet && c.ins.id && c.away && (
                  <>
                    <div className="absolute" style={{ inset: 0,
                      background: `repeating-linear-gradient(45deg, ${tint(T.red, 0.12)} 0 6px, transparent 6px 12px)` }} />
                    <div className="absolute text-center" style={{ left: 4, right: 4, top: 8, fontFamily: FONT_MONO,
                      fontSize: 10, letterSpacing: "0.12em", color: tx(T.red) }}>
                      TIME OFF{c.away.reason ? ` · ${c.away.reason.toUpperCase()}` : ""}
                    </div>
                  </>
                )}

                {byFleet && canEdit && gapsForDay(boardDate).filter((g) => g.aircraftId === c.key)
                  .flatMap((g) => slotsInGap(g)).map((g) => {
                    const h = (toMin(g.end) - toMin(g.start)) * PX_PER_MIN - 2;
                    return (
                      <button key={`${g.aircraftId}-${g.start}`}
                        onClick={(e) => { e.stopPropagation(); setSel({ type: "new", date: g.date, start: g.start,
                          aircraftId: g.aircraftId, instructorId: "",
                          block: toMin(g.end) - toMin(g.start) }); }}
                        className="absolute flex items-center justify-center"
                        title={`Book ${g.start}–${g.end}`}
                        style={{ top: (toMin(g.start) - OPEN_MIN) * PX_PER_MIN + 1,
                          height: h, left: 2, right: 2,
                          border: `1px dashed ${g.part ? tint(T.ink3, 0.7) : T.ink3}`, borderRadius: 2,
                          background: `repeating-linear-gradient(45deg, ${tint(T.ink, 0.05)} 0 6px, transparent 6px 12px)`,
                          padding: "0px 4px", overflow: "hidden" }}>
                        <span style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.12em", color: tx(T.ink3),
                          whiteSpace: "nowrap" }}>
                          {g.part ? "PART" : "OPEN"}
                        </span>
                      </button>
                    );
                  })}
                {onBoard.filter(({ b }) => inColumn(b, c.key) && b.id !== dragged?.id).map(({ b, off }) => (
                  <Strip key={b.id} b={b} student={stuById(b.studentId)} partners={partnersOf(b).map(stuById).filter(Boolean)}
                    risk={riskReason(b)} selected={sel?.type === "booking" && sel.id === b.id} unit={fuelUnit}
                    standing={fuelFor(b.aircraftId).amount} dayOffset={off}
                    title={byFleet ? undefined
                      : (b.instructorId ? insShort(b.instructorId)
                        : b.signOutInstructorId ? insShort(b.signOutInstructorId)
                        : bookingLabel(b, stuById(b.studentId), partnersOf(b).map(stuById).filter(Boolean)))}
                    onOpen={openBooking} onDragStart={beginDrag} canDrag={canEdit}
                    onHover={showHover} onHoverEnd={hideHover} />
                ))}
                {dragged && drag.pCol === ci && (
                  <Strip b={{ ...dragged, start: toHHMM(drag.pStart), end: toHHMM(drag.pStart + drag.pDur) }}
                    student={stuById(dragged.studentId)} partners={partnersOf(dragged).map(stuById).filter(Boolean)}
                    risk={false} selected dragging unit={fuelUnit}
                    title={byFleet ? undefined : (dragged.instructorId ? insShort(dragged.instructorId) : undefined)}
                    onOpen={() => {}} onDragStart={() => {}} />
                )}
              </div>
            ))}

          </div>
        </div>
      </div>

      {!drag && <BookingHoverCard hover={hover} stuById={stuById} unit={fuelUnit} riskReason={riskReason} />}

      {!canEdit && (
        <div className="mt-3 px-3 py-2" style={{ border: `1px solid ${T.line}`, background: T.panelAlt, borderRadius: 2 }}>
          <span style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.06em", color: tx(T.ink3) }}>
            STUDENT VIEW · READ ONLY
          </span>
          <div style={{ fontSize: 13, color: T.ink2, marginTop: 2 }}>
            Hover any booking to see its detail. Contact the office to change a booking.
          </div>
        </div>
      )}

      <p style={{ fontSize: 13, color: T.ink2, marginTop: 10, maxWidth: 720,
        display: canEdit ? "block" : "none" }}>
        Hover a strip for its detail, click to open and edit it. Drag it to move — sideways swaps the {byFleet ? "airframe" : "instructor"},
        up and down changes the time. Drag the bottom edge to lengthen or shorten.
        {byFleet ? " Dashed blocks are airframes sitting idle." : " Hatched areas are hours the instructor isn't working."}
      </p>
    </div>
  );
}

/* ============================= INSPECTOR ============================== */

function NewBookingPanel({ sel, setSel, students, types, fleet, createBooking, say, standbyFor }) {
  const [typeId, setTypeId] = useState("t-dual");
  const [studentId, setStudentId] = useState("");
  const [partnerIds, setPartnerIds] = useState([]);
  const [examiner, setExaminer] = useState("");
  const [lesson, setLesson] = useState(null);
  const [note, setNote] = useState("");
  const [fuel, setFuel] = useState("");
  const [fuelNote, setFuelNote] = useState("");
  const [aircraftId, setAircraftId] = useState(sel.aircraftId || "");
  const [instructorId, setInstructorId] = useState(sel.instructorId || "");
  const [date, setDate] = useState(sel.date);
  const [start, setStart] = useState(sel.start);
  /* contents drive the length, exactly as they do on an existing booking */
  const [segs, setSegs] = useState(() => defaultSegments(typeById(sel.typeId || "t-dual"), sel.block || 120));
  const [addKind, setAddKind] = useState("k-brief");
  const [touchedSegs, setTouchedSegs] = useState(false);
  const block = segTotal(segs);
  const end = toHHMM(toMin(start) + block);

  const editSeg = (i, patch) => {
    setTouchedSegs(true);
    setSegs((xs) => xs.map((x, j) => (j === i ? { ...x, ...patch } : x)));
  };
  const dropSeg = (i) => { setTouchedSegs(true); setSegs((xs) => xs.filter((_, j) => j !== i)); };
  const addSeg = () => { setTouchedSegs(true); setSegs((xs) => [...xs, { id: uid("sg"), kindId: addKind, minutes: 30 }]); };
  const moveStart = (v) => setStart(v);
  const shiftStart = (mins) => setStart(toHHMM(Math.max(0, toMin(start) + mins)));
  /* stretch or squeeze the main item so the block lands on the length asked for */
  const resize = (want) => {
    const target = Math.max(15, want);
    setTouchedSegs(true);
    setSegs((xs) => {
      if (!xs.length) return [{ id: uid("sg"), kindId: addKind, minutes: target }];
      const i = primaryIdx(xs);
      const others = xs.reduce((a, x, j) => a + (j === i ? 0 : x.minutes), 0);
      return xs.map((x, j) => (j === i ? { ...x, minutes: Math.max(5, target - others) } : x));
    });
  };
  const [standbyOpen, setStandbyOpen] = useState(false);
  const [showBlocked, setShowBlocked] = useState(false);
  const [cancelling, setCancelling] = useState(false);
  const [cancelWhy, setCancelWhy] = useState("");
  const [cancelWhat, setCancelWhat] = useState("");

  const t = typeById(typeId);
  const wantsStudent = needsStudent(t);
  const stu = studentId ? students.find((x) => x.id === studentId) : null;
  const nextLesson = stu ? Math.min(stu.done.length, getSyl(stu.course).lessons.length - 1) : 0;
  /* default to whatever they're up to, until the scheduler picks something else */
  const lessonIdx = lesson == null ? nextLesson : lesson;
  const ready = (!wantsStudent || !!studentId) && (!t.partner || partnerIds.length > 0)
    && (!t.examiner || !!examiner.trim()) && block > 0;

  const candidates = standbyFor({
    date: sel.date, start, end: toHHMM(toMin(start) + block),
    aircraftId, instructorId, typeId, exclude: [],
  });
  const available = candidates.filter((c) => c.ok);
  const blocked = candidates.filter((c) => !c.ok);

  const pick = (id) => {
    setTypeId(id);
    const nt = typeById(id);
    if (!needsStudent(nt)) setStudentId("");
    if (!nt.partner) setPartnerIds([]);
    if (!touchedSegs) setSegs(defaultSegments(nt, block || 120));
    if (!nt.examiner) setExaminer("");
    if (nt.aircraft === "none") { setAircraftId(""); setFuel(""); setFuelNote(""); }
    if (nt.instructor === "none") setInstructorId("");
  };

  const submit = () => {
    createBooking({ date, start, block, segments: segs, aircraftId, studentId,
      partnerIds: t.partner ? partnerIds : [], typeId,
      examiner: t.examiner ? examiner.trim() : "",
      lesson: wantsStudent ? lessonIdx : 0, note: note.trim(),
      fuelRequested: fuel, fuelNote: fuelNote.trim(),
      instructorId: instructorId || (studentId ? undefined : "") });
    say(`${wantsStudent ? "Booking" : t.name} added at ${start}`);
  };

  const groups = [
    ["Training", types.filter((x) => needsStudent(x))],
    ["No student needed", types.filter((x) => !needsStudent(x))],
  ];

  return (
    <div className="fixed inset-0 z-40 flex justify-end" style={{ background: DARK_MODE ? "rgba(0,0,0,0.6)" : "rgba(23,36,43,0.35)" }} onClick={() => setSel(null)}>
      <div className="w-full sm:max-w-md h-full overflow-y-auto" style={{ background: T.panel, borderLeft: `1px solid ${T.line}` }}
        onClick={(e) => e.stopPropagation()}>
        <div className="sticky top-0 flex items-start justify-between gap-3 px-4 py-3 z-10"
          style={{ background: DARK_MODE ? T.panelAlt : T.ink, color: DARK_MODE ? T.ink : T.paper,
            borderBottom: DARK_MODE ? `1px solid ${T.line}` : "none" }}>
          <div>
            <Label style={{ color: DARK_MODE ? T.ink3 : "rgba(233,234,226,0.6)" }}>New booking</Label>
            <div style={{ fontFamily: FONT_UI, fontSize: 20, fontWeight: 600, letterSpacing: "0.02em" }}>{t.name}</div>
            <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: DARK_MODE ? T.ink2 : "rgba(233,234,226,0.75)" }}>
              {fmtDate(date)} · {start}–{end}
              {aircraftId ? ` · ${acById(aircraftId).reg}` : ""}
            </div>
          </div>
          <button onClick={() => setSel(null)} style={{ color: DARK_MODE ? T.ink : T.paper, fontFamily: FONT_MONO, fontSize: 20 }} aria-label="Close">✕</button>
        </div>

        <div className="p-4 space-y-4">
          <div>
            <Label>Booking type</Label>
            {groups.map(([heading, list]) => (
              <div key={heading} className="mt-2">
                <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3), letterSpacing: "0.12em", marginBottom: 4 }}>
                  {heading.toUpperCase()}
                </div>
                <div className="flex flex-wrap gap-1">
                  {list.map((x) => (
                    <button key={x.id} onClick={() => pick(x.id)}
                      style={{ fontFamily: FONT_UI, fontSize: 13, fontWeight: 600, padding: "4px 8px", borderRadius: 2,
                        border: `1px solid ${typeId === x.id ? x.color : T.line}`,
                        background: typeId === x.id ? x.color : "transparent",
                        color: typeId === x.id ? "#fff" : T.ink2 }}>
                      {x.name}
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>

          {t.examiner && (
            <div>
              <Label>Examiner</Label>
              <input className="w-full mt-1" value={examiner} placeholder="Examiner's name"
                onChange={(e) => setExaminer(e.target.value)} />
              {!examiner.trim() && (
                <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.red), marginTop: 3 }}>
                  {t.name.toUpperCase()} NEEDS AN EXAMINER
                </div>
              )}
            </div>
          )}

          {wantsStudent ? (
            <div>
              <Label>{t.partner ? "First student" : "Student"}</Label>
              <select className="w-full mt-1" value={studentId}
                onChange={(e) => { setStudentId(e.target.value); setLesson(null);
                  setPartnerIds((ps) => ps.filter((id) => id !== e.target.value)); }}>
                <option value="">— pick a student —</option>
                {students.map((s) => (
                  <option key={s.id} value={s.id}>
                    {s.name} · {s.course} · next {lessonCode(s.course, Math.min(s.done.length, getSyl(s.course).lessons.length - 1))}
                  </option>
                ))}
              </select>

              {/* a mutual names each seat in its own dropdown */}
              {t.partner && (
                <>
                  {[...partnerIds, ""].map((pid, i) => (
                    <div key={i} className="mt-3">
                      <Label>{i === 0 ? "Second student" : i === 1 ? "Third student" : `Student ${i + 2}`}</Label>
                      <select className="w-full mt-1" value={pid}
                        onChange={(e) => {
                          const v = e.target.value;
                          const next = [...partnerIds];
                          if (v) next[i] = v; else next.splice(i, 1);
                          setPartnerIds(next.filter(Boolean));
                        }}>
                        <option value="">{i === 0 ? "— pick a student —" : "— add another —"}</option>
                        {students.filter((x) => x.id !== studentId && (x.id === pid || !partnerIds.includes(x.id)))
                          .map((x) => <option key={x.id} value={x.id}>{x.name} · {x.course}</option>)}
                      </select>
                    </div>
                  ))}
                  {partnerIds.length === 0 && (
                    <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.red), marginTop: 3 }}>
                      {t.name.toUpperCase()} NEEDS AT LEAST ONE MORE STUDENT
                    </div>
                  )}
                </>
              )}
            </div>
          ) : (
            <div style={{ border: `1px solid ${T.lineSoft}`, borderLeft: `4px solid ${t.color}`, padding: "8px 8px", borderRadius: 2,
              fontSize: 13, color: T.ink2 }}>
              {t.name} holds the slot without a student. Add a note below to say what it's for.
            </div>
          )}

          <div className="grid grid-cols-2 gap-3">
          {wantsStudent && studentId && (
            <div>
              <Label>Lesson</Label>
              <select className="w-full mt-1" value={lessonIdx} onChange={(e) => setLesson(Number(e.target.value))}>
                {getSyl(stu.course).lessons.map((l, i) => (
                  <option key={i} value={i}>
                    {lessonCode(stu.course, i)} · {l}{stu.done.includes(i) ? " ✓" : ""}
                  </option>
                ))}
              </select>
              <div style={{ fontSize: 12, color: tx(T.ink3), marginTop: 3 }}>
                Next up is {lessonCode(stu.course, nextLesson)} · {lessonName(stu.course, nextLesson)}.
              </div>
            </div>
          )}

            <div>
              <Label>Aircraft</Label>
              <select className="w-full mt-1" value={aircraftId} disabled={t.aircraft === "none"}
                onChange={(e) => setAircraftId(e.target.value)}>
                <option value="">— none —</option>
                {fleet.filter((a) => a.status !== "retired").map((a) => (
                  <option key={a.id} value={a.id}>{a.reg} · {a.type}{a.status !== "active" ? ` (${a.status})` : ""}</option>
                ))}
              </select>
            </div>
            <div>
              <Label>{isSoloType(t) || t.examiner ? "Sign out instructor" : "Instructor"}</Label>
              <select className="w-full mt-1" value={instructorId} disabled={t.instructor === "none"}
                onChange={(e) => setInstructorId(e.target.value)}>
                <option value="">{t.instructor === "none" ? "— not needed —" : "— use the student's usual instructor —"}</option>
                {allIns().map((i) => <option key={i.id} value={i.id}>{i.name}</option>)}
              </select>
            </div>
          </div>

          {/* ---------- what's in this booking ---------- */}
          <div style={{ border: `1px solid ${T.line}`, borderRadius: 2, padding: 10 }}>
            <div className="flex items-baseline justify-between mb-2">
              <Label>What's in this booking</Label>
              <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: T.ink2 }}>
                {start}–{end} · {hrs(segTotal(segs))} h
              </span>
            </div>
            <div className="flex" style={{ height: 12, border: `1px solid ${T.line}`, borderRadius: 2, overflow: "hidden" }}>
              {segs.map((sg) => (
                <div key={sg.id} title={`${kindById(sg.kindId).name} ${sg.minutes} min`}
                  style={{ width: `${(sg.minutes / (segTotal(segs) || 1)) * 100}%`, background: kindById(sg.kindId).color }} />
              ))}
            </div>
            <div className="mt-2 space-y-1">
              {segs.map((sg, i) => {
                let cursor = toMin(start);
                for (let j = 0; j < i; j++) cursor += segs[j].minutes;
                return (
                  <div key={sg.id} className="flex items-center gap-2">
                    <span style={{ width: 10, height: 10, background: kindById(sg.kindId).color, flexShrink: 0 }} />
                    <select value={sg.kindId} style={{ width: 140 }}
                      onChange={(e) => editSeg(i, { kindId: e.target.value })}>
                      {KIND_REF.map((k) => <option key={k.id} value={k.id}>{k.name}</option>)}
                    </select>
                    <input type="number" min={0} step={5} value={sg.minutes} style={{ width: 58 }}
                      onChange={(e) => editSeg(i, { minutes: Math.max(0, Number(e.target.value) || 0) })} />
                    <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>
                      {toHHMM(cursor)}–{toHHMM(cursor + sg.minutes)}
                    </span>
                    <button onClick={() => dropSeg(i)} title="Remove"
                      style={{ marginLeft: "auto", color: tx(T.red), fontFamily: FONT_MONO, fontSize: 13 }}>✕</button>
                  </div>
                );
              })}
              {segs.length === 0 && (
                <div style={{ fontSize: 12, color: tx(T.ink3) }}>Nothing in it yet — add an item below.</div>
              )}
            </div>
            <div className="flex items-center gap-2 mt-2">
              <select value={addKind} onChange={(e) => setAddKind(e.target.value)}>
                {KIND_REF.map((k) => <option key={k.id} value={k.id}>{k.name}</option>)}
              </select>
              <Btn small onClick={addSeg}>Add 30 min</Btn>
              <span style={{ fontSize: 12, color: tx(T.ink3) }}>Changing these resizes the block.</span>
            </div>
          </div>

          {/* ---------- times ---------- */}
          <div>
            <Label>Times</Label>
            <div className="flex items-end gap-3 mt-1 flex-wrap">
              <div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>START</div>
                <div className="flex items-center gap-1">
                  <Btn small onClick={() => shiftStart(-15)}>−</Btn>
                  <input type="time" value={start} onChange={(e) => e.target.value && moveStart(e.target.value)} />
                  <Btn small onClick={() => shiftStart(15)}>+</Btn>
                </div>
              </div>
              <div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>END</div>
                <div className="flex items-center gap-1">
                  <Btn small onClick={() => resize(segTotal(segs) - 15)}>−</Btn>
                  <input type="time" value={end}
                    onChange={(e) => e.target.value && resize(toMin(e.target.value) - toMin(start))} />
                  <Btn small onClick={() => resize(segTotal(segs) + 15)}>+</Btn>
                </div>
              </div>
            </div>
            <div className="flex items-center gap-2 mt-2 flex-wrap">
              <Btn onClick={() => shiftStart(-30)}>30 min earlier</Btn>
              <Btn onClick={() => shiftStart(30)}>30 min later</Btn>
              <input type="date" value={date} onChange={(e) => e.target.value && setDate(e.target.value)} />
            </div>
            {block <= 0 && (
              <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.red), marginTop: 4 }}>
                END MUST BE AFTER START
              </div>
            )}
          </div>

          {aircraftId && acById(aircraftId).fuelCap > 0 && (
            <div>
              <Label>Fuel restriction</Label>
              <div className="flex flex-wrap items-center gap-2 mt-1">
                <input type="number" min={0} max={acById(aircraftId).fuelCap} step="1" value={fuel} placeholder="none"
                  onChange={(e) => setFuel(clampFuel(e.target.value, acById(aircraftId).fuelCap))}
                  style={{ width: 76, textAlign: "right", fontWeight: 600 }} />
                <span style={{ fontFamily: FONT_MONO, fontSize: 12, color: tx(T.ink3) }}>
                  gal max · {acById(aircraftId).fuelCap} full
                </span>
                <span className="flex gap-1 ml-auto">
                  <Btn small onClick={() => setFuel(acById(aircraftId).fuelCap)}>Full</Btn>
                  <Btn small onClick={() => setFuel(Math.round(acById(aircraftId).fuelCap / 2))}>½</Btn>
                  {fuel !== "" && <Btn small tone="danger" onClick={() => setFuel("")}>Clear</Btn>}
                </span>
              </div>
              {fuel !== "" && (
                <input className="w-full mt-2" value={fuelNote}
                  placeholder="Why — weight limited, no fuel at the destination…"
                  onChange={(e) => setFuelNote(e.target.value)} />
              )}
            </div>
          )}

          <div>
            <Label>Note</Label>
            <textarea className="w-full mt-1" rows={2} value={note} placeholder="Anything the crew should know"
              onChange={(e) => setNote(e.target.value)} style={{ fontFamily: FONT_BODY, fontSize: 13 }} />
          </div>


          <div className="flex gap-2">
            <Btn tone="accent" disabled={!ready} onClick={submit}>
              {block <= 0 ? "Check the times" : ready ? "Create booking"
                : !studentId ? "Pick a student first"
                : t.examiner && !examiner.trim() ? "Name the examiner"
                : "Pick who else is flying"}
            </Btn>
            <Btn onClick={() => setSel(null)}>Cancel</Btn>
          </div>

          {wantsStudent && (
            <div style={{ border: `1px solid ${T.line}`, borderRadius: 2 }}>
              <button onClick={() => setStandbyOpen((v) => !v)} className="w-full flex items-center justify-between px-3 py-2"
                style={{ background: T.panelAlt }}>
                <span className="flex items-center gap-2">
                  <span style={{ fontFamily: FONT_UI, fontWeight: 700, fontSize: 13, letterSpacing: "0.06em", textTransform: "uppercase" }}>
                    Who's free for this slot
                  </span>
                  <Chip color={available.length ? T.sage : T.red}>{available.length} READY</Chip>
                </span>
                <span style={{ fontFamily: FONT_MONO, fontSize: 12, color: T.ink2 }}>{standbyOpen ? "▲" : "▼"}</span>
              </button>
              {standbyOpen && (
                <div>
                  {available.length === 0 && (
                    <div className="px-3 py-3" style={{ fontSize: 13, color: T.ink2 }}>
                      Nobody is clear for this window. Change the time, or check the list below.
                    </div>
                  )}
                  {available.map((c) => (
                    <div key={c.student.id} className="px-3 py-2 flex items-start justify-between gap-3"
                      style={{ borderTop: `1px solid ${T.lineSoft}`,
                        background: studentId === c.student.id ? "rgba(180,37,122,0.06)" : "transparent" }}>
                      <div className="min-w-0">
                        <div className="flex items-center gap-2">
                          <span style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 15 }}>{c.student.name}</span>
                          <Chip color={courseColor(c.student.course)}>{c.student.course}</Chip>
                        </div>
                        <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: T.ink2, marginTop: 2 }}>{c.reasons.join(" · ")}</div>
                      </div>
                      <Btn small tone={studentId === c.student.id ? "solid" : "quiet"} onClick={() => setStudentId(c.student.id)}>
                        {studentId === c.student.id ? "Picked" : "Pick"}
                      </Btn>
                    </div>
                  ))}
                  <button onClick={() => setShowBlocked((v) => !v)} className="w-full text-left px-3 py-2"
                    style={{ borderTop: `1px solid ${T.lineSoft}`, fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3), letterSpacing: "0.06em" }}>
                    {showBlocked ? "HIDE" : "SHOW"} {blocked.length} UNAVAILABLE
                  </button>
                  {showBlocked && blocked.map((c) => (
                    <div key={c.student.id} className="px-3 py-2" style={{ borderTop: `1px solid ${T.lineSoft}`, opacity: 0.75 }}>
                      <div style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 13 }}>{c.student.name}</div>
                      <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.red) }}>{c.blocks.join(" · ")}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          <div style={{ fontSize: 12, color: tx(T.ink3) }}>
            You can fine-tune the contents, fuel and times once it's on the board.
          </div>
        </div>
      </div>
    </div>
  );
}

function Inspector(props) {
  const { sel, setSel, booking, students, stuById, fleet, types, kinds, fuelUnit, standbyFor, conflictsFor,
    patchBooking, setSegments, reassign, addPartner, createFromGap, shiftBooking, resizeBooking, changeType,
    checkOut, checkIn, undoDispatch, undoCheckIn, onLeave, say, fuelFor, setBookingStudent, createBooking } = props;
  const [standbyOpen, setStandbyOpen] = useState(false);
  const [showBlocked, setShowBlocked] = useState(false);
  const [cancelling, setCancelling] = useState(false);
  const [cancelWhy, setCancelWhy] = useState("");
  const [cancelWhat, setCancelWhat] = useState("");
  const [addKind, setAddKind] = useState(kinds[1]?.id || kinds[0]?.id);

  const isNew = sel.type === "new";
  if (isNew) return <NewBookingPanel {...{ sel, setSel, students, types, fleet, createBooking, say, standbyFor }} />;
  const isGap = false;
  const gap = null;
  if (!booking) return null;

  const student = booking ? stuById(booking.studentId) : null;
  const partners = booking ? partnersOf(booking).map(stuById).filter(Boolean) : [];
  const t = booking ? typeById(booking.typeId) : null;
  const ac = booking ? acById(booking.aircraftId) : null;
  const leave = booking && booking.studentId ? onLeave(booking.studentId, booking.date) : null;
  const conflicts = booking ? conflictsFor(booking) : [];
  const total = booking ? segTotal(booking.segments) : 0;
  const generated = booking ? bookingLabel({ ...booking, label: "" }, student, partners) : "";
  const standing = booking ? fuelFor(booking.aircraftId) : { amount: "", general: "" };
  const mainIns = student ? insById(student.instructorId) : null;
  const covering = booking && student && booking.instructorId && booking.instructorId !== student.instructorId;
  const noIns = t ? t.instructor === "none" : false;
  /* solos and flight tests name a sign out instructor — nobody is instructing */
  const isSolo = t ? (isSoloType(t) || !!t.examiner) : false;
  const out = booking ? OUT(booking) : false;
  const back = booking ? BACK(booking) : false;

  const candidates = standbyFor(isGap
    ? { date: gap.date, start: gap.start, end: toHHMM(Math.min(toMin(gap.end), toMin(gap.start) + 120)),
        aircraftId: gap.aircraftId, instructorId: "", typeId: "t-dual", exclude: [] }
    : { date: booking.date, start: booking.start, end: booking.end, aircraftId: booking.aircraftId,
        instructorId: booking.instructorId, typeId: booking.typeId,
        exclude: crewOf(booking), excludeBookingId: booking.id });
  const available = candidates.filter((c) => c.ok);
  const blocked = candidates.filter((c) => !c.ok);

  const editSeg = (i, patch) => setSegments(booking.id, booking.segments.map((s, j) => (j === i ? { ...s, ...patch } : s)));
  const dropSeg = (i) => setSegments(booking.id, booking.segments.filter((_, j) => j !== i));
  const addSeg = () => setSegments(booking.id, [...booking.segments, { id: uid("sg"), kindId: addKind, minutes: 30 }]);

  return (
    <div className="fixed inset-0 z-40 flex justify-end" style={{ background: DARK_MODE ? "rgba(0,0,0,0.6)" : "rgba(23,36,43,0.35)" }} onClick={() => setSel(null)}>
      <div className="w-full sm:max-w-md h-full overflow-y-auto" style={{ background: T.panel, borderLeft: `1px solid ${T.line}` }}
        onClick={(e) => e.stopPropagation()}>

        <div className="sticky top-0 flex items-start justify-between gap-3 px-4 py-3 z-10"
          style={{ background: DARK_MODE ? T.panelAlt : T.ink, color: DARK_MODE ? T.ink : T.paper,
            borderBottom: DARK_MODE ? `1px solid ${T.line}` : "none" }}>
          <div>
            <Label style={{ color: DARK_MODE ? T.ink3 : "rgba(233,234,226,0.6)" }}>{isGap ? "Open aircraft time" : t.name}</Label>
            <div style={{ fontFamily: FONT_UI, fontSize: 20, fontWeight: 600, letterSpacing: "0.02em" }}>
              {isGap ? acById(gap.aircraftId).reg : bookingLabel(booking, student, partners)}
            </div>
            <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: DARK_MODE ? T.ink2 : "rgba(233,234,226,0.75)" }}>
              {fmtDate(isGap ? gap.date : booking.date)} · {isGap ? `${gap.start}–${gap.end}` : `${booking.start}–${booking.end}`}
              {!isGap && booking.aircraftId ? ` · ${ac.reg}` : ""}
            </div>
          </div>
          <button onClick={() => setSel(null)} style={{ color: DARK_MODE ? T.ink : T.paper, fontFamily: FONT_MONO, fontSize: 20 }} aria-label="Close">✕</button>
        </div>

        <div className="p-4 space-y-5">
          {!isGap && (
            <>
              {/* dispatch state only — the numbers are captured at check out */}
              <div className="flex flex-wrap items-center gap-2">
                <Chip color={out ? T.sage : back ? T.ink3 : T.line} filled={out}>
                  {out ? `AIRBORNE ${booking.checkOutAt}` : back ? `FLOWN ${booking.checkOutAt}–${booking.checkInAt}` : "NOT SIGNED OUT"}
                </Chip>
                {out && booking.dest && <Chip color={T.ink3}>{booking.dest}</Chip>}
                {out && booking.eta && (
                  <Chip color={toMin(booking.eta) < toMin(nowHHMM()) ? T.red : T.ink3}>
                    ETA {booking.eta}
                  </Chip>
                )}
                {out && booking.fuelOnBoard !== "" && <Chip color={T.amber}>{booking.fuelOnBoard} {shortUnit(fuelUnit)} ON BOARD</Chip>}
                <span className="ml-auto flex items-center gap-1">
                  {!out && !back && (
                    <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>
                      CHECK OUT FROM THE SCHEDULE
                    </span>
                  )}
                  {out && <Btn small tone="go" onClick={() => checkIn(booking)}>Check in</Btn>}
                  {back && <Btn small onClick={() => undoCheckIn(booking)}>Undo check in</Btn>}
                  {(out || back) && <Btn small tone="danger" onClick={() => undoDispatch(booking)}>Undo check out</Btn>}
                </span>
              </div>

              {leave && (
                <div style={{ border: `1px solid ${T.amber}`, borderLeft: `4px solid ${T.amber}`, padding: "8px 8px", borderRadius: 2 }}>
                  <Label style={{ color: tx(T.amber) }}>Needs re-crewing</Label>
                  <div style={{ fontSize: 13, marginTop: 2 }}>{student.name.split(" ")[0]} booked time off for this date — {leave.reason}.</div>
                </div>
              )}
              {conflicts.length > 0 && (
                <div style={{ border: `1px solid ${T.red}`, borderLeft: `4px solid ${T.red}`, padding: "8px 8px", borderRadius: 2 }}>
                  <Label style={{ color: tx(T.red) }}>Check before you save</Label>
                  <ul style={{ fontSize: 13, marginTop: 4, listStyle: "none" }}>{conflicts.map((c) => <li key={c}>— {c}</li>)}</ul>
                </div>
              )}

              {/* ---------- display name ---------- */}
              <div>
                <Label>Display name</Label>
                <div className="flex items-center gap-2 mt-1">
                  <input className="w-full" value={booking.label} placeholder={generated}
                    onChange={(e) => patchBooking(booking.id, { label: e.target.value })} />
                  {booking.label && <Btn small onClick={() => patchBooking(booking.id, { label: "" })} title="Go back to the template">Reset</Btn>}
                </div>
                <div style={{ fontSize: 12, color: tx(T.ink3), marginTop: 3 }}>
                  {booking.label ? "Custom name — shown on the board instead of the student's." : "Showing the student's name — type here to override it."}
                </div>
              </div>

              {/* ---------- crew ---------- */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <Label>Booking type</Label>
                  <select className="w-full mt-1" value={booking.typeId} onChange={(e) => changeType(booking, e.target.value)}>
                    {types.map((x) => <option key={x.id} value={x.id}>{x.name}</option>)}
                  </select>
                </div>
                <div>
                  <Label>Aircraft</Label>
                  <select className="w-full mt-1" value={booking.aircraftId} onChange={(e) => patchBooking(booking.id, { aircraftId: e.target.value })}>
                    <option value="">— ground / none —</option>
                    {fleet.filter((a) => a.status !== "retired").map((a) => (
                      <option key={a.id} value={a.id}>{a.reg} · {a.type}{a.status !== "active" ? ` (${a.status})` : ""}</option>
                    ))}
                  </select>
                </div>
                {noIns ? (
                  <div>
                    <Label>Instructor</Label>
                    <div style={{ fontSize: 13, color: T.ink2, marginTop: 6 }}>
                      Not needed for {t.name.toLowerCase()}.
                    </div>
                  </div>
                ) : (
                  <div>
                    <Label>{isSolo ? "Sign out instructor" : "Instructor"}</Label>
                    <select className="w-full mt-1" value={booking.instructorId}
                      onChange={(e) => patchBooking(booking.id, isSolo
                        ? { instructorId: e.target.value, signOutInstructorId: e.target.value }
                        : { instructorId: e.target.value })}>
                      <option value="">— none —</option>
                      {allIns().map((i) => <option key={i.id} value={i.id}>{i.name}</option>)}
                    </select>
                  </div>
                )}
                {!isSolo && !noIns && (
                  <div>
                    <Label>Signed out by</Label>
                    <select className="w-full mt-1" value={booking.signOutInstructorId}
                      onChange={(e) => patchBooking(booking.id, { signOutInstructorId: e.target.value })}>
                      <option value="">— nobody —</option>
                      {allIns().map((i) => <option key={i.id} value={i.id}>{i.name}</option>)}
                    </select>
                  </div>
                )}
              </div>
              <div style={{ fontSize: 12, color: covering ? tx(T.violet) : tx(T.ink3), marginTop: -8 }}>
                {student ? (covering
                  ? `${insById(booking.instructorId).name} is covering — ${mainIns.name} is ${student.name.split(" ")[0]}'s usual instructor.`
                  : `${mainIns.name} is ${student.name.split(" ")[0]}'s usual instructor.`) : ""}
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <Label>Status</Label>
                  <select className="w-full mt-1" value={booking.status}
                    onChange={(e) => {
                      if (e.target.value === "cancelled") { setCancelling(true); return; }
                      patchBooking(booking.id, { status: e.target.value, cancelReason: "", cancelNote: "" });
                    }}>
                    <option value="scheduled">Scheduled</option>
                    <option value="flown">Flown</option>
                    <option value="cancelled">Cancelled</option>
                  </select>
                </div>
                {t.partner && (
                  <div>
                    <Label>Second student</Label>
                    {[...partnersOf(booking), ""].map((pid, i) => (
                      <div key={i} className={i ? "mt-2" : "mt-1"}>
                        <select className="w-full" value={pid}
                          onChange={(e) => {
                            const v = e.target.value;
                            const next = [...partnersOf(booking)];
                            if (v) next[i] = v; else next.splice(i, 1);
                            patchBooking(booking.id, { partnerIds: next.filter(Boolean) });
                          }}>
                          <option value="">{i === 0 ? "— pick a student —" : "— add another —"}</option>
                          {students.filter((x) => x.id !== booking.studentId &&
                            (x.id === pid || !partnersOf(booking).includes(x.id)))
                            .map((x) => <option key={x.id} value={x.id}>{x.name} · {x.course}</option>)}
                        </select>
                      </div>
                    ))}
                    <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3), marginTop: 3 }}>
                      {partnersOf(booking).length} SELECTED · {crewOf(booking).length} ON BOARD
                    </div>
                  </div>
                )}
              </div>

              <div>
                <Label>Student</Label>
                <select className="w-full mt-1" value={booking.studentId} onChange={(e) => setBookingStudent(booking, e.target.value)}>
                  <option value="">— no student —</option>
                  {students.map((s) => <option key={s.id} value={s.id}>{s.name} · {s.course}</option>)}
                </select>
                {!booking.studentId && (
                  <div style={{ fontSize: 12, color: tx(T.ink3), marginTop: 3 }}>
                    {needsStudent(t) ? `${t.name} normally has a student — pick one or change the type.`
                      : `${t.name} holds the aircraft without a student.`}
                  </div>
                )}
              </div>

              {t.examiner && (
                <div>
                  <Label>Examiner</Label>
                  <input className="w-full mt-1" value={booking.examiner || ""} placeholder="Examiner's name"
                    onChange={(e) => patchBooking(booking.id, { examiner: e.target.value })} />
                </div>
              )}

              {booking.studentId && (
                <div>
                  <Label>Lesson</Label>
                  <select className="w-full mt-1" value={booking.lesson} onChange={(e) => patchBooking(booking.id, { lesson: Number(e.target.value) })}>
                    {getSyl(booking.course).lessons.map((l, i) => (
                      <option key={`${l}-${i}`} value={i}>{lessonCode(booking.course, i)} · {l}</option>
                    ))}

              <div style={{ border: `1px solid ${T.line}`, borderRadius: 2, padding: 10 }}>
                <div className="flex items-baseline justify-between mb-2">
                  <Label>What's in this booking</Label>
                  <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: T.ink2 }}>{booking.start}–{booking.end} · {hrs(total)} h</span>
                </div>
                <div className="flex" style={{ height: 12, border: `1px solid ${T.line}`, borderRadius: 2, overflow: "hidden" }}>
                  {booking.segments.map((s) => (
                    <div key={s.id} title={`${kindById(s.kindId).name} ${s.minutes} min`}
                      style={{ width: `${(s.minutes / (total || 1)) * 100}%`, background: kindById(s.kindId).color }} />
                  ))}
                </div>
                <div className="mt-2 space-y-1">
                  {booking.segments.map((s, i) => {
                    let cursor = toMin(booking.start);
                    for (let j = 0; j < i; j++) cursor += booking.segments[j].minutes;
                    return (
                      <div key={s.id} className="flex items-center gap-2">
                        <span style={{ width: 10, height: 10, background: kindById(s.kindId).color, flexShrink: 0 }} />
                        <select value={s.kindId} onChange={(e) => editSeg(i, { kindId: e.target.value })} style={{ width: 140 }}>
                          {kinds.map((k) => <option key={k.id} value={k.id}>{k.name}</option>)}
                        </select>
                        <input type="number" min={0} step={5} value={s.minutes} style={{ width: 58 }}
                          onChange={(e) => editSeg(i, { minutes: Math.max(0, Number(e.target.value) || 0) })} />
                        <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>{toHHMM(cursor)}–{toHHMM(cursor + s.minutes)}</span>
                        <button onClick={() => dropSeg(i)} title="Remove" style={{ marginLeft: "auto", color: tx(T.red), fontFamily: FONT_MONO, fontSize: 13 }}>✕</button>
                      </div>
                    );
                  })}
                </div>
                <div className="flex items-center gap-2 mt-2">
                  <select value={addKind} onChange={(e) => setAddKind(e.target.value)}>
                    {kinds.map((k) => <option key={k.id} value={k.id}>{k.name}</option>)}
                  </select>
                  <Btn small onClick={addSeg}>Add 30 min</Btn>
                  <span style={{ fontSize: 12, color: tx(T.ink3) }}>Changing these resizes the block.</span>
                </div>
              </div>

              {/* ---------- times ---------- */}
              <div>
                <Label>Times</Label>
                <div className="flex items-end gap-3 mt-1 flex-wrap">
                  <div>
                    <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>START</div>
                    <div className="flex items-center gap-1">
                      <Btn small onClick={() => shiftBooking(booking, -15)}>−</Btn>
                      <input type="time" value={booking.start} onChange={(e) => patchBooking(booking.id, { start: e.target.value })} />
                      <Btn small onClick={() => shiftBooking(booking, 15)}>+</Btn>
                    </div>
                  </div>
                  <div>
                    <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>END</div>
                    <div className="flex items-center gap-1">
                      <Btn small onClick={() => resizeBooking(booking.id, total - 15)}>−</Btn>
                      <input type="time" value={booking.end}
                        onChange={(e) => resizeBooking(booking.id, toMin(e.target.value) - toMin(booking.start))} />
                      <Btn small onClick={() => resizeBooking(booking.id, total + 15)}>+</Btn>
                    </div>
                  </div>
                </div>
                <div className="flex items-center gap-2 mt-2 flex-wrap">
                  <Btn onClick={() => shiftBooking(booking, -30)}>30 min earlier</Btn>
                  <Btn onClick={() => shiftBooking(booking, 30)}>30 min later</Btn>
                  <input type="date" value={booking.date} onChange={(e) => e.target.value && patchBooking(booking.id, { date: e.target.value })} />
                </div>
              </div>

              {/* ---------- fuel restriction ---------- */}
              <div>
                <Label>Fuel restriction</Label>
                <div className="flex flex-wrap items-center gap-2 mt-1">
                  <input type="number" min={0} max={booking.aircraftId ? ac.fuelCap : undefined} step="1"
                    value={booking.fuelRequested} placeholder="none" disabled={!booking.aircraftId}
                    onChange={(e) => patchBooking(booking.id, { fuelRequested: clampFuel(e.target.value, ac.fuelCap) })}
                    style={{ width: 76, textAlign: "right", fontWeight: 600 }} />
                  <span style={{ fontFamily: FONT_MONO, fontSize: 12, color: tx(T.ink3) }}>
                    {shortUnit(fuelUnit)} max{booking.aircraftId ? ` · ${ac.fuelCap} full` : ""}
                  </span>
                  {booking.aircraftId && (
                    <span className="flex gap-1 ml-auto">
                      <Btn small onClick={() => patchBooking(booking.id, { fuelRequested: ac.fuelCap })}>Full</Btn>
                      <Btn small onClick={() => patchBooking(booking.id, { fuelRequested: Math.round(ac.fuelCap / 2) })}>½</Btn>
                      {standing.amount !== "" && Number(booking.fuelRequested || 0) !== Number(standing.amount) && (
                        <Btn small onClick={() => patchBooking(booking.id, { fuelRequested: standing.amount })}
                          title={`General restriction for ${ac.reg}`}>{standing.amount}</Btn>
                      )}
                      {booking.fuelRequested !== "" && (
                        <Btn small tone="danger" onClick={() => patchBooking(booking.id, { fuelRequested: "" })}>Clear</Btn>
                      )}
                    </span>
                  )}
                </div>
                {booking.fuelRequested !== "" && (
                  <input className="w-full mt-2" value={booking.fuelNote}
                    placeholder="Why — weight limited, no fuel at the destination…"
                    onChange={(e) => patchBooking(booking.id, { fuelNote: e.target.value })} />
                )}
              </div>

              <div>
                <Label>Notes</Label>
                <textarea className="w-full mt-1" rows={2} value={booking.note} placeholder="Weather hold, checkride prep, aircraft swap…"
                  onChange={(e) => patchBooking(booking.id, { note: e.target.value })} />
              </div>
            </>
          )}

          {isGap && (
            <div style={{ fontSize: 13, color: T.ink2 }}>
              {acById(gap.aircraftId).reg} is unbooked from {gap.start} to {gap.end} — {hrs(toMin(gap.end) - toMin(gap.start))} hours
              of idle airframe. Pick someone below to take the first two hours.
            </div>
          )}

          {(isGap || needsStudent(t)) && (
          <div style={{ border: `1px solid ${T.line}`, borderRadius: 2 }}>
            <button onClick={() => setStandbyOpen((v) => !v)} className="w-full flex items-center justify-between px-3 py-2" style={{ background: T.panelAlt }}>
              <span className="flex items-center gap-2">
                <span style={{ fontFamily: FONT_UI, fontWeight: 700, fontSize: 13, letterSpacing: "0.06em", textTransform: "uppercase" }}>Standby list</span>
                <Chip color={available.length ? T.sage : T.red}>{available.length} READY</Chip>
              </span>
              <span style={{ fontFamily: FONT_MONO, fontSize: 12, color: T.ink2 }}>{standbyOpen ? "▲" : "▼"}</span>
            </button>
            {standbyOpen && (
              <div>
                {available.length === 0 && (
                  <div className="px-3 py-3" style={{ fontSize: 13, color: T.ink2 }}>
                    Nobody is clear for this window. Widen the times or check the blocked list below.
                  </div>
                )}
                {available.map((c) => (
                  <div key={c.student.id} className="px-3 py-2 flex items-start justify-between gap-3" style={{ borderTop: `1px solid ${T.lineSoft}` }}>
                    <div className="min-w-0">
                      <div className="flex items-center gap-2">
                        <span style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 15 }}>{c.student.name}</span>
                        <Chip color={courseColor(c.student.course)}>{c.student.course}</Chip>
                      </div>
                      <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: T.ink2, marginTop: 2 }}>{c.reasons.join(" · ")}</div>
                    </div>
                    <div className="flex flex-col gap-1">
                      <Btn tone="accent" small onClick={() => (isGap ? createFromGap(gap, c.student.id) : reassign(booking.id, c.student.id))}>
                        {isGap ? "Book" : "Give slot"}
                      </Btn>
                      {!isGap && t.partner && <Btn small onClick={() => addPartner(booking.id, c.student.id)}>Add to flight</Btn>}
                    </div>
                  </div>
                ))}
                <button onClick={() => setShowBlocked((v) => !v)} className="w-full text-left px-3 py-2"
                  style={{ borderTop: `1px solid ${T.lineSoft}`, fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3), letterSpacing: "0.06em" }}>
                  {showBlocked ? "HIDE" : "SHOW"} {blocked.length} UNAVAILABLE
                </button>
                {showBlocked && blocked.map((c) => (
                  <div key={c.student.id} className="px-3 py-2" style={{ borderTop: `1px solid ${T.lineSoft}`, opacity: 0.75 }}>
                    <div style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 13 }}>{c.student.name}</div>
                    <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.red) }}>{c.blocks.join(" · ")}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
          )}

          {!isGap && (
            <>
              {booking.status === "cancelled" && (
                <div style={{ border: `1px solid ${T.line}`, borderLeft: `4px solid ${T.ink3}`, padding: "8px 8px", borderRadius: 2 }}>
                  <div className="flex items-baseline justify-between gap-2">
                    <Label>Cancelled</Label>
                    <Btn small onClick={() => patchBooking(booking.id, { status: "scheduled", cancelReason: "", cancelNote: "" })}>
                      Reinstate
                    </Btn>
                  </div>
                  <select className="w-full mt-1" value={booking.cancelReason || ""}
                    onChange={(e) => patchBooking(booking.id, { cancelReason: e.target.value })}>
                    <option value="">— reason not recorded —</option>
                    {CANCEL_REASONS.map(([v, n]) => <option key={v} value={v}>{n}</option>)}
                  </select>
                  {booking.cancelReason === "other" && (
                    <input className="w-full mt-2" value={booking.cancelNote || ""} placeholder="What happened?"
                      onChange={(e) => patchBooking(booking.id, { cancelNote: e.target.value })} />
                  )}
                  {!booking.cancelReason && (
                    <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.amber), marginTop: 4 }}>
                      PICK A REASON SO IT COUNTS ON THE REPORTS
                    </div>
                  )}
                </div>
              )}

              {booking.status !== "cancelled" && cancelling && (
                <div style={{ border: `1px solid ${T.red}`, borderLeft: `4px solid ${T.red}`, padding: "8px 8px", borderRadius: 2 }}>
                  <Label style={{ color: tx(T.red) }}>Why is it cancelled?</Label>
                  <div className="flex flex-wrap gap-1 mt-2">
                    {CANCEL_REASONS.map(([v, n]) => (
                      <Btn key={v} small tone={cancelWhy === v ? "solid" : "quiet"} onClick={() => setCancelWhy(v)}>{n}</Btn>
                    ))}
                  </div>
                  {cancelWhy === "other" && (
                    <input className="w-full mt-2" value={cancelWhat} placeholder="What happened?"
                      onChange={(e) => setCancelWhat(e.target.value)} autoFocus />
                  )}
                  <div className="flex gap-2 mt-3">
                    <Btn tone="danger" disabled={!cancelWhy || (cancelWhy === "other" && !cancelWhat.trim())}
                      onClick={() => {
                        patchBooking(booking.id, { status: "cancelled", cancelReason: cancelWhy,
                          cancelNote: cancelWhy === "other" ? cancelWhat.trim() : "" });
                        setCancelling(false); setCancelWhy(""); setCancelWhat("");
                        if (needsStudent(t)) setStandbyOpen(true);
                        say(`Cancelled — ${cancelWhy === "other" ? cancelWhat.trim() : reasonName(cancelWhy).toLowerCase()}`);
                      }}>
                      Confirm cancellation
                    </Btn>
                    <Btn onClick={() => { setCancelling(false); setCancelWhy(""); }}>Keep it</Btn>
                  </div>
                </div>
              )}

              <div className="flex gap-2">
                {booking.status !== "cancelled" && !cancelling && (
                  <Btn tone="danger" onClick={() => setCancelling(true)}>
                    {needsStudent(t) ? "Cancel flight" : "Cancel booking"}
                  </Btn>
                )}
                <Btn onClick={() => setSel(null)}>Done</Btn>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================== LESSONS =============================== */

function LessonsView({ syllabi, students, bookings, setSel, setActiveStudent, setView, createBooking, onLeave, say }) {
  const [course, setCourse] = useState("PPL");
  const [idx, setIdx] = useState(12);
  const syl = syllabi[course];
  const safeIdx = Math.min(idx, syl.lessons.length - 1);
  const cohort = students.filter((s) => s.course === course);
  const done = cohort.filter((s) => s.done.includes(safeIdx));
  const notDone = cohort.filter((s) => !s.done.includes(safeIdx));

  const scheduledFor = (s) => bookings.find((b) => onBooking(b, s.id) &&
    b.status === "scheduled" && b.lesson === safeIdx && b.date >= key(TODAY));

  const pairs = useMemo(() => {
    const out = [];
    for (let i = 0; i < notDone.length; i++) {
      for (let j = i + 1; j < notDone.length; j++) {
        const a = notDone[i], b = notDone[j];
        for (let d = 0; d < 14 && out.length < 60; d++) {
          const date = key(addDays(TODAY, d));
          const wd = wdIndex(date);
          const wa = a.availability[wd], wb = b.availability[wd];
          if (!wa || !wb) continue;
          if (onLeave(a.id, date) || onLeave(b.id, date)) continue;
          const s = Math.max(toMin(wa[0]), toMin(wb[0])), e = Math.min(toMin(wa[1]), toMin(wb[1]));
          if (e - s < 120) continue;
          const busy = (st) => bookings.some((bk) => bk.status !== "cancelled" && bk.date === date &&
            onBooking(bk, st.id) && overlaps(s, s + 120, toMin(bk.start), toMin(bk.end)));
          if (busy(a) || busy(b)) continue;
          out.push({ a, b, date, start: toHHMM(s) });
          break;
        }
      }
    }
    return out.sort((x, y) => (x.date < y.date ? -1 : 1)).slice(0, 8);
  }, [notDone, bookings, safeIdx]);

  const StudentRow = ({ s, complete }) => {
    const booked = scheduledFor(s);
    return (
      <div className="flex items-center justify-between gap-2 px-3 py-2" style={{ borderTop: `1px solid ${T.lineSoft}` }}>
        <div className="min-w-0">
          <button onClick={() => { setActiveStudent(s.id); setView("students"); }}
            style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 15, textAlign: "left" }}>{s.name}</button>
          <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>
            {insShort(s.instructorId).toUpperCase()} · {s.done.length}/{syl.lessons.length} DONE{s.timeOff.length ? " · TIME OFF FILED" : ""}
          </div>
        </div>
        {complete ? <Chip color={T.sage}>COMPLETE</Chip>
          : booked ? <button onClick={() => setSel({ type: "booking", id: booked.id })}><Chip color={T.blue}>BOOKED {fmtDate(booked.date).slice(0, 6)}</Chip></button>
          : <Chip color={T.ink3}>NOT BOOKED</Chip>}
      </div>
    );
  };

  return (
    <div className="p-4 sm:p-6 grid gap-4 lg:grid-cols-4">
      <div>
        <div className="mb-2">
          <Label>Course</Label>
          <select className="w-full mt-1" value={course} onChange={(e) => { setCourse(e.target.value); setIdx(0); }}>
            {Object.keys(syllabi).map((c) => <option key={c} value={c}>{c} — {syllabi[c].name}</option>)}
          </select>
        </div>
        <div style={{ border: `1px solid ${T.line}`, background: T.panel, maxHeight: 620, overflowY: "auto" }}>
          {syl.lessons.map((l, i) => {
            const n = cohort.filter((s) => s.done.includes(i)).length;
            return (
              <button key={`${l}-${i}`} onClick={() => setIdx(i)} className="w-full text-left px-3 py-2 flex items-center gap-2"
                style={{ borderTop: `1px solid ${T.lineSoft}`, background: i === safeIdx ? T.panelAlt : "transparent",
                  borderLeft: `4px solid ${i === safeIdx ? syl.color : "transparent"}` }}>
                <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3), width: 62 }}>{lessonCode(course, i)}</span>
                <span style={{ fontSize: 13, fontWeight: i === safeIdx ? 600 : 400 }}>{l}</span>
                <span style={{ marginLeft: "auto", fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>{n}/{cohort.length}</span>
              </button>
            );
          })}
        </div>
      </div>

      <div className="lg:col-span-3 space-y-4">
        <div>
          <Label>{lessonCode(course, safeIdx)}</Label>
          <h2 style={{ fontFamily: FONT_UI, fontSize: 26, fontWeight: 700, letterSpacing: "0.02em" }}>{syl.lessons[safeIdx]}</h2>
          <div style={{ fontSize: 13, color: T.ink2 }}>{done.length} of {cohort.length} {course} students have this signed off.</div>
        </div>

        <div className="grid gap-4 md:grid-cols-2">
          <div style={{ border: `1px solid ${T.line}`, background: T.panel }}>
            <div className="px-3 py-2" style={{ background: T.panelAlt, fontFamily: FONT_UI, fontWeight: 700, fontSize: 13,
              letterSpacing: "0.06em", textTransform: "uppercase" }}>Not yet complete — {notDone.length}</div>
            {notDone.map((s) => <StudentRow key={s.id} s={s} complete={false} />)}
            {notDone.length === 0 && <div className="px-3 py-4" style={{ fontSize: 13, color: T.ink2 }}>Everyone has finished this one.</div>}
          </div>
          <div style={{ border: `1px solid ${T.line}`, background: T.panel }}>
            <div className="px-3 py-2" style={{ background: T.panelAlt, fontFamily: FONT_UI, fontWeight: 700, fontSize: 13,
              letterSpacing: "0.06em", textTransform: "uppercase" }}>Complete — {done.length}</div>
            {done.map((s) => <StudentRow key={s.id} s={s} complete />)}
            {done.length === 0 && <div className="px-3 py-4" style={{ fontSize: 13, color: T.ink2 }}>Nobody has reached this lesson yet.</div>}
          </div>
        </div>

        <Section title="Pair up for a mutual flight"
          right={<span style={{ fontSize: 13, color: T.ink2 }}>Two students who both still need this lesson and are free at the same time.</span>}>
          {pairs.length === 0 && <div style={{ fontSize: 13, color: T.ink2 }}>No overlapping windows in the next two weeks.</div>}
          {pairs.map((p) => (
            <div key={`${p.a.id}-${p.b.id}-${p.date}`} className="flex flex-wrap items-center gap-3 py-2" style={{ borderTop: `1px solid ${T.lineSoft}` }}>
              <span style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 15 }}>
                {p.a.name} <span style={{ color: tx(T.ink3) }}>+</span> {p.b.name}
              </span>
              <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: T.ink2 }}>
                {fmtDate(p.date)} {p.start} · {insShort(p.a.instructorId)} / {insShort(p.b.instructorId)}
              </span>
              <div className="flex gap-1 ml-auto">
                <Btn small onClick={() => { createBooking({ date: p.date, start: p.start, studentId: p.a.id, partnerIds: [p.b.id],
                  typeId: "t-dmut", instructorId: p.a.instructorId }); say("Booked — pick an aircraft in the panel"); }}>Book dual mutual</Btn>
                <Btn small onClick={() => { createBooking({ date: p.date, start: p.start, studentId: p.a.id, partnerIds: [p.b.id],
                  typeId: "t-smut", instructorId: p.a.instructorId }); say("Booked — pick an aircraft in the panel"); }}>Solo mutual</Btn>
              </div>
            </div>
          ))}
        </Section>
      </div>
    </div>
  );
}

                  {["Name","Code","Colour","Student","Instructor","2nd student","Examiner","Aircraft","Main item","Brief","Debrief","Admin","Used",""].map((h) => <Th key={h}>{h}</Th>)}
                </tr></thead>
                <tbody>
                  {types.map((t) => (
                    <tr key={t.id} style={{ borderBottom: `1px solid ${T.lineSoft}` }}>

                      <td style={{ padding: "4px 8px" }}><input value={t.code} onChange={(e) => saveType(t.id, { code: e.target.value.toUpperCase().slice(0, 6) })} style={{ width: 62 }} /></td>
                      <td style={{ padding: "4px 8px" }}>
                        <span className="flex items-center gap-1">
                          <select value={swatches().some(([, v]) => v === t.color) ? t.color : "custom"}

                        </span>
                      </td>
                      <td style={{ padding: "4px 8px" }}>
                        <select value={t.student ?? "required"} onChange={(e) => saveType(t.id, { student: e.target.value })}>

                      </td>
                      <td style={{ padding: "4px 8px" }}>

                          <option value="optional">Optional</option><option value="none">Not needed</option>
                        </select>

                      <td style={{ padding: "4px 8px", textAlign: "center" }}>

                      <td style={{ padding: "4px 8px", textAlign: "center" }}>
                        <input type="checkbox" checked={!!t.examiner} onChange={(e) => saveType(t.id, { examiner: e.target.checked })} style={{ accentColor: T.magenta }} />
                      </td>
                      <td style={{ padding: "4px 8px" }}>
                        <select value={t.aircraft} onChange={(e) => saveType(t.id, { aircraft: e.target.value })}>
                          <option value="any">Any</option><option value="sim">Simulator</option><option value="none">None</option>

                      </td>
                      <td style={{ padding: "4px 8px" }}>
                        <select value={t.mainKindId} onChange={(e) => saveType(t.id, { mainKindId: e.target.value })}>
                          {kinds.map((k) => <option key={k.id} value={k.id}>{k.name}</option>)}

                      </td>
                      {["briefMin","debriefMin","adminMin"].map((f) => (

          </Section>

          <Section title="Booking contents" right={<Btn small onClick={addKind}>Add item</Btn>}>

            </div>
            {kinds.map((k) => (
              <div key={k.id} className="flex flex-wrap items-center gap-2 py-2" style={{ borderTop: `1px solid ${T.lineSoft}` }}>

                <input value={k.name} onChange={(e) => saveKind(k.id, { name: e.target.value })} style={{ width: 170 }} />
                <input value={k.code} onChange={(e) => saveKind(k.id, { code: e.target.value.toUpperCase().slice(0, 4) })} style={{ width: 58 }} />
                <select value={swatches().some(([, v]) => v === k.color) ? k.color : "custom"}
                  onChange={(e) => e.target.value !== "custom" && saveKind(k.id, { color: e.target.value })}>
                  {swatches().map(([n2, v]) => <option key={v} value={v}>{n2}</option>)}
                  <option value="custom">Custom…</option>
                </select>
                <input type="color" value={k.color} title="Any colour you like"
                  onChange={(e) => saveKind(k.id, { color: e.target.value })}

                <select value={k.counts} onChange={(e) => saveKind(k.id, { counts: e.target.value })}>

            <div className="grid sm:grid-cols-2 gap-4">
              <div>
                <Label>Count bookings that are</Label>
                <select className="w-full mt-1" value={cfiCfg.countStatus}
                  onChange={(e) => setCfiCfg({ ...cfiCfg, countStatus: e.target.value })}>
                  <option value="flown">Completed only — checked back in</option>

                </select>
                <div style={{ fontSize: 12, color: tx(T.ink3), marginTop: 3 }}>
                  {cfiCfg.countStatus === "flown"
                    ? "Scheduled flights that haven't happened yet are left out."
                    : "Includes flights still on the books, so the year-to-date reads as planned rather than achieved."}

              </div>

              <div>
                <Label>Bookings with no airborne time</Label>
                <label className="flex items-center gap-2 mt-2">

                    onChange={(e) => setCfiCfg({ ...cfiCfg, airOnly: e.target.checked })} />

                </label>
                <div style={{ fontSize: 12, color: tx(T.ink3), marginTop: 3 }}>

          </Section>

            right={<span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3) }}>

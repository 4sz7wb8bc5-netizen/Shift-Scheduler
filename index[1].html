            <div className="grid sm:grid-cols-2 gap-4">
              <div>
                <Label>Hours per booking</Label>
                <div className="flex items-center gap-2 mt-1">
                  <input type="number" min={0.5} max={8} step="0.5" value={cfiCfg.bookingHours}
                    onChange={(e) => setCfiCfg({ ...cfiCfg, bookingHours: Math.max(0.5, Math.min(8, Number(e.target.value) || 2)) })}
                    style={{ width: 80, fontSize: 20, fontWeight: 600, textAlign: "right" }} />
                  <span style={{ fontFamily: FONT_MONO, fontSize: 12, color: tx(T.ink3) }}>h per slot</span>
                </div>
                <div style={{ fontSize: 12, color: tx(T.ink3), marginTop: 3 }}>
                  How long one aircraft is tied up, including turnaround.
                </div>
              </div>

              <div>
                <Label>Buffer</Label>
                <div className="flex items-center gap-2 mt-1">
                  <input type="range" min={10} max={100} step={5} value={Math.round(cfiCfg.buffer * 100)}
                    onChange={(e) => setCfiCfg({ ...cfiCfg, buffer: Number(e.target.value) / 100 })}
                    style={{ width: 140, accentColor: T.magenta }} />
                  <span style={{ fontFamily: FONT_MONO, fontSize: 20, fontWeight: 600 }}>
                    {Math.round(cfiCfg.buffer * 100)}%
                  </span>
                </div>
                <div style={{ fontSize: 12, color: tx(T.ink3), marginTop: 3 }}>
                  Share of the theoretical maximum you'd expect to actually fly. Lower means more allowance
                  for weather, maintenance and no-shows.
                </div>
              </div>

              <div>
                <Label>Usable daylight</Label>
                <select className="w-full mt-1" value={cfiCfg.daylight}
                  onChange={(e) => setCfiCfg({ ...cfiCfg, daylight: e.target.value })}>
                  {DAYLIGHT_BASIS.map(([v, n]) => <option key={v} value={v}>{n}</option>)}
                </select>
                <div style={{ fontSize: 12, color: tx(T.ink3), marginTop: 3 }}>
                  Civil twilight adds roughly half an hour at each end.
                </div>
              </div>

              <div>
                <Label>Airframes counted</Label>
                <label className="flex items-center gap-2 mt-2">
                  <input type="checkbox" checked={cfiCfg.countMulti} style={{ accentColor: T.magenta }}
                    onChange={(e) => setCfiCfg({ ...cfiCfg, countMulti: e.target.checked })} />
                  <span style={{ fontSize: 13 }}>Include multi-engine</span>
                </label>
                <label className="flex items-center gap-2 mt-1">
                  <input type="checkbox" checked={cfiCfg.countSim} style={{ accentColor: T.magenta }}
                    onChange={(e) => setCfiCfg({ ...cfiCfg, countSim: e.target.checked })} />
                  <span style={{ fontSize: 13 }}>Include simulators</span>
                </label>
                <div style={{ fontSize: 12, color: tx(T.ink3), marginTop: 3 }}>
                  Simulators don't need daylight, so counting them inflates the capacity figure.
                </div>
              </div>
            </div>

            {/* what the current settings produce, so the effect is visible before leaving the page */}
            <div className="mt-4 pt-3" style={{ borderTop: `1px solid ${T.line}` }}>
              <Label>With today's settings</Label>
              <div className="flex flex-wrap gap-x-6 gap-y-1 mt-1" style={{ fontFamily: FONT_MONO, fontSize: 12 }}>
                {(() => {
                  const count = fleet.filter((a) => a.status !== "retired"
                    && (cfiCfg.countSim || a.class !== "sim")
                    && (cfiCfg.countMulti || a.class !== "multi")).length;
                  const now = new Date();
                  const m = monthCapacity(now.getFullYear(), now.getMonth(), Math.max(1, count), site.lat, site.lon, cfiCfg);
                  return (
                    <>
                      <span>{count} AIRFRAMES</span>
                      <span>{m.daylightHours.toFixed(0)} H DAYLIGHT THIS MONTH</span>
                      <span title={`${m.raw} slots of daylight, less the ${Math.round((1 - cfiCfg.buffer) * 100)}% buffer`}
                        style={{ fontWeight: 700, color: tx(T.magenta) }}>
                        {m.capacity} SLOTS AVAILABLE
                      </span>
                    </>
                  );
                })()}
              </div>
            </div>
          </Section>

          <Section title="TA staffing"
            right={<span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3) }}>
              SEATS × {cfiCfg.staffBuffer} = HEADCOUNT
            </span>}>
            <Label>Headcount buffer</Label>
            <div className="flex items-center gap-2 mt-1">
              <input type="range" min={100} max={200} step={5} value={Math.round(cfiCfg.staffBuffer * 100)}
                onChange={(e) => setCfiCfg({ ...cfiCfg, staffBuffer: Number(e.target.value) / 100 })}
                style={{ width: 160, accentColor: T.magenta }} />
              <span style={{ fontFamily: FONT_MONO, fontSize: 20, fontWeight: 600 }}>
                {Math.round((cfiCfg.staffBuffer - 1) * 100)}% spare
              </span>
            </div>
            <div style={{ fontSize: 13, color: T.ink2, marginTop: 4 }}>
              How many more TAs than the bare minimum to keep on the books, so that holidays and sickness
              don't leave a shift unfilled. Drives the estimate on the TAs page.
            </div>
          </Section>

          <Section title="What the CFI page shows"
            right={<span style={{ fontSize: 13, color: T.ink2 }}>Tick the figures and panels worth having.</span>}>
            <Label>Headline figures</Label>
            <div className="flex flex-wrap gap-x-5 gap-y-1 mt-1 mb-4">
              {CFI_STATS.map(([k, n]) => {
                const on = (cfiCfg.stats || []).includes(k);
                return (
                  <label key={k} className="flex items-center gap-2" style={{ minWidth: 190 }}>
                    <input type="checkbox" checked={on} style={{ accentColor: T.magenta }}
                      onChange={(e) => setCfiCfg({ ...cfiCfg,
                        stats: e.target.checked ? [...(cfiCfg.stats || []), k]
                          : (cfiCfg.stats || []).filter((x) => x !== k) })} />
                    <span style={{ fontSize: 13, fontWeight: on ? 600 : 400 }}>{n}</span>
                  </label>
                );
              })}
            </div>
            {(cfiCfg.stats || []).length === 0 && (
              <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.amber), marginBottom: 10 }}>
                NOTHING TICKED — THE PAGE FALLS BACK TO THE STANDARD SET
              </div>
            )}

            <Label>Panels</Label>
            <div className="flex flex-wrap gap-x-5 gap-y-1 mt-1">
              {CFI_PANELS.map(([k, n]) => {
                const on = (cfiCfg.panels || []).includes(k);
                return (
                  <label key={k} className="flex items-center gap-2" style={{ minWidth: 190 }}>
                    <input type="checkbox" checked={on} style={{ accentColor: T.magenta }}
                      onChange={(e) => setCfiCfg({ ...cfiCfg,
                        panels: e.target.checked ? [...(cfiCfg.panels || []), k]
                          : (cfiCfg.panels || []).filter((x) => x !== k) })} />
                    <span style={{ fontSize: 13, fontWeight: on ? 600 : 400 }}>{n}</span>
                  </label>
                );
              })}
            </div>
          </Section>

          <Section title="Export & archive"
            right={<span style={{ fontSize: 13, color: T.ink2 }}>Everything on the board, as a workbook.</span>}>
            <div className="flex flex-wrap items-center gap-3">
              <Btn tone="accent" disabled={exporting} onClick={async () => {
                setExporting(true);
                try {
                  const what = await exportWorkbook({ bookings, students, instructors, fleet, syllabi,
                    taResult, taShifts, site, cfiCfg, stuById, generalFuel });
                  say(`Workbook downloaded — ${what}`);
                } catch (err) {
                  say(`Export failed — ${err.message || "unknown error"}`);
                } finally { setExporting(false); }
              }}>
                {exporting ? "Building…" : "Download Excel workbook"}
              </Btn>
              <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>
                flight-progress-{site.ident}-{key(TODAY)}.xlsx
              </span>
            </div>
            <div style={{ fontSize: 13, color: T.ink2, marginTop: 8 }}>
              Nine sheets: every booking, cancellations on their own, students with their record,
              lesson-by-lesson sign-off, instructors, fleet with downtime, the TA roster, a month-by-month
              summary, and the settings the figures were produced under — so an archived copy can still be
              read years later.
            </div>
          </Section>

          <Section title="Reset">
            <Btn tone="danger" onClick={() => { setCfiCfg(SEED_CFI_CFG); say("CFI metrics back to defaults"); }}>
              Back to defaults
            </Btn>
          </Section>
        </>
      )}

      {tab === "syllabus" && (
        <Section title="Syllabus lessons"
          right={<select value={course} onChange={(e) => setCourse(e.target.value)}>
            {Object.keys(syllabi).map((c) => <option key={c} value={c}>{c} — {syllabi[c].name}</option>)}
          </select>}>
          <div style={{ fontSize: 13, color: T.ink2, marginBottom: 8 }}>
            Renaming a lesson updates it everywhere. Removing one re-indexes completed lessons for all{" "}
            {students.filter((s) => s.course === course).length} {course} students.
          </div>
          <div className="grid sm:grid-cols-2 gap-x-4">
            {syl.lessons.map((l, i) => (
              <div key={i} className="flex items-center gap-2 py-1" style={{ borderTop: `1px solid ${T.lineSoft}` }}>
                <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3), width: 62 }}>{lessonCode(course, i)}</span>
                <input value={l} onChange={(e) => renameLesson(course, i, e.target.value)} style={{ flex: 1, minWidth: 0 }} />
                <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3), width: 41, textAlign: "right" }}>
                  {students.filter((s) => s.course === course && s.done.includes(i)).length}✓
                </span>
                <button onClick={() => removeLesson(course, i)} title="Remove lesson" style={{ color: tx(T.red), fontFamily: FONT_MONO, fontSize: 13 }}>✕</button>
              </div>
            ))}
          </div>
          <div className="flex items-center gap-2 mt-3">
            <input value={newLesson} placeholder="New lesson name" onChange={(e) => setNewLesson(e.target.value)} style={{ minWidth: 220 }} />
            <Btn tone="solid" onClick={() => { addLesson(course, newLesson.trim()); setNewLesson(""); }}>Add lesson</Btn>
          </div>
        </Section>
      )}
    </div>
  );
}

/* =========================== INSTRUCTORS ============================== */

function InstructorsView({ activeInstructor, setActiveInstructor, students, bookings, setSel, lastFlown, daysSince,
  instructors, setInsAvailability, addInsTimeOff, removeInsTimeOff, setActiveStudent, setView }) {
  const ins = insById(activeInstructor);
  const [tab, setTab] = useState("students");
  const [toStart, setToStart] = useState(key(TODAY));
  const [toEnd, setToEnd] = useState(key(addDays(TODAY, 1)));
  const [reason, setReason] = useState("");

  const roster = students.filter((s) => s.instructorId === ins.id);
  const today = key(TODAY);
  const upcoming = bookings.filter((b) => b.instructorId === ins.id && b.date >= today && b.status === "scheduled")
    .sort((a, b) => (a.date === b.date ? toMin(a.start) - toMin(b.start) : a.date < b.date ? -1 : 1));
  const week = upcoming.filter((b) => b.date <= key(addDays(TODAY, 6)));
  const weekMin = week.reduce((a, b) => a + dur(b), 0);
  const airMin = week.reduce((a, b) => a + b.segments.filter((s) => kindById(s.kindId).counts === "air").reduce((x, s) => x + s.minutes, 0), 0);
  const coveringCount = week.filter((b) => {
    const s = students.find((x) => x.id === b.studentId);
    return s && s.instructorId !== ins.id;
  }).length;
  const signedOut = bookings.filter((b) => b.signOutInstructorId === ins.id && OUT(b)).length;

  const nextBookingFor = (sid) => bookings
    .filter((b) => onBooking(b, sid) && b.date >= today && b.status === "scheduled")
    .sort((a, b) => (a.date === b.date ? toMin(a.start) - toMin(b.start) : a.date < b.date ? -1 : 1))[0];

  const TABS = [["students", "Students"], ["schedule", "Availability"]];

  const StudentLine = ({ s, showBar = true }) => {
    const syl = getSyl(s.course);
    const pct = s.done.length / syl.lessons.length;
    const ds = daysSince(lastFlown(s.id, key(addDays(TODAY, 1))), key(TODAY));
    const nb = nextBookingFor(s.id);
    const stalled = ds !== null && ds > 14;
    return (
      <div className="px-3 py-3" style={{ borderTop: `1px solid ${T.lineSoft}` }}>
        <div className="flex flex-wrap items-baseline justify-between gap-2">
          <div className="flex items-center gap-2">
            <button onClick={() => { setActiveStudent(s.id); setView("students"); }}
              style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 15, textAlign: "left" }}>{s.name}</button>
            <Chip color={syl.color} filled>{s.course}</Chip>
            {s.timeOff.length > 0 && <Chip color={T.amber}>TIME OFF FILED</Chip>}
          </div>
          <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: stalled ? tx(T.red) : tx(T.ink3) }}>
            {s.hours.toFixed(1)} H · {ds === null ? "NO FLIGHTS LOGGED" : `LAST FLEW ${ds}D AGO`}
          </span>
        </div>
        {showBar && <div className="mt-2"><Bar value={pct} color={syl.color} /></div>}
        <div className="flex flex-wrap gap-x-4 gap-y-1 mt-1" style={{ fontFamily: FONT_MONO, fontSize: 11, color: T.ink2 }}>
          <span>{s.done.length}/{syl.lessons.length} · {Math.round(pct * 100)}%</span>
          <span>NEXT {s.done.length < syl.lessons.length
            ? `${lessonCode(s.course, s.done.length)} ${syl.lessons[s.done.length].toUpperCase()}` : "SYLLABUS COMPLETE"}</span>
          {nb ? (
            <button onClick={() => setSel({ type: "booking", id: nb.id })}
              style={{ color: tx(T.magenta), textDecoration: "underline" }}>
              {typeById(nb.typeId).code} {fmtDate(nb.date).slice(0, 6)} {nb.start}
              {nb.instructorId !== ins.id ? ` (${insShort(nb.instructorId)})` : ""}
            </button>
          ) : <span style={{ color: tx(T.red) }}>NOTHING BOOKED</span>}
        </div>
      </div>
    );
  };

  return (
    <div className="p-4 sm:p-6">
      {/* instructor picker */}
      <div className="flex flex-wrap gap-2 mb-3">
        {allIns().map((i) => (
          <button key={i.id} onClick={() => setActiveInstructor(i.id)} className="text-left px-3 py-2"
            style={{ border: `1px solid ${i.id === activeInstructor ? T.ink : T.line}`,
              background: i.id === activeInstructor ? T.ink : T.panel,
              color: i.id === activeInstructor ? T.paper : T.ink, borderRadius: 2, minWidth: 150 }}>
            <div style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.12em", opacity: 0.75 }}>
              {i.grade.toUpperCase()}
            </div>
            <div style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 15 }}>{i.name}</div>
          </button>
        ))}
      </div>

      {/* headline */}
      <div className="flex flex-wrap items-baseline gap-3 mb-3">
        <h2 style={{ fontFamily: FONT_UI, fontSize: 20, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase" }}>
          {ins.name}
        </h2>
        <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3) }}>
          {roster.length} ON BOOKS · {hrs(weekMin)} H BOOKED / {hrs(airMin)} H AIRBORNE NEXT 7 DAYS
          {coveringCount ? ` · ${coveringCount} COVERING` : ""}{signedOut ? ` · ${signedOut} OUT NOW` : ""}
        </span>
      </div>

      {/* sub tabs */}

              {upcoming.slice(0, 20).map((b) => {

                const cov = s && s.instructorId !== ins.id;
                return (
                  <button key={b.id} onClick={() => setSel({ type: "booking", id: b.id })}
                    className="w-full text-left py-2 flex items-center gap-3"
                    style={{ borderTop: `1px solid ${T.lineSoft}`,
                      borderLeft: `4px solid ${typeById(b.typeId).color}`, paddingLeft: 8 }}>
                    <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: T.ink2, width: 89 }}>
                      {fmtDate(b.date).slice(0, 6)}<br />{b.start}
                    </span>
                    <span className="min-w-0">
                      <span className="flex items-center gap-2">
                        <span style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 15 }}>
                          {bookingLabel(b, s, partnersOf(b).map((id) => students.find((x) => x.id === id)).filter(Boolean))}
                        </span>
                        {cov && <Chip color={T.violet}>COVERING</Chip>}
                      </span>
                      <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>
                        {typeById(b.typeId).code}{b.course ? ` · ${lessonCode(b.course, b.lesson)}` : ""} · {b.aircraftId ? acById(b.aircraftId).reg : "GROUND"}
                      </span>
                    </span>
                  </button>
                );
              })}
              {upcoming.length === 0 && <div className="py-6" style={{ fontSize: 13, color: T.ink2 }}>Diary is clear.</div>}
            </div>
          </Section>
        </div>
      )}
    </div>
  );
}


/** Read-only week strip showing when someone can fly, and what's blocked. */
function AvailabilityStrip({ availability, timeOff = [], compact = false }) {
  const open = toMin("06:00"), close = toMin("22:00");
  const pct = (m) => ((m - open) / (close - open)) * 100;
  return (
    <div>
      <div className="flex" style={{ marginLeft: 44, marginBottom: 2 }}>
        {[6, 10, 14, 18, 22].map((h) => (
          <span key={h} style={{ position: "relative", left: `${pct(h * 60)}%`, marginLeft: h === 6 ? 0 : -18,
            fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>
            {String(h).padStart(2, "0")}
          </span>
        ))}
      </div>
      {DAY_ABBR.map((d, i) => {
        const w = availability?.[i];
        return (
          <div key={d} className="flex items-center gap-1" style={{ marginBottom: 2 }}>
            <span style={{ fontFamily: FONT_MONO, fontSize: 10, width: 48, color: w ? T.ink : tx(T.ink3) }}>
              {d.toUpperCase()}
            </span>
            <div style={{ position: "relative", flex: 1, height: compact ? 12 : 16,
              background: tint(T.ink3, 0.1), borderRadius: 2, overflow: "hidden" }}>
              {w && (
                <div style={{ position: "absolute", left: `${pct(toMin(w[0]))}%`,
                  width: `${pct(toMin(w[1])) - pct(toMin(w[0]))}%`, top: 0, bottom: 0,
                  background: tint(T.sage, 0.55), borderLeft: `2px solid ${T.sage}` }} />
              )}
              {w && !compact && (
                <span style={{ position: "absolute", left: `${pct(toMin(w[0])) + 1}%`, top: 1,
                  fontFamily: FONT_MONO, fontSize: 10, color: tx(T.sage) }}>
                  {w[0]}–{w[1]}
                </span>
              )}
              {!w && (
                <span style={{ position: "absolute", left: 6, top: compact ? 0 : 1,
                  fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>unavailable</span>
              )}
            </div>
          </div>
        );
      })}
      {timeOff.length > 0 && (
        <div className="mt-2">
          <Label style={{ color: tx(T.amber) }}>Blocked dates</Label>
          <div className="flex flex-wrap gap-1 mt-1">
            {timeOff.map((t) => (
              <span key={t.id} title={t.reason} style={{ fontFamily: FONT_MONO, fontSize: 10,
                border: `1px solid ${T.amber}`, color: tx(T.amber), borderRadius: 2, padding: "0px 6px" }}>
                {t.start === t.end ? fmtDate(t.start).slice(0, 9) : `${fmtDate(t.start).slice(0, 9)} → ${fmtDate(t.end).slice(0, 9)}`}
              </span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

                </div>

function ProgressView({ students, bookings, lastFlown, daysSince, setActiveStudent, setView }) {
  const [course, setCourse] = useState("all");
  const [sort, setSort] = useState("progress");

  const rows = students.filter((s) => course === "all" || s.course === course).map((s) => {
    const syl = getSyl(s.course);
    const pct = s.done.length / syl.lessons.length;
    const recent = bookings.filter((b) => onBooking(b, s.id) &&
      b.status === "flown" && b.date >= key(addDays(TODAY, -30)));
    const sum = (counts) => recent.reduce((a, b) =>
      a + b.segments.filter((x) => kindById(x.kindId).counts === counts).reduce((y, x) => y + x.minutes, 0), 0);
    const perWeek = recent.length / 4.3;
    const remaining = syl.lessons.length - s.done.length;
    const weeksLeft = perWeek > 0 ? Math.ceil(remaining / perWeek) : null;
    const ds = daysSince(lastFlown(s.id, key(addDays(TODAY, 1))), key(TODAY));
    const upcoming = bookings.filter((b) => onBooking(b, s.id) && b.date >= key(TODAY) && b.status === "scheduled").length;
    return { s, syl, pct, perWeek, remaining, weeksLeft, ds, upcoming, airMin: sum("air"), groundMin: sum("ground"), adminMin: sum("admin") };
  }).sort((a, b) => (sort === "progress" ? b.pct - a.pct : sort === "stalled" ? (b.ds ?? 999) - (a.ds ?? 999) : a.s.name.localeCompare(b.s.name)));

  return (
    <div className="p-4 sm:p-6">
      <div className="flex flex-wrap items-end gap-3 mb-4">

        <div>
          <Label>Sort by</Label>
          <select value={sort} onChange={(e) => setSort(e.target.value)} className="block mt-1">
            <option value="progress">Furthest along</option>
            <option value="stalled">Longest since flying</option>
            <option value="name">Name</option>
          </select>
        </div>
        <div className="ml-auto" style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3) }}>PACE AND HOURS FROM THE LAST 30 DAYS</div>
      </div>

      <div className="grid gap-3 md:grid-cols-2 xl:grid-cols-3">
        {rows.map(({ s, syl, pct, perWeek, remaining, weeksLeft, ds, upcoming, airMin, groundMin, adminMin }) => {
          const stalled = ds !== null && ds > 14;
          return (
            <div key={s.id} style={{ border: `1px solid ${T.line}`, borderTop: `3px solid ${syl.color}`, background: T.panel, padding: 12 }}>
              <div className="flex items-baseline justify-between gap-2">
                <button onClick={() => { setActiveStudent(s.id); setView("students"); }}
                  style={{ fontFamily: FONT_UI, fontWeight: 700, fontSize: 20, textAlign: "left" }}>{s.name}</button>
                <span style={{ fontFamily: FONT_MONO, fontSize: 20, color: tx(syl.color) }}>{Math.round(pct * 100)}%</span>
              </div>
              <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3), letterSpacing: "0.06em", marginBottom: 6 }}>
                {s.course.toUpperCase()} · {insShort(s.instructorId).toUpperCase()} · {s.hours.toFixed(1)} H LOGGED
              </div>
              <Bar value={pct} color={syl.color} height={8} />
              <dl className="grid grid-cols-2 gap-x-3 gap-y-1 mt-3" style={{ fontSize: 13 }}>
                <dt style={{ color: tx(T.ink3) }}>Lessons done</dt>
                <dd style={{ fontFamily: FONT_MONO, textAlign: "right" }}>{s.done.length}/{syl.lessons.length}</dd>
                <dt style={{ color: tx(T.ink3) }}>Air 30 d</dt>
                <dd style={{ fontFamily: FONT_MONO, textAlign: "right" }}>{hrs(airMin)} h</dd>
                <dt style={{ color: tx(T.ink3) }}>Ground 30 d</dt>
                <dd style={{ fontFamily: FONT_MONO, textAlign: "right" }}>{hrs(groundMin)} h</dd>
                <dt style={{ color: tx(T.ink3) }}>Admin 30 d</dt>
                <dd style={{ fontFamily: FONT_MONO, textAlign: "right" }}>{hrs(adminMin)} h</dd>
                <dt style={{ color: tx(T.ink3) }}>Current pace</dt>
                <dd style={{ fontFamily: FONT_MONO, textAlign: "right" }}>{perWeek.toFixed(1)}/wk</dd>
                <dt style={{ color: tx(T.ink3) }}>On the books</dt>
                <dd style={{ fontFamily: FONT_MONO, textAlign: "right", color: upcoming ? T.ink : tx(T.red) }}>{upcoming}</dd>

                {remaining === 0 ? "Syllabus complete — ready to recommend for the flight test."
                  : weeksLeft === null ? "No recent flights to project from. Book a lesson to restart the clock."
                  : `${remaining} lessons left — roughly ${weeksLeft} weeks at this pace.`}
                {stalled && <div style={{ marginTop: 4 }}>{ds} days since the last flight. Currency is slipping.</div>}

/** Re-flag a schedule after hand edits: double-booking, closing then opening,
    the same shift twice running, and anyone marked unavailable. */
function recheckTa(schedule, shifts, exceptions, days) {
  const live = shifts.filter((s) => s.enabled);
  if (!live.length) return [];
  const FIRST = live[0].id, LAST = live[live.length - 1].id;
  const idx = {}; live.forEach((s, i) => (idx[s.id] = i));
  const out = [];
  days.forEach((d, di) => {
    const today = schedule[d] || {};
    const seen = {};
    live.forEach((s) => (today[s.id] || []).forEach((n) => {
      if (seen[n]) out.push({ date: d, shiftId: s.id, name: n, note: "twice in one day" });
      seen[n] = s.id;
      if (exceptions.some((e) => e.name === n && e.dates.includes(d) && e.shiftIds.includes(s.id)))
        out.push({ date: d, shiftId: s.id, name: n, note: "marked unavailable" });
    }));
    if (di === 0) return;
    const prevDay = schedule[days[di - 1]] || {};
    const prevOf = {};
    live.forEach((s) => (prevDay[s.id] || []).forEach((n) => (prevOf[n] = s.id)));
    live.forEach((s) => (today[s.id] || []).forEach((n) => {
      const prev = prevOf[n];
      if (prev === undefined) return;
      if (prev === LAST && s.id === FIRST) out.push({ date: d, shiftId: s.id, name: n, prevShift: prev, note: "closed then opened" });
      else if (prev === s.id) out.push({ date: d, shiftId: s.id, name: n, prevShift: prev, note: "same shift twice" });
    }));
  });
  return out;
}

function TAView(props) {
  const { site, taShifts, setTaShifts, taTemplates, setTaTemplates, taExceptions, setTaExceptions,
    taSlots, setTaSlots, taResult, setTaResult, taPeriodId, setTaPeriodId, say, taskBands,
    taPeriods, activeTaPeriod, taCycle, setTaCycle, setBoardDate, setView, cfiCfg } = props;

  const period = activeTaPeriod;
  const days = useMemo(() => datesIn(period), [period.id]);
  const [selDate, setSelDate] = useState(days[0]);
  useEffect(() => { setSelDate(days[0]); }, [period.id]);

  const { shifts: dayShifts, sunriseH } = taShiftsForDate(selDate, taShifts, site.lat, site.lon);
  const live = taShifts.filter((s) => s.enabled);

  /* availability form */
  const [tName, setTName] = useState("");
  const [tShifts, setTShifts] = useState([]);
  const [tDays, setTDays] = useState([]);
  /* unavailability form */
  const [xName, setXName] = useState("");
  const [xDates, setXDates] = useState([]);
  const [xShifts, setXShifts] = useState([]);
  const [dragTa, setDragTa] = useState(null);
  const [dragOver, setDragOver] = useState(null);

  const toggle = (arr, v, set) => set(arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);

  const bareMin = live.reduce((a, s) => a + (taSlots[s.id] || 0), 0);
  const staffBuffer = Number(cfiCfg?.staffBuffer) || STAFFING_BUFFER;
  const people = Math.max(1, Math.ceil(bareMin * staffBuffer));
  const dailyHours = dayShifts.reduce((a, s) => a + (s.end - s.start) * (taSlots[s.id] || 0), 0);
  const weeklyHours = dailyHours * 7;
  const perPerson = people > 0 ? weeklyHours / people : 0;

  /* who can cover each shift on the selected day */
  const rosterFor = (sid) => {
    const wd = parseKey(selDate).getDay();
    const off = new Set(taExceptions.filter((e) => e.dates.includes(selDate) && e.shiftIds.includes(sid)).map((e) => e.name));
    return taTemplates.filter((t) => t.shiftIds.includes(sid) && t.days.includes(wd) && !off.has(t.name)).map((t) => t.name);
  };

  const gaps = useMemo(() => {
    const out = [];
    days.forEach((d) => {
      const wd = parseKey(d).getDay();
      live.forEach((s) => {
        const need = taSlots[s.id] || 0;
        if (need <= 0) return;
        const off = new Set(taExceptions.filter((e) => e.dates.includes(d) && e.shiftIds.includes(s.id)).map((e) => e.name));
        const have = taTemplates.filter((t) => t.shiftIds.includes(s.id) && t.days.includes(wd) && !off.has(t.name)).length;
        if (have < need) out.push({ date: d, shift: s, have, need });
      });
    });
    return out;
  }, [days, live, taSlots, taTemplates, taExceptions]);

  const run = () => {
    const res = generateTaSchedule({ shifts: taShifts, templates: taTemplates, exceptions: taExceptions, slots: taSlots, days });
    const pinned = taResult?.pinned || {};
    /* keep every other period untouched, and keep any cell edited by hand */
    const merged = {};
    Object.entries(taResult?.schedule || {}).forEach(([d, byShift]) => {
      merged[d] = {};
      Object.entries(byShift).forEach(([sid, list]) => (merged[d][sid] = list.slice()));
    });
    let kept = 0;
    days.forEach((d) => {
      merged[d] = merged[d] || {};
      Object.entries(res.schedule[d] || {}).forEach(([sid, list]) => {
        if (pinned[`${d}|${sid}`]) { kept++; return; }
        merged[d][sid] = list.slice();
      });
    });
    const others = (taResult?.violations || []).filter((v) => !days.includes(v.date));
    setTaResult({ ...taResult, schedule: merged,
      violations: [...others, ...recheckTa(merged, taShifts, taExceptions, days)] });
    say(kept
      ? `Rostered ${days.length} days — ${kept} hand-edited ${kept === 1 ? "shift" : "shifts"} left alone`
      : `Rostered ${days.length} days — now showing on the schedule board`);
  };

  /** Move someone between shifts, then re-flag anything the move broke. */
  const moveTa = (from, to) => {
    if (!schedule || (from.date === to.date && from.shiftId === to.shiftId)) return;
    const next = {};
    Object.entries(schedule).forEach(([d, byShift]) => {
      next[d] = {};
      Object.entries(byShift).forEach(([sid, names]) => (next[d][sid] = names.slice()));
    });
    const src = next[from.date]?.[from.shiftId];
    if (!src) return;
    const i = src.indexOf(from.name);
    if (i < 0) return;
    src.splice(i, 1);
    const dst = next[to.date][to.shiftId] || (next[to.date][to.shiftId] = []);
    /* dropping onto a name swaps the two, otherwise it just moves in */
    if (to.name && to.name !== from.name) {
      const j = dst.indexOf(to.name);
      if (j >= 0) { dst.splice(j, 1, from.name); src.splice(i, 0, to.name); }
      else dst.push(from.name);
    } else if (!dst.includes(from.name)) dst.push(from.name);

    setTaResult({ ...taResult, schedule: next,
      pinned: { ...(taResult?.pinned || {}),
        [`${from.date}|${from.shiftId}`]: true, [`${to.date}|${to.shiftId}`]: true },
      violations: recheckTa(next, taShifts, taExceptions, days) });
    say(`${from.name} moved — this shift is now pinned`);
  };

  /* the roster persists across periods — show whatever exists for these dates */
  const hasRoster = days.some((d) => taResult?.schedule?.[d]);
  const schedule = hasRoster ? taResult.schedule : null;
  const violations = (taResult?.violations || []).filter((v) => days.includes(v.date));
  const pinnedCount = Object.keys(taResult?.pinned || {}).filter((k) => days.includes(k.split("|")[0])).length;

  /* timeline geometry: 05:00 through 25:00 */
  const AX0 = 5, AX1 = 25;
  const axPct = (h) => ((h - AX0) / (AX1 - AX0)) * 100;

  return (
    <div className="p-4 sm:p-6 space-y-4">
      {/* cycle setup + period tabs */}
      <div className="flex flex-wrap items-end gap-3">
        <div>
          <Label>Cycle starts</Label>
          <input type="date" className="block mt-1" value={taCycle.anchor}
            onChange={(e) => e.target.value && setTaCycle({ ...taCycle, anchor: e.target.value })} />
        </div>
        <div>
          <Label>Cycle length</Label>
          <select className="block mt-1" value={taCycle.length}
            onChange={(e) => setTaCycle({ ...taCycle, length: Number(e.target.value) })}>
            {[7, 10, 14, 21, 28].map((n) => <option key={n} value={n}>{n} days</option>)}
          </select>
        </div>
        <div>
          <Label>Custom length</Label>
          <input type="number" min={1} max={60} className="block mt-1" style={{ width: 76, textAlign: "right" }}
            value={taCycle.length}
            onChange={(e) => setTaCycle({ ...taCycle, length: Math.max(1, Math.min(60, Number(e.target.value) || 1)) })} />
        </div>
        <Btn onClick={() => setTaCycle({ anchor: key(mondayOf(TODAY)), length: 14 })}>Reset to this Monday</Btn>
        <span style={{ fontSize: 13, color: T.ink2, paddingBottom: 5 }}>
          Availability and time off are filed against whichever period is selected.
        </span>
      </div>

      <div className="flex flex-wrap gap-1">
        {taPeriods.slice(0, 10).map((p) => (
          <button key={p.id} onClick={() => setTaPeriodId(p.id)} style={{
            fontFamily: FONT_MONO, fontSize: 11, padding: "4px 8px", borderRadius: 2,
            border: `1px solid ${p.id === period.id ? T.ink : T.line}`,
            background: p.id === period.id ? T.ink : T.panel,
            color: p.id === period.id ? T.paper : T.ink2 }}>{p.label}</button>
        ))}
      </div>

      {/* staffing estimate */}
      <Section title="Staffing estimate"
        right={<span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3) }}>
          {bareMin} SEATS/DAY × {staffBuffer} BUFFER = {people} · {dailyHours.toFixed(1)} H/DAY × 7 = {weeklyHours.toFixed(1)} H/WK
        </span>}>
        <div className="flex flex-wrap gap-6">
          <div>
            <div style={{ fontFamily: FONT_UI, fontSize: 34, fontWeight: 700, color: tx(T.magenta), lineHeight: 1 }}>{people}</div>
            <Label>{staffPlural()} needed</Label>
          </div>
          <div>
            <div style={{ fontFamily: FONT_UI, fontSize: 34, fontWeight: 700, lineHeight: 1 }}>{perPerson.toFixed(1)}</div>
            <Label>hrs / week each</Label>
          </div>
          <div>
            <div style={{ fontFamily: FONT_UI, fontSize: 34, fontWeight: 700, lineHeight: 1 }}>{taTemplates.length}</div>

                  onChange={(e) => setTaSlots({ ...taSlots, [s.id]: Math.max(0, Number(e.target.value) || 0) })} />
                <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3), marginLeft: 4 }}>SEATS</span>
              </div>
            </div>
          ))}

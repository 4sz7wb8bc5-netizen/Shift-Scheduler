        {/* timeline */}
        <div className="mt-4" style={{ position: "relative", height: 16 }}>
          {Array.from({ length: AX1 - AX0 + 1 }, (_, i) => AX0 + i).filter((h) => h % 2 === 0).map((h) => (
            <span key={h} style={{ position: "absolute", left: `${axPct(h)}%`, fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>
              {String(h % 24).padStart(2, "0")}
            </span>
          ))}
        </div>
        <div style={{ position: "relative", height: dayShifts.length * 26, border: `1px solid ${T.line}`, background: T.panelAlt }}>

          {dayShifts.map((s, i) => (
            <div key={s.id} title={`${s.name} ${fmtH(s.start)}–${fmtH(s.end)}`}
              style={{ position: "absolute", top: i * 26 + 3, height: 20,
                left: `${axPct(s.start)}%`, width: `${axPct(s.end) - axPct(s.start)}%`,
                background: tint(s.color, 0.3), borderLeft: `4px solid ${s.color}`, borderRadius: 2,
                fontFamily: FONT_MONO, fontSize: 10, color: T.ink, padding: "2px 6px", overflow: "hidden", whiteSpace: "nowrap" }}>
              {s.name} {fmtH(s.start)}–{fmtH(s.end)}
            </div>
          ))}
          {/* the task hours sit on top of the shift bars */}
          {/* a task window only marks the shifts it actually runs into */}
          {dayShifts.map((s, i) => taskBands.filter(bandOnTa).map((t) => {
            const a = Math.max(hDec(toMin(t.start)), s.start), b = Math.min(hDec(toMin(t.end)), s.end);
            if (b <= a) return null;
            return (
              <div key={s.id + t.id} className="absolute flex items-center justify-center"
                title={`${s.name} — ${t.label} ${t.start}–${t.end}`}
                style={{ top: i * 26 + 3, height: 20, left: `${axPct(a)}%`, width: `${axPct(b) - axPct(a)}%`,
                  background: tint(t.color, 0.55), border: `1px solid ${t.color}`, borderRadius: 2, zIndex: 3,
                  overflow: "hidden" }}>
                <span style={{ fontFamily: FONT_MONO, fontSize: 10, fontWeight: 700, color: tx(t.color),
                  whiteSpace: "nowrap" }}>
                  {t.label}
                </span>
              </div>
            );
          }))}
        </div>
        <div className="flex flex-wrap items-center gap-x-4 gap-y-1 mt-2">
          {taskBands.filter(bandOnTa).map((t) => (
            <span key={t.id} className="flex items-center gap-2">
              <span style={{ width: 16, height: 10, display: "inline-block",
                background: tint(t.color, 0.55), border: `1px solid ${t.color}` }} />
              <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(t.color) }}>
                {t.label}
              </span>
            </span>
          ))}
        </div>

        <div className="flex flex-wrap gap-1 mt-3">
          {days.map((d) => (
            <button key={d} onClick={() => setSelDate(d)} style={{
              fontFamily: FONT_MONO, fontSize: 10, padding: "2px 6px", borderRadius: 2,
              border: `1px solid ${d === selDate ? T.ink : T.line}`,
              background: d === selDate ? T.ink : T.panel,
              color: d === selDate ? T.paper : d === key(TODAY) ? T.magenta : T.ink2 }}>
              {DOW[parseKey(d).getDay()].toUpperCase()} {String(parseKey(d).getDate()).padStart(2, "0")}
            </button>
          ))}
        </div>
      </Section>

      <div className="grid gap-4 lg:grid-cols-2">
        {/* availability */}
        <Section title="Weekly availability"
          right={<span style={{ fontSize: 13, color: T.ink2 }}>Applies to {period.label} only.</span>}>
          <Label>Name</Label>
          <input className="w-full mt-1" value={tName} placeholder="Full name" onChange={(e) => setTName(e.target.value)} />

          <div className="flex items-baseline justify-between mt-3">
            <Label>Shifts they can cover</Label>
            <button onClick={() => setTShifts(tShifts.length === live.length ? [] : live.map((s) => s.id))}
              style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.magenta) }}>
              {tShifts.length === live.length ? "CLEAR" : "ALL"}
            </button>
          </div>
          <div className="flex flex-wrap gap-1 mt-1">
            {live.map((s) => (
              <button key={s.id} onClick={() => toggle(tShifts, s.id, setTShifts)} style={{
                fontFamily: FONT_UI, fontSize: 13, fontWeight: 600, padding: "2px 8px", borderRadius: 2,
                border: `1px solid ${tShifts.includes(s.id) ? s.color : T.line}`,
                background: tShifts.includes(s.id) ? s.color : "transparent",
                color: tShifts.includes(s.id) ? "#fff" : T.ink2 }}>{s.name}</button>
            ))}
          </div>

          <div className="flex items-baseline justify-between mt-3">
            <Label>Days</Label>
            <button onClick={() => setTDays(tDays.length === 7 ? [] : [0, 1, 2, 3, 4, 5, 6])}
              style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.magenta) }}>
              {tDays.length === 7 ? "CLEAR" : "ALL"}
            </button>
          </div>
          <div className="flex flex-wrap gap-1 mt-1">
            {[1, 2, 3, 4, 5, 6, 0].map((d) => (
              <button key={d} onClick={() => toggle(tDays, d, setTDays)} style={{
                fontFamily: FONT_MONO, fontSize: 12, padding: "2px 8px", borderRadius: 2,
                border: `1px solid ${tDays.includes(d) ? T.ink : T.line}`,
                background: tDays.includes(d) ? T.ink : "transparent",
                color: tDays.includes(d) ? T.paper : T.ink2 }}>{DOW[d]}</button>
            ))}
          </div>

          <div className="mt-3">
            <Btn tone="solid" disabled={!tName.trim() || !tShifts.length || !tDays.length}
              onClick={() => {
                const name = tName.trim();
                setTaTemplates([...taTemplates.filter((t) => t.name !== name),
                  { id: uid("tt"), name, shiftIds: [...tShifts], days: [...tDays] }]);
                setTName(""); setTShifts([]); setTDays([]);
                say(`${name} saved to the roster`);
              }}>Save availability</Btn>
            <span style={{ fontSize: 12, color: tx(T.ink3), marginLeft: 8 }}>
              Pick broadly, then mark specific dates off below.
            </span>
          </div>

          <div className="mt-3">
            {taTemplates.length === 0 && <div style={{ fontSize: 13, color: T.ink2 }}>Nobody on the roster yet.</div>}
            {taTemplates.map((t) => (
              <div key={t.id} className="flex flex-wrap items-center gap-2 py-2" style={{ borderTop: `1px solid ${T.lineSoft}` }}>
                <span style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 15 }}>{t.name}</span>
                <span className="flex gap-1">
                  {t.shiftIds.map((id) => {
                    const s = taShifts.find((x) => x.id === id);
                    return s ? <Chip key={id} color={s.color}>{s.name.replace("Shift ", "S")}</Chip> : null;
                  })}
                </span>
                <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3) }}>
                  {t.days.length === 7 ? "EVERY DAY" : [1,2,3,4,5,6,0].filter((d) => t.days.includes(d)).map((d) => DOW[d].toUpperCase()).join(" ")}
                </span>
                <Btn small tone="danger" onClick={() => setTaTemplates(taTemplates.filter((x) => x.id !== t.id))}>Remove</Btn>
              </div>
            ))}
          </div>
        </Section>

        {/* unavailability */}
        <Section title="Mark unavailable"
          right={<span style={{ fontSize: 13, color: T.ink2 }}>One-off — always honoured.</span>}>
          <Label>Name</Label>
          <select className="w-full mt-1" value={xName} onChange={(e) => setXName(e.target.value)}>
            <option value="">— pick someone —</option>
            {[...new Set(taTemplates.map((t) => t.name))].map((n) => <option key={n} value={n}>{n}</option>)}
          </select>

          <Label style={{ marginTop: 12 }}>Dates</Label>
          <div className="flex flex-wrap gap-1 mt-1">
            {days.map((d) => (
              <button key={d} onClick={() => toggle(xDates, d, setXDates)} style={{
                fontFamily: FONT_MONO, fontSize: 10, padding: "2px 6px", borderRadius: 2,
                border: `1px solid ${xDates.includes(d) ? T.red : T.line}`,
                background: xDates.includes(d) ? T.red : "transparent",
                color: xDates.includes(d) ? "#fff" : T.ink2 }}>
                {String(parseKey(d).getDate()).padStart(2, "0")}
              </button>
            ))}
          </div>

          <Label style={{ marginTop: 12 }}>Can't work</Label>
          <div className="flex flex-wrap gap-1 mt-1">
            {live.map((s) => (
              <button key={s.id} onClick={() => toggle(xShifts, s.id, setXShifts)} style={{
                fontFamily: FONT_UI, fontSize: 13, fontWeight: 600, padding: "2px 8px", borderRadius: 2,
                border: `1px solid ${xShifts.includes(s.id) ? T.red : T.line}`,
                background: xShifts.includes(s.id) ? T.red : "transparent",
                color: xShifts.includes(s.id) ? "#fff" : T.ink2 }}>{s.name}</button>
            ))}
          </div>

          <div className="mt-3">
            <Btn tone="solid" disabled={!xName || !xDates.length || !xShifts.length}
              onClick={() => {
                setTaExceptions([...taExceptions, { id: uid("tx"), name: xName, dates: [...xDates], shiftIds: [...xShifts] }]);
                setXDates([]); setXShifts([]);
                say(`${xName} marked unavailable`);
              }}>Save</Btn>
          </div>

          <div className="mt-3">
            {taExceptions.length === 0 && <div style={{ fontSize: 13, color: T.ink2 }}>Nothing marked off.</div>}
            {taExceptions.map((x) => (
              <div key={x.id} className="flex flex-wrap items-center gap-2 py-2" style={{ borderTop: `1px solid ${T.lineSoft}` }}>
                <span style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 13 }}>{x.name}</span>
                <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.red) }}>
                  {x.dates.length} {x.dates.length === 1 ? "date" : "dates"}
                </span>
                <span className="flex gap-1">
                  {x.shiftIds.map((id) => {
                    const s = taShifts.find((y) => y.id === id);
                    return s ? <Chip key={id} color={T.ink3}>{s.name.replace("Shift ", "S")}</Chip> : null;
                  })}
                </span>
                <Btn small tone="danger" onClick={() => setTaExceptions(taExceptions.filter((y) => y.id !== x.id))}>Remove</Btn>
              </div>
            ))}
          </div>
        </Section>
      </div>

      {/* roster for the selected day */}
      <Section title={`Who can cover — ${fmtDate(selDate)}`}>
        <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
          {live.map((s) => {
            const names = rosterFor(s.id);
            const need = taSlots[s.id] || 0;
            const short = names.length < need;
            return (
              <div key={s.id} style={{ border: `1px solid ${T.line}`, borderTop: `3px solid ${s.color}`, padding: 10, background: T.panel }}>
                <div className="flex items-baseline justify-between">
                  <span style={{ fontFamily: FONT_UI, fontWeight: 700, fontSize: 15 }}>{s.name}</span>
                  <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: short ? tx(T.red) : tx(T.sage) }}>
                    {names.length}/{need}
                  </span>
                </div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3), marginBottom: 6 }}>
                  {fmtH(s.id === live[0].id ? (dayShifts[0]?.start ?? s.start) : s.start)}–{fmtH(s.end)}
                </div>
                {names.length === 0 && <div style={{ fontSize: 13, color: tx(T.red) }}>Nobody available.</div>}
                {names.map((n) => (
                  <div key={n} style={{ fontSize: 13, borderTop: `1px solid ${T.lineSoft}`, padding: "2px 0px" }}>{n}</div>
                ))}
              </div>
            );
          })}
        </div>
      </Section>

      {/* coverage gaps */}
      {gaps.length > 0 && (
        <Section title="Coverage gaps" right={<Chip color={T.red}>{gaps.length}</Chip>}>
          <div className="flex flex-wrap gap-2">
            {gaps.slice(0, 40).map((g, i) => (
              <span key={i} style={{ fontFamily: FONT_MONO, fontSize: 11, border: `1px solid ${T.red}`,
                color: tx(T.red), borderRadius: 2, padding: "2px 6px" }}>
                {fmtDate(g.date).slice(0, 9)} {g.shift.name.replace("Shift ", "S")} {g.have}/{g.need}
              </span>
            ))}
          </div>
          {gaps.length > 40 && <div style={{ fontSize: 12, color: tx(T.ink3), marginTop: 6 }}>+{gaps.length - 40} more</div>}
        </Section>
      )}

      {/* generate */}
      <Section title="Generate schedule"
        right={
          <span className="flex items-center gap-2">
            {schedule && (
              <Btn onClick={() => {
                const t = key(TODAY);
                setBoardDate(t >= period.start && t <= period.end ? t : period.start);
                setView("board");
              }}>View on schedule</Btn>
            )}
            <Btn tone="accent" onClick={run}>Build {period.label}</Btn>
          </span>
        }>
        {schedule && (
          <div className="mb-3 px-3 py-2" style={{ border: `1px solid ${T.sage}`, borderLeft: `4px solid ${T.sage}`, borderRadius: 2 }}>
            <div style={{ fontSize: 13 }}>
              This roster is live on the schedule board — the {staffPlural().toLowerCase()} lane shows these names for
              {" "}{fmtDate(period.start)} through {fmtDate(period.end)}.
            </div>
            <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3), marginTop: 2 }}>
              DRAG A NAME TO ANOTHER SHIFT TO MOVE IT · DROP ON A NAME TO SWAP
            </div>
            {pinnedCount > 0 && (
              <div className="flex flex-wrap items-center gap-2 mt-2">
                <span style={{ fontSize: 12, color: T.ink2 }}>
                  {pinnedCount} {pinnedCount === 1 ? "shift has" : "shifts have"} been edited by hand and will be left
                  alone if you generate again.
                </span>
                <Btn small onClick={() => {
                  const next = { ...(taResult.pinned || {}) };
                  days.forEach((d) => live.forEach((sh) => delete next[`${d}|${sh.id}`]));
                  setTaResult({ ...taResult, pinned: next });
                  say("Hand edits released — generating will rebuild them");
                }}>Release them</Btn>
              </div>
            )}
          </div>
        )}
        <div style={{ fontSize: 13, color: T.ink2, marginBottom: 10 }}>
          One weekly pattern repeated across the period. Balances workload rather than first-come-first-served,
          never double-books someone in a day, and never lets someone open the morning after they closed.
          The 1→2→3→4 rotation is followed unless there's no other way to fill a seat — every exception is flagged.
        </div>

        {!schedule && <div style={{ fontSize: 13, color: tx(T.ink3) }}>Nothing built for {period.label} yet.</div>}

        {schedule && (
          <div className="overflow-x-auto">
            <table style={{ borderCollapse: "collapse", minWidth: 620, width: "100%" }}>
              <thead>
                <tr style={{ background: T.panelAlt }}>
                  <Th>Date</Th>
                  {live.map((s) => <Th key={s.id}>{s.name}</Th>)}
                </tr>
              </thead>
              <tbody>
                {days.map((d) => (
                  <tr key={d} style={{ borderBottom: `1px solid ${T.lineSoft}`,
                    background: d === key(TODAY) ? tint(T.magenta, 0.06) : "transparent" }}>
                    <td style={{ padding: "4px 8px", fontFamily: FONT_MONO, fontSize: 11, whiteSpace: "nowrap" }}>
                      {DOW[parseKey(d).getDay()].toUpperCase()} {String(parseKey(d).getDate()).padStart(2, "0")}
                    </td>
                    {live.map((s) => {
                      const names = (schedule[d] || {})[s.id] || [];
                      const need = taSlots[s.id] || 0;
                      const isTarget = dragTa && dragOver && dragOver.date === d && dragOver.shiftId === s.id;
                      const isPinned = !!taResult?.pinned?.[`${d}|${s.id}`];
                      return (
                        <td key={s.id}
                          onDragOver={(e) => { e.preventDefault(); setDragOver({ date: d, shiftId: s.id }); }}
                          onDragLeave={() => setDragOver(null)}
                          onDrop={(e) => { e.preventDefault(); if (dragTa) moveTa(dragTa, { date: d, shiftId: s.id }); setDragTa(null); setDragOver(null); }}
                          title={isPinned ? "Edited by hand — generating again won't change this" : ""}
                          style={{ padding: "2px 6px", fontSize: 13, verticalAlign: "top",
                            outline: isTarget ? `2px solid ${T.ink}` : "none",
                            borderLeft: isPinned ? `3px solid ${T.ink}` : "none",
                            background: isTarget ? tint(T.ink, 0.1)
                              : names.length < need ? tint(T.red, 0.08) : tint(s.color, 0.07) }}>
                          {names.map((n) => {
                            const v = violations.find((x) => x.date === d && x.shiftId === s.id && x.name === n);
                            const held = dragTa && dragTa.name === n && dragTa.date === d && dragTa.shiftId === s.id;
                            return (
                              <div key={n} draggable
                                onDragStart={() => setDragTa({ date: d, shiftId: s.id, name: n })}
                                onDragEnd={() => { setDragTa(null); setDragOver(null); }}
                                onDrop={(e) => { e.preventDefault(); e.stopPropagation();
                                  if (dragTa) moveTa(dragTa, { date: d, shiftId: s.id, name: n });
                                  setDragTa(null); setDragOver(null); }}
                                title={v ? v.note || "Rotation relaxed to fill this seat" : "Drag to another shift to move; drop on a name to swap"}
                                style={{ whiteSpace: "nowrap", cursor: "grab", opacity: held ? 0.4 : 1,
                                  borderRadius: 2, padding: "0px 4px", marginBottom: 1,
                                  border: `1px solid ${v ? T.amber : "transparent"}`,
                                  background: v ? tint(T.amber, 0.14) : tint(s.color, 0.16),
                                  color: v ? tx(T.amber) : T.ink }}>
                                {n}
                              </div>
                            );
                          })}
                          {names.length < need && (
                            <div style={{ color: tx(T.red), fontFamily: FONT_MONO, fontSize: 10,
                              border: `1px dashed ${T.red}`, borderRadius: 2, padding: "0px 4px", textAlign: "center" }}>
                              {need - names.length} SHORT
                            </div>
                          )}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        {violations.length > 0 && (
          <div className="mt-3">
            <div style={{ fontFamily: FONT_UI, fontWeight: 700, fontSize: 13, color: tx(T.amber), marginBottom: 6 }}>
              {violations.length} {violations.length === 1 ? "shift needs" : "shifts need"} a second look
            </div>
            <div className="flex flex-wrap gap-2">
              {violations.slice(0, 30).map((v, i) => {
                const s = taShifts.find((x) => x.id === v.shiftId);
                const p = taShifts.find((x) => x.id === v.prevShift);
                return (
                  <span key={i} style={{ fontFamily: FONT_MONO, fontSize: 10, border: `1px solid ${T.amber}`,
                    color: tx(T.amber), borderRadius: 2, padding: "2px 6px" }}>
                    {fmtDate(v.date).slice(0, 9)} {v.name} → {s ? s.name.replace("Shift ", "S") : "?"}
                    {v.note ? ` — ${v.note}` : p ? ` (was ${p.name.replace("Shift ", "S")})` : " (fresh)"}
                  </span>
                );
              })}
            </div>
          </div>
        )}
      </Section>
    </div>
  );
}

/* ============================ FUEL CALCULATOR ==========================
   Balance the tanks to a desired total, and turn the difference into an
   order figure in both gallons and litres. */

const GAL_TO_L = 3.785411784;
const toL = (gal) => gal * GAL_TO_L;

function FuelCalcView({ fleet, fuelUnit, fuelFor }) {
  const line = fleet.filter((a) => a.status !== "retired" && a.class !== "sim");
  const [acId, setAcId] = useState(line[0]?.id || "");
  const [left, setLeft] = useState(10);
  const [right, setRight] = useState(6);
  const [target, setTarget] = useState(40);

  const ac = acId ? acById(acId) : null;
  const cap = ac ? ac.fuelCap : 0;
  const capPerTank = cap / 2;
  const restriction = ac ? fuelFor(ac.id).amount : "";

  const num = (v) => (v === "" || v === null || Number.isNaN(Number(v)) ? 0 : Number(v));
  const L = num(left), R = num(right), TGT = num(target);
  const onBoard = L + R;
  const perTank = TGT / 2;
  const addL = perTank - L;
  const addR = perTank - R;
  const toOrder = TGT - onBoard;

  const overCap = cap > 0 && TGT > cap;
  const overTank = capPerTank > 0 && perTank > capPerTank;
  const imbalance = addL < 0 || addR < 0;
  const overRestriction = restriction !== "" && TGT > Number(restriction);

  /* a tank already past the target's halfway point can't be levelled by adding —
     the best you can do is fill the other side to match it */
  const matchHigh = Math.max(L, R);
  const matchTotal = matchHigh * 2;

  const Row = ({ label, gal, strong }) => (
    <div className="flex items-baseline justify-between gap-3 py-1" style={{ borderTop: `1px solid ${T.lineSoft}` }}>
      <span style={{ fontSize: strong ? 15 : 13, fontWeight: strong ? 600 : 400, color: strong ? T.ink : T.ink2 }}>{label}</span>
      <span className="flex items-baseline gap-3">
        <span style={{ fontFamily: FONT_MONO, fontSize: strong ? 18 : 13, fontWeight: 600,
          color: strong ? tx(T.amber) : T.ink }}>
          {gal.toFixed(gal % 1 === 0 ? 0 : 1)} gal
        </span>
        <span style={{ fontFamily: FONT_MONO, fontSize: strong ? 15 : 12, color: tx(T.ink3), width: 101, textAlign: "right" }}>
          {toL(gal).toFixed(1)} L
        </span>
      </span>
    </div>
  );

  const TankBar = ({ now, add, capT }) => {
    const pct = (v) => (capT > 0 ? Math.max(0, Math.min(100, (v / capT) * 100)) : 0);
    return (
      <div style={{ height: 14, background: T.lineSoft, borderRadius: 2, overflow: "hidden", display: "flex" }}>
        <div style={{ width: `${pct(now)}%`, background: T.amber }} />
        {add > 0 && <div style={{ width: `${pct(add)}%`, background: tint(T.amber, 0.45) }} />}
      </div>
    );
  };

  return (
    <div className="p-4 sm:p-6 grid gap-4 lg:grid-cols-2" style={{ maxWidth: 1100 }}>
      <Section defaultOpen title="Aircraft & tanks"
        right={<span style={{ fontSize: 13, color: T.ink2 }}>Figures in US gallons.</span>}>
        <div className="flex flex-wrap items-end gap-3">
          <div>
            <Label>Aircraft</Label>
            <select className="block mt-1" value={acId} onChange={(e) => setAcId(e.target.value)}>
              <option value="">— none —</option>
              {line.map((a) => <option key={a.id} value={a.id}>{a.reg} · {a.type}</option>)}
            </select>
          </div>
          {ac && (
            <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3), paddingBottom: 5 }}>
              {cap} gal total · {capPerTank} per tank
              {restriction !== "" ? ` · restriction ${restriction} max` : ""}
            </span>
          )}
        </div>

        <div className="grid sm:grid-cols-2 gap-4 mt-4">
          <div>
            <Label>Left tank now</Label>
            <div className="flex items-center gap-2 mt-1">
              <input type="number" min={0} max={capPerTank || undefined} step="1" value={left}
                onChange={(e) => setLeft(e.target.value)}
                style={{ width: 90, fontSize: 20, fontWeight: 600, textAlign: "right", padding: "4px 8px" }} />
              <span style={{ fontFamily: FONT_MONO, fontSize: 13, color: tx(T.amber) }}>gal</span>
            </div>
            <div className="mt-2"><TankBar now={L} add={Math.max(0, addL)} capT={capPerTank} /></div>
            <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3), marginTop: 2 }}>
              {toL(L).toFixed(1)} L{capPerTank ? ` · ${(capPerTank - L).toFixed(0)} gal space` : ""}
            </div>
          </div>

          <div>
            <Label>Right tank now</Label>
            <div className="flex items-center gap-2 mt-1">
              <input type="number" min={0} max={capPerTank || undefined} step="1" value={right}
                onChange={(e) => setRight(e.target.value)}
                style={{ width: 90, fontSize: 20, fontWeight: 600, textAlign: "right", padding: "4px 8px" }} />
              <span style={{ fontFamily: FONT_MONO, fontSize: 13, color: tx(T.amber) }}>gal</span>
            </div>
            <div className="mt-2"><TankBar now={R} add={Math.max(0, addR)} capT={capPerTank} /></div>
            <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3), marginTop: 2 }}>
              {toL(R).toFixed(1)} L{capPerTank ? ` · ${(capPerTank - R).toFixed(0)} gal space` : ""}
            </div>
          </div>
        </div>

        <div className="mt-4">
          <Label>Desired total on board</Label>
          <div className="flex flex-wrap items-center gap-2 mt-1">
            <input type="number" min={0} max={cap || undefined} step="1" value={target}
              onChange={(e) => setTarget(e.target.value)}
              style={{ width: 110, fontSize: 26, fontWeight: 600, textAlign: "right", padding: "4px 8px", borderColor: T.amber }} />
            <span style={{ fontFamily: FONT_MONO, fontSize: 15, color: tx(T.amber), fontWeight: 600 }}>gal</span>
            {ac && (
              <div className="flex gap-1 ml-auto">
                <Btn small onClick={() => setTarget(cap)}>Full</Btn>
                <Btn small onClick={() => setTarget(Math.round(cap * 0.75))}>¾</Btn>
                <Btn small onClick={() => setTarget(Math.round(cap / 2))}>½</Btn>
                {restriction !== "" && <Btn small onClick={() => setTarget(restriction)}>To restriction</Btn>}
              </div>
            )}
          </div>
        </div>

        {(overCap || overTank || overRestriction || imbalance) && (
          <div className="mt-3" style={{ border: `1px solid ${T.red}`, borderLeft: `4px solid ${T.red}`, padding: "8px 8px", borderRadius: 2 }}>
            <Label style={{ color: tx(T.red) }}>Check this</Label>
            <ul style={{ fontSize: 13, marginTop: 4, listStyle: "none" }}>
              {overCap && <li>— {ac.reg} holds {cap} gal, so {TGT} gal will not fit.</li>}
              {overTank && <li>— {perTank.toFixed(1)} gal per side is over the {capPerTank} gal tank capacity.</li>}
              {overRestriction && <li>— Over the general restriction of {restriction} gal for {ac.reg}.</li>}
              {imbalance && (
                <li>
                  — {addL < 0 ? "Left" : "Right"} tank already holds more than half the target, so the tanks can't be
                  levelled by adding fuel. Filling the other side to match gives {matchTotal.toFixed(0)} gal total.
                </li>
              )}
            </ul>
          </div>
        )}
      </Section>

      <Section defaultOpen title="Uplift"
        right={<span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3) }}>1 US GAL = 3.785 L</span>}>
        <Row label="On board now" gal={onBoard} />
        <Row label="Target per tank" gal={perTank} />
        <Row label={`Add to left${addL < 0 ? " (already over)" : ""}`} gal={Math.max(0, addL)} />
        <Row label={`Add to right${addR < 0 ? " (already over)" : ""}`} gal={Math.max(0, addR)} />

        <div className="mt-4 pt-3" style={{ borderTop: `2px solid ${T.ink}` }}>
          <Row label="Total to order" gal={Math.max(0, toOrder)} strong />
        </div>

        {toOrder <= 0 && (
          <div style={{ fontSize: 13, color: tx(T.sage), marginTop: 8 }}>
            {onBoard === TGT ? "Already at the target — nothing to order."
              : `Already carrying ${(onBoard - TGT).toFixed(0)} gal more than the target.`}
          </div>
        )}

        <div className="mt-4" style={{ border: `1px solid ${T.line}`, background: T.panelAlt, padding: 10, borderRadius: 2 }}>
          <Label>After uplift</Label>
          <div className="flex flex-wrap gap-x-6 gap-y-1 mt-1" style={{ fontFamily: FONT_MONO, fontSize: 13 }}>
            <span>LEFT {Math.max(L, perTank).toFixed(0)} gal</span>
            <span>RIGHT {Math.max(R, perTank).toFixed(0)} gal</span>
            <span style={{ fontWeight: 600 }}>
              TOTAL {(imbalance ? matchTotal : TGT).toFixed(0)} gal / {toL(imbalance ? matchTotal : TGT).toFixed(1)} L
            </span>
          </div>
          {imbalance && (
            <div style={{ fontSize: 12, color: tx(T.ink3), marginTop: 4 }}>
              Balanced at the higher tank, since fuel can only be added.
            </div>
          )}
        </div>
      </Section>
    </div>
  );
}

/* ================================ CFI ==================================
   Completed flying by month — what got done, on what, with whom — set
   against how much the daylight actually allows. */

function monthCapacity(year, month, fleetCount, lat, lon, cfg) {
  const zenith = cfg.daylight === "civil" ? 96 : 90.833;
  const slot = Math.max(0.25, Number(cfg.bookingHours) || 2);
  const days = new Date(year, month + 1, 0).getDate();
  let raw = 0, daylight = 0;
  for (let d = 1; d <= days; d++) {
    const dk = key(new Date(year, month, d));
    const sr = sunEvent(dk, lat, lon, zenith, true);
    const ss = sunEvent(dk, lat, lon, zenith, false);
    if (sr == null || ss == null || ss <= sr) continue;
    const hours = (ss - sr) / 60;
    daylight += hours;
    raw += Math.floor(hours / slot) * fleetCount;
  }
  return { days, daylightHours: daylight, raw, capacity: Math.floor(raw * (Number(cfg.buffer) || 0)) };
}


/* ============================== EXPORT ================================
   Everything on the board as a workbook: one sheet per record type, plus
   the summaries the CFI reports from. Built in the browser, so it works
   the same whether this is a prototype or a hosted site. */

/** Flatten a booking into one row a spreadsheet can sort and filter. */
function bookingRow(b, stuById) {
  const t = typeById(b.typeId);
  const st = b.studentId ? stuById(b.studentId) : null;
  const others = partnersOf(b).map((id) => stuById(id)?.name).filter(Boolean);
  const mins = (counts) => b.segments.filter((x) => kindById(x.kindId).counts === counts)
    .reduce((a, x) => a + x.minutes, 0);
  return {
    Date: b.date,
    Weekday: DAY_ABBR[wdIndex(b.date)],
    Start: b.start,
    End: b.end,
    "Block (h)": Number((dur(b) / 60).toFixed(2)),
    Type: t.name,
    "Type code": t.code,
    Status: b.status,
    "Cancel reason": b.status === "cancelled" ? (b.cancelReason ? reasonName(b.cancelReason) : "Not recorded") : "",
    "Cancel note": b.cancelNote || "",
    Student: st ? st.name : "",
    "Other students": others.join(", "),
    Course: b.course || "",
    Lesson: b.course ? lessonCode(b.course, b.lesson) : "",
    "Lesson name": b.course ? lessonName(b.course, b.lesson) : "",
    Instructor: b.instructorId ? insById(b.instructorId).name : "",
    "Signed out by": b.signOutInstructorId ? insById(b.signOutInstructorId).name : "",
    Examiner: b.examiner || "",
    Aircraft: b.aircraftId ? acById(b.aircraftId).reg : "",
    "Aircraft type": b.aircraftId ? acById(b.aircraftId).type : "",
    "Air (h)": Number((mins("air") / 60).toFixed(2)),
    "Ground (h)": Number((mins("ground") / 60).toFixed(2)),
    "Admin (h)": Number((mins("admin") / 60).toFixed(2)),
    "Fuel restriction": b.fuelRequested === "" ? "" : b.fuelRequested,
    "Restriction note": b.fuelNote || "",
    "Checked out": b.checkOutAt || "",
    "Checked in": b.checkInAt || "",
    "Fuel on board": b.fuelOnBoard === "" ? "" : b.fuelOnBoard,
    "Oil (qts)": b.oilQts === "" ? "" : b.oilQts,
    Destination: b.dest || "",
    ETA: b.eta || "",
    Note: b.note || "",
    "Booking id": b.id,
  };
}

/** Build and download the workbook. Returns a short description of what went out. */
async function exportWorkbook({ bookings, students, instructors, fleet, syllabi, taResult, taShifts,
  site, cfiCfg, stuById, generalFuel }) {
  const XLSX = window.XLSX;
  if (!XLSX) throw new Error("the spreadsheet library did not load — check your connection");
  const wb = XLSX.utils.book_new();
  const add = (name, rows) => {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ "": "no records" }]);
    /* widths make the difference between usable and unusable on opening */
    const keys = rows.length ? Object.keys(rows[0]) : [""];
    ws["!cols"] = keys.map((k) => ({
      wch: Math.min(38, Math.max(10, k.length + 2,
        ...rows.slice(0, 200).map((r) => String(r[k] ?? "").length + 2))),
    }));
    ws["!freeze"] = { xSplit: 0, ySplit: 1 };
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  };

  /* ---- bookings ---- */
  const sorted = [...bookings].sort((a, b) => (a.date === b.date ? toMin(a.start) - toMin(b.start) : a.date < b.date ? -1 : 1));
  add("Bookings", sorted.map((b) => bookingRow(b, stuById)));

  /* ---- cancellations, broken out because it's the question most often asked ---- */
  add("Cancellations", sorted.filter((b) => b.status === "cancelled").map((b) => {
    const r = bookingRow(b, stuById);
    return { Date: r.Date, Start: r.Start, Reason: r["Cancel reason"], Detail: r["Cancel note"],
      Student: r.Student, Instructor: r.Instructor, Aircraft: r.Aircraft, Type: r.Type, Course: r.Course, Lesson: r.Lesson };
  }));

  /* ---- students, with their record ---- */
  add("Students", students.map((s) => {
    const syl = getSyl(s.course);
    const mine = bookings.filter((b) => onBooking(b, s.id));
    const flownB = mine.filter((b) => b.status === "flown");
    const cancelledB = mine.filter((b) => b.status === "cancelled");
    const airMin = flownB.reduce((a, b) =>
      a + b.segments.filter((x) => kindById(x.kindId).counts === "air").reduce((y, x) => y + x.minutes, 0), 0);
    const row = {
      Name: s.name, Course: s.course, "Course name": syl.name,
      Instructor: s.instructorId ? insById(s.instructorId).name : "",
      "Lessons done": s.done.length, "Lessons total": syl.lessons.length,
      "Progress %": Math.round((s.done.length / syl.lessons.length) * 100),
      "Next lesson": s.done.length < syl.lessons.length ? lessonCode(s.course, s.done.length) : "complete",
      "Total hours": s.hours,
      "Flights completed": flownB.length,
      "Hours airborne": Number((airMin / 60).toFixed(1)),
      Cancellations: cancelledB.length,
      "Cancellation rate %": mine.length ? Math.round((cancelledB.length / mine.length) * 100) : 0,
    };
    CANCEL_REASONS.forEach(([v, n]) => { row[`Cancelled — ${n}`] = cancelledB.filter((b) => b.cancelReason === v).length; });
    return row;
  }));

  /* ---- lesson-by-lesson sign-off ---- */
  add("Syllabus progress", students.flatMap((s) => {
    const syl = getSyl(s.course);
    return syl.lessons.map((l, i) => ({
      Student: s.name, Course: s.course, Lesson: lessonCode(s.course, i), Name: l,
      Complete: s.done.includes(i) ? "yes" : "no",
    }));
  }));

  /* ---- instructors ---- */
  add("Instructors", instructors.map((i) => {
    const mine = bookings.filter((b) => b.instructorId === i.id);
    return {
      Name: i.name, Grade: i.grade, Qualifications: (i.quals || []).join(", "),
      Students: students.filter((s) => s.instructorId === i.id).length,
      "Flights completed": mine.filter((b) => b.status === "flown").length,
      Cancellations: mine.filter((b) => b.status === "cancelled").length,
      "Days off booked": (i.timeOff || []).length,
      "Working days": DAY_ABBR.filter((_, wd) => i.availability?.[wd]).join(", "),
    };
  }));

  /* ---- fleet, with what each airframe cost in downtime ---- */
  add("Fleet", fleet.map((a) => {
    const mine = bookings.filter((b) => b.aircraftId === a.id);
    const maintMin = mine.filter((b) => b.status !== "cancelled"
      && typeById(b.typeId).mainKindId === "k-maint").reduce((x, b) => x + dur(b), 0);
    return {
      Registration: a.reg, Type: a.type, Class: a.class, Status: a.status,
      "Rate/h": a.rate, "Fuel capacity": a.fuelCap,
      "General restriction": generalFuel[a.id] ?? "",
      "Flights completed": mine.filter((b) => b.status === "flown").length,
      "Cancelled — weather": mine.filter((b) => b.status === "cancelled" && b.cancelReason === "weather").length,
      "Cancelled — snag": mine.filter((b) => b.status === "cancelled" && b.cancelReason === "snag").length,
      "Maintenance hours": Number((maintMin / 60).toFixed(1)),
    };
  }));

  /* ---- TA roster, one row per person per shift ---- */
  const roster = [];
  Object.entries(taResult?.schedule || {}).forEach(([d, byShift]) => {
    Object.entries(byShift).forEach(([sid, names]) => {
      const sh = taShifts.find((x) => x.id === sid);
      names.forEach((n) => roster.push({
        Date: d, Weekday: DAY_ABBR[wdIndex(d)], Shift: sh ? sh.name : sid,
        Start: sh ? fmtH(sh.start ?? 0) : "", End: sh ? fmtH(sh.end) : "", TA: n,
        "Hand edited": taResult?.pinned?.[`${d}|${sid}`] ? "yes" : "",
      }));
    });
  });
  add("TA roster", roster.sort((a, b) => (a.Date === b.Date ? a.Shift.localeCompare(b.Shift) : a.Date < b.Date ? -1 : 1)));

  /* ---- monthly summary, the numbers the CFI page reports ---- */
  const years = [...new Set(bookings.map((b) => b.date.slice(0, 4)))].sort();
  const counted = fleet.filter((a) => a.status !== "retired"
    && (cfiCfg.countSim || a.class !== "sim") && (cfiCfg.countMulti || a.class !== "multi"));
  const summary = [];
  years.forEach((y) => {
    for (let m = 0; m < 12; m++) {
      const inM = bookings.filter((b) => b.date.startsWith(y) && parseKey(b.date).getMonth() === m);
      if (!inM.length) continue;
      const cap = monthCapacity(Number(y), m, Math.max(1, counted.length), site.lat, site.lon, cfiCfg);
      const done = inM.filter((b) => b.status === "flown");
      const canx = inM.filter((b) => b.status === "cancelled");
      const airMin = done.reduce((a, b) =>
        a + b.segments.filter((x) => kindById(x.kindId).counts === "air").reduce((z, x) => z + x.minutes, 0), 0);
      const row = {
        Year: y, Month: MONTHS_FULL[m], Days: cap.days,
        "Daylight hours": Math.round(cap.daylightHours),
        "Slots available": cap.capacity,
        Completed: done.length,
        "Used %": cap.capacity ? Math.round((done.length / cap.capacity) * 100) : 0,
        "Hours airborne": Number((airMin / 60).toFixed(1)),
        Cancelled: canx.length,
      };
      CANCEL_REASONS.forEach(([v, n]) => { row[`Cancelled — ${n}`] = canx.filter((b) => b.cancelReason === v).length; });
      summary.push(row);
    }
  });
  add("Monthly summary", summary);

  /* ---- the settings the numbers were produced under ---- */
  add("Settings", [
    { Setting: "Exported", Value: new Date().toISOString() },
    { Setting: "Airfield", Value: site.ident },
    { Setting: "Latitude", Value: site.lat },
    { Setting: "Longitude", Value: site.lon },
    { Setting: "Hours per booking", Value: cfiCfg.bookingHours },
    { Setting: "Capacity buffer", Value: `${Math.round(cfiCfg.buffer * 100)}%` },
    { Setting: "Usable daylight", Value: cfiCfg.daylight === "civil" ? "civil twilight" : "sunrise to sunset" },
    { Setting: "Simulators counted", Value: cfiCfg.countSim ? "yes" : "no" },
    { Setting: "Multi counted", Value: cfiCfg.countMulti ? "yes" : "no" },
    { Setting: "Counted bookings", Value: cfiCfg.countStatus === "flown" ? "completed only" : "all but cancelled" },
    { Setting: "TA staffing buffer", Value: cfiCfg.staffBuffer },
  ]);

  const stamp = key(new Date());
  XLSX.writeFile(wb, `flight-progress-${site.ident}-${stamp}.xlsx`);
  return `${sorted.length} bookings · ${students.length} students · ${roster.length} TA shifts`;
}

function CFIView({ bookings, students, fleet, site, instructors, cfiCfg }) {
  const [year, setYear] = useState(TODAY.getFullYear());
  const [focusMonth, setFocusMonth] = useState(null); /* null = whole year */
  const show = {
    stats: cfiCfg.stats?.length ? cfiCfg.stats : SEED_CFI_CFG.stats,
    panels: cfiCfg.panels || SEED_CFI_CFG.panels,
  };

  const activeFleet = fleet.filter((a) => a.status !== "retired"
    && (cfiCfg.countSim || a.class !== "sim")
    && (cfiCfg.countMulti || a.class !== "multi"));
  const fleetCount = Math.max(1, activeFleet.length);

  /* completed flying, month by month */
  const flown = useMemo(() => bookings.filter((b) => {
    if (!b.date.startsWith(String(year))) return false;
    if (cfiCfg.countStatus === "flown" ? b.status !== "flown" : b.status === "cancelled") return false;
    if (cfiCfg.airOnly && !b.segments.some((x) => kindById(x.kindId).counts === "air")) return false;
    return true;
  }), [bookings, year, cfiCfg.countStatus, cfiCfg.airOnly]);

  const months = useMemo(() => MONTHS_FULL.map((name, m) => {
    const inMonth = flown.filter((b) => parseKey(b.date).getMonth() === m);
    const cap = monthCapacity(year, m, fleetCount, site.lat, site.lon, cfiCfg);
    const airMin = inMonth.reduce((a, b) =>
      a + b.segments.filter((x) => kindById(x.kindId).counts === "air").reduce((y, x) => y + x.minutes, 0), 0);
    return { m, name, count: inMonth.length, list: inMonth, ...cap, airHours: airMin / 60,
      used: cap.capacity ? inMonth.length / cap.capacity : 0 };
  }), [flown, year, fleetCount, site.lat, site.lon, cfiCfg]);

  const yearTotal = months.reduce((a, x) => a + x.count, 0);
  const yearCapacity = months.reduce((a, x) => a + x.capacity, 0);
  const yearAir = months.reduce((a, x) => a + x.airHours, 0);
  const peak = Math.max(1, ...months.map((x) => Math.max(x.count, x.capacity)));

  /* the set being broken down: one month, or the whole year */
  const scope = focusMonth === null ? flown : months[focusMonth].list;
  const scopeLabel = focusMonth === null ? String(year) : `${MONTHS_FULL[focusMonth]} ${year}`;
  const scopeCap = focusMonth === null ? yearCapacity : months[focusMonth].capacity;

  /* everything in the window, whatever its status — cancellations and
     maintenance don't show up in the completed set */
  const inWindow = useMemo(() => bookings.filter((b) => b.date.startsWith(String(year))
    && (focusMonth === null || parseKey(b.date).getMonth() === focusMonth)), [bookings, year, focusMonth]);

  const byAsset = useMemo(() => {
    const m = {};
    const slot = (k) => (m[k] = m[k] || { count: 0, airMin: 0, wxLost: 0, snagLost: 0, maintMin: 0 });
    scope.forEach((b) => {
      const k = b.aircraftId || "ground";
      slot(k).count++;
      m[k].airMin += b.segments.filter((x) => kindById(x.kindId).counts === "air").reduce((y, x) => y + x.minutes, 0);
    });
    inWindow.forEach((b) => {
      const k = b.aircraftId || "ground";
      if (b.status === "cancelled") {
        if (b.cancelReason === "weather") slot(k).wxLost++;
        else if (b.cancelReason === "snag") {
          /* a flight lost to a snag is the airframe being unserviceable, so its
             time counts alongside booked maintenance rather than separately */
          slot(k).snagLost++;
          slot(k).maintMin += dur(b);
        }
      } else if (kindById(typeById(b.typeId).mainKindId).id === "k-maint") {
        slot(k).maintMin += dur(b);
      }
    });
    /* downtime is easier to argue about as bookings lost than as hours */
    const slotMin = Math.max(15, (Number(cfiCfg.bookingHours) || 2) * 60);
    return Object.entries(m).map(([id, v]) => ({
      id, label: id === "ground" ? "Ground / no airframe" : acById(id).reg, ...v,
      mxSlots: Math.floor(v.maintMin / slotMin),
    })).sort((a, b) => b.count - a.count);
  }, [scope, inWindow, cfiCfg.bookingHours]);

  /* dual = a flight with both an instructor and a student aboard */
  const byInstructor = useMemo(() => {
    const m = {};
    scope.forEach((b) => {
      if (!b.instructorId || !b.studentId) return;
      const t = typeById(b.typeId);
      if (t.instructor !== "required") return;
      m[b.instructorId] = m[b.instructorId] || { count: 0, airMin: 0 };
      m[b.instructorId].count++;
      m[b.instructorId].airMin += b.segments.filter((x) => kindById(x.kindId).counts === "air").reduce((y, x) => y + x.minutes, 0);
    });
    return Object.entries(m).map(([id, v]) => ({ id, label: insById(id).name, ...v }))
      .sort((a, b) => b.count - a.count);
  }, [scope]);

  /* cancellations for the same window, whatever the display filter counts */
  const cancelled = useMemo(() => bookings.filter((b) => b.status === "cancelled"
    && b.date.startsWith(String(year))
    && (focusMonth === null || parseKey(b.date).getMonth() === focusMonth)), [bookings, year, focusMonth]);
  const byReason = useMemo(() => {
    const m = {};
    cancelled.forEach((b) => { const k = b.cancelReason || ""; m[k] = (m[k] || 0) + 1; });
    /* every reason is listed even at nil, so the categories read as a complete
       set and a zero is visibly a zero rather than an omission */
    return [...CANCEL_REASONS.map(([v, n]) => ({ id: v, label: n, count: m[v] || 0 })),
      ...(m[""] ? [{ id: "none", label: "Reason not recorded", count: m[""] }] : [])]
      .sort((a, b) => b.count - a.count);
  }, [cancelled]);
  const cancelRate = cancelled.length + scope.length
    ? cancelled.length / (cancelled.length + scope.length) : 0;

  const dualCount = byInstructor.reduce((a, x) => a + x.count, 0);
  const soloCount = scope.length - dualCount;

  const Stat = ({ value, label, color }) => (
    <div>
      <div style={{ fontFamily: FONT_UI, fontSize: 34, fontWeight: 700, lineHeight: 1, color: color || T.ink }}>{value}</div>
      <Label>{label}</Label>
    </div>
  );

  const Breakdown = ({ title, rows, empty }) => {
    const top = Math.max(1, ...rows.map((r) => r.count));
    return (
      <Section defaultOpen title={title} right={
        <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>
          {rows.some((r) => r.wxLost != null)
            ? "WEATHER · SNAG CANCELLATIONS · UNSERVICEABLE HOURS"
            : scopeLabel.toUpperCase()}
        </span>}>
        {rows.length === 0 && <div style={{ fontSize: 13, color: T.ink2 }}>{empty}</div>}
        {rows.map((r) => (
          <div key={r.id} className="flex items-center gap-3 py-2" style={{ borderTop: `1px solid ${T.lineSoft}` }}>
            <span style={{ width: 150 }}>
              <span style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 13, display: "block" }}>{r.label}</span>
              {(r.wxLost != null) && (
                <span style={{ fontFamily: FONT_MONO, fontSize: 10, display: "block", marginTop: 1 }}>
                  <span style={{ color: r.wxLost ? tx(T.blue) : tx(T.ink3) }}>{r.wxLost} WX</span>
                  <span style={{ color: tx(T.ink3) }}> · </span>
                  <span style={{ color: r.snagLost ? tx(T.red) : tx(T.ink3) }}>{r.snagLost} SNAG</span>
                  <span style={{ color: tx(T.ink3) }}> · </span>
                  <span style={{ color: r.maintMin ? tx(T.amber) : tx(T.ink3) }}
                    title={`${hrs(r.maintMin)} h on the ground — ${r.mxSlots} booking${r.mxSlots === 1 ? "" : "s"} of ${cfiCfg.bookingHours} h lost`}>
                    {hrs(r.maintMin)} H MX = {r.mxSlots} LOST
                  </span>
                </span>
              )}
            </span>
            <span style={{ flex: 1 }}>
              <div style={{ height: 14, background: T.lineSoft, borderRadius: 2, overflow: "hidden" }}>
                <div style={{ width: `${(r.count / top) * 100}%`, height: "100%", background: T.blue }} />
              </div>
            </span>
            <span style={{ fontFamily: FONT_MONO, fontSize: 13, fontWeight: 600, width: 48, textAlign: "right" }}>{r.count}</span>
            <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3), width: 79, textAlign: "right" }}>
              {(r.airMin / 60).toFixed(1)} h
            </span>
          </div>
        ))}
      </Section>
    );
  };

  const years = [TODAY.getFullYear() - 1, TODAY.getFullYear(), TODAY.getFullYear() + 1];

  return (
    <div className="p-4 sm:p-6 space-y-4">
      <div className="flex flex-wrap items-end gap-3">
        <div>
          <Label>Year</Label>
          <select className="block mt-1" value={year} onChange={(e) => { setYear(Number(e.target.value)); setFocusMonth(null); }}>
            {years.map((y) => <option key={y} value={y}>{y}</option>)}
          </select>
        </div>
        <div className="flex flex-wrap gap-1">
          <button onClick={() => setFocusMonth(null)} style={{
            fontFamily: FONT_MONO, fontSize: 11, padding: "4px 8px", borderRadius: 2,
            border: `1px solid ${focusMonth === null ? T.ink : T.line}`,
            background: focusMonth === null ? T.ink : T.panel, color: focusMonth === null ? T.paper : T.ink2 }}>
            FULL YEAR
          </button>
          {months.map((x) => (
            <button key={x.m} onClick={() => setFocusMonth(x.m)} style={{
              fontFamily: FONT_MONO, fontSize: 11, padding: "4px 8px", borderRadius: 2,
              border: `1px solid ${focusMonth === x.m ? T.ink : T.line}`,
              background: focusMonth === x.m ? T.ink : T.panel, color: focusMonth === x.m ? T.paper : T.ink2 }}>
              {MON_ABBR[x.m]}
            </button>
          ))}
        </div>
      </div>

      <Section defaultOpen title={`Completed flying — ${scopeLabel}`}
        right={<span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3) }}>
          {cfiCfg.bookingHours} H PER BOOKING · {fleetCount} AIRFRAMES · {Math.round(cfiCfg.buffer * 100)}% BUFFER
        </span>}>
        <div className="flex flex-wrap gap-8">
          {show.stats.map((k) => {
            const air = focusMonth === null ? yearAir : months[focusMonth].airHours;
            const dayCount = focusMonth === null
              ? months.reduce((a, x) => a + x.days, 0) : months[focusMonth].days;
            const v = {
              completed: [scope.length, "bookings completed", T.magenta],
              capacity: [scopeCap, "slots available", null],
              used: [`${scopeCap ? Math.round((scope.length / scopeCap) * 100) : 0}%`, "of capacity used",
                scopeCap && scope.length / scopeCap > 0.9 ? T.red : null],
              dual: [dualCount, "dual flights", null],
              solo: [soloCount, "solo & other", null],
              air: [air.toFixed(1), "hours airborne", null],
              perAircraft: [(scope.length / fleetCount).toFixed(1), "per aircraft", null],
              perDay: [(scope.length / Math.max(1, dayCount)).toFixed(1), "per day", null],
              cancelled: [cancelled.length, "cancelled", cancelled.length ? T.red : null],
              cancelRate: [`${Math.round(cancelRate * 100)}%`, "cancellation rate", cancelRate > 0.2 ? T.red : null],
            }[k];
            return v ? <Stat key={k} value={v[0]} label={v[1]} color={v[2]} /> : null;
          })}
        </div>
      </Section>

      {/* month chart: flown against what the daylight allows */}
      {show.panels.includes("chart") && <Section defaultOpen title="By month"
        right={
          <span className="flex flex-wrap items-center gap-3" style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>
            <span className="flex items-center gap-1">
              <span style={{ width: 12, height: 10, background: T.magenta, display: "inline-block" }} /> COMPLETED
            </span>
            <span className="flex items-center gap-1">
              <span style={{ width: 12, height: 10, background: tint(T.ink3, 0.35), display: "inline-block" }} /> AVAILABLE
            </span>
          </span>
        }>
        <div className="flex items-end gap-2" style={{ height: 210 }}>
          {months.map((x) => (
            <button key={x.m} onClick={() => setFocusMonth(focusMonth === x.m ? null : x.m)}
              className="flex-1 flex flex-col items-center justify-end" style={{ height: "100%" }}
              title={`${x.name}: ${x.count} of ${x.capacity} · ${x.daylightHours.toFixed(0)} h daylight`}>
              <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: T.ink2 }}>{x.count}</span>
              <div className="w-full flex items-end justify-center gap-[2px]" style={{ height: 150 }}>
                <div style={{ width: "42%", height: `${(x.count / peak) * 100}%`, background: T.magenta, borderRadius: "2px 2px 0 0" }} />
                <div style={{ width: "42%", height: `${(x.capacity / peak) * 100}%`,
                  background: tint(T.ink3, 0.35), borderRadius: "2px 2px 0 0" }} />
              </div>
              <span style={{ fontFamily: FONT_MONO, fontSize: 10, marginTop: 4,
                color: focusMonth === x.m ? T.ink : tx(T.ink3), fontWeight: focusMonth === x.m ? 700 : 400 }}>
                {MON_ABBR[x.m]}
              </span>
            </button>
          ))}
        </div>
        <div className="flex flex-wrap gap-x-6 gap-y-1 mt-3 pt-3" style={{ borderTop: `1px solid ${T.line}`, fontFamily: FONT_MONO, fontSize: 11 }}>
          <span>YEAR TOTAL <strong style={{ color: tx(T.magenta), fontSize: 13 }}>{yearTotal}</strong></span>
          <span>SLOTS AVAILABLE <strong style={{ fontSize: 13 }}>{yearCapacity}</strong></span>
          <span style={{ color: tx(T.ink3) }}>
            {yearCapacity ? Math.round((yearTotal / yearCapacity) * 100) : 0}% USED · {yearAir.toFixed(0)} H AIRBORNE
          </span>
        </div>
      </Section>}

      {show.panels.includes("cancellations") && (
        <Section defaultOpen title="Cancellations"
          right={<span style={{ fontFamily: FONT_MONO, fontSize: 10, color: cancelRate > 0.2 ? tx(T.red) : tx(T.ink3) }}>
            {cancelled.length} CANCELLED · {Math.round(cancelRate * 100)}% OF ALL BOOKINGS
          </span>}>
          {cancelled.length === 0 && (
            <div style={{ fontFamily: FONT_BODY, fontSize: 13, color: tx(T.sage) }}>Nothing cancelled in this period.</div>
          )}
          {byReason.map((r) => (
            <div key={r.id} className="flex items-center gap-3 py-2" style={{ borderTop: `1px solid ${T.lineSoft}` }}>
              <span style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 13, width: 150,
                color: r.count ? T.ink : tx(T.ink3) }}>{r.label}</span>
              <span style={{ flex: 1 }}>
                <div style={{ height: 14, background: T.lineSoft, borderRadius: 2, overflow: "hidden" }}>
                  <div style={{ width: `${(r.count / Math.max(1, ...byReason.map((x) => x.count))) * 100}%`,
                    height: "100%", background: r.id === "none" ? T.ink3 : T.red }} />
                </div>
              </span>
              <span style={{ fontFamily: FONT_MONO, fontSize: 13, fontWeight: 600, width: 48, textAlign: "right",
                color: r.count ? T.ink : tx(T.ink3) }}>{r.count}</span>
              <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3), width: 79, textAlign: "right" }}>
                {cancelled.length ? `${Math.round((r.count / cancelled.length) * 100)}%` : "—"}
              </span>
            </div>
          ))}
          {byReason.some((r) => r.id === "none") && (
            <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.amber), marginTop: 6 }}>
              SOME CANCELLATIONS HAVE NO REASON RECORDED — OPEN THEM TO SET ONE
            </div>
          )}
        </Section>
      )}

      <div className="grid gap-4 lg:grid-cols-2">
        {show.panels.includes("aircraft") &&
          <Breakdown title="By aircraft" rows={byAsset} empty="Nothing completed in this period." />}
        {show.panels.includes("instructor") &&
          <Breakdown title="By instructor — dual" rows={byInstructor} empty="No dual flights in this period." />}
      </div>

      {show.panels.includes("table") && <Section defaultOpen title="How capacity is worked out">
        <div className="overflow-x-auto">
          <table style={{ width: "100%", minWidth: 620, borderCollapse: "collapse" }}>
            <thead><tr style={{ background: T.panelAlt }}>
              {["Month","Days","Daylight","Slots available","Completed","Used"].map((h) => <Th key={h}>{h}</Th>)}
            </tr></thead>
            <tbody>
              {months.map((x) => (
                <tr key={x.m} style={{ borderBottom: `1px solid ${T.lineSoft}`,
                  background: focusMonth === x.m ? tint(T.magenta, 0.07) : "transparent" }}>
                  <td style={{ padding: "4px 8px", fontSize: 13 }}>{x.name}</td>
                  <td style={{ padding: "4px 8px", fontFamily: FONT_MONO, fontSize: 12 }}>{x.days}</td>
                  <td style={{ padding: "4px 8px", fontFamily: FONT_MONO, fontSize: 12 }}>{x.daylightHours.toFixed(0)} h</td>
                  <td style={{ padding: "4px 8px", fontFamily: FONT_MONO, fontSize: 12, fontWeight: 600 }}
                    title={`${x.raw} slots of daylight, less the ${Math.round((1 - cfiCfg.buffer) * 100)}% buffer`}>
                    {x.capacity}
                  </td>
                  <td style={{ padding: "4px 8px", fontFamily: FONT_MONO, fontSize: 12, color: tx(T.magenta) }}>{x.count}</td>
                  <td style={{ padding: "4px 8px", fontFamily: FONT_MONO, fontSize: 12,
                    color: x.used > 0.9 ? tx(T.red) : T.ink2 }}>
                    {x.capacity ? Math.round(x.used * 100) : 0}%
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{ fontSize: 13, color: T.ink2, marginTop: 8 }}>
          Each day's daylight at {site.ident} — {cfiCfg.daylight === "civil" ? "civil twilight to civil twilight" : "sunrise to sunset"} —
          divided into {cfiCfg.bookingHours}-hour slots, multiplied by the {fleetCount} airframes counted,
          then reduced to {Math.round(cfiCfg.buffer * 100)}% to leave room for weather, maintenance and turnarounds.
          {cfiCfg.countSim ? "" : " Simulators are excluded since they don't need daylight."}
          Change any of this on Setup → CFI.
        </div>
      </Section>}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(FlightProgressBoard));
</script>

<noscript>
  <div style="padding:24px;font-family:system-ui">This board needs JavaScript enabled.</div>
</noscript>
</body>
</html>

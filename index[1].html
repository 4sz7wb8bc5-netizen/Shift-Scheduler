            </div>
            <div>
              <Label>ETA</Label>
              <input type="time" className="w-full mt-1" value={eta} onChange={(e) => setEta(e.target.value)}
                style={{ fontSize: 15, fontWeight: 600 }} />
            </div>
          </div>

          {b.fuelNote && (
            <div style={{ border: `1px solid ${T.red}`, borderLeft: `4px solid ${T.red}`, padding: "8px 8px", borderRadius: 2 }}>
              <Label style={{ color: tx(T.red) }}>Fuel restriction</Label>
              <div style={{ fontSize: 13, marginTop: 2 }}>{b.fuelNote}</div>
            </div>
          )}

          <div className="flex gap-2">
            <Btn tone="go" disabled={!destOk} onClick={go}>Check out at {nowHHMM()}</Btn>
            <Btn onClick={() => setSel(null)}>Cancel</Btn>
          </div>
          <div style={{ fontSize: 12, color: tx(T.ink3) }}>
            Recorded against the flight — you can correct any of it from the booking afterwards.
          </div>
        </div>
      </div>
    </div>
  );
}

function QuickEditPanel(props) {
  const [showOthers, setShowOthers] = useState(false);
  const { sel, setSel, boardDate, taShifts, setTaShifts, taSlots, setTaSlots,
    taResult, setTaResult, taTemplates, taExceptions, taskBands, setTaskBands, site, say } = props;

  const isShift = sel.type === "tashift";
  const shift = isShift ? taShifts.find((x) => x.id === sel.shiftId) : null;
  const band = !isShift ? taskBands.find((x) => x.id === sel.bandId) : null;
  if (!shift && !band) return null;

  const saveShift = (patch) => setTaShifts(taShifts.map((x) => (x.id === shift.id ? { ...x, ...patch } : x)));
  const saveBand = (patch) => setTaskBands(taskBands.map((x) => (x.id === band.id ? { ...x, ...patch } : x)));

  /* sunrise-driven first shift is shown, not typed */
  const isFirst = shift && taShifts.filter((x) => x.enabled)[0]?.id === shift.id;
  const dayStart = shift ? taShiftsForDate(boardDate, taShifts, site.lat, site.lon)
    .shifts.find((x) => x.id === shift.id)?.start ?? shift.start : 0;

  /* today's roster for this shift, editable in place */
  const rostered = isShift && taResult?.schedule?.[boardDate]?.[shift.id] ? taResult.schedule[boardDate][shift.id] : [];
  const wd = parseKey(boardDate).getDay();
  const canCover = isShift ? [...new Set(taTemplates
    .filter((t) => t.shiftIds.includes(shift.id) && t.days.includes(wd))
    .filter((t) => !taExceptions.some((e) => e.name === t.name && e.dates.includes(boardDate) && e.shiftIds.includes(shift.id)))
    .map((t) => t.name))].filter((n) => !rostered.includes(n)) : [];

  /* everyone else on the books, with why they weren't offered — still addable in a pinch */
  const others = isShift ? [...new Set(taTemplates.map((t) => t.name))]
    .filter((n) => !rostered.includes(n) && !canCover.includes(n))
    .map((n) => {
      const off = taExceptions.some((e) => e.name === n && e.dates.includes(boardDate) && e.shiftIds.includes(shift.id));
      const t = taTemplates.find((x) => x.name === n);
      return { name: n, why: off ? "marked unavailable" : !t?.shiftIds.includes(shift.id) ? "doesn't cover this shift" : "not available today" };
    }) : [];

  /** Write a shift's roster for the day. Works from nothing — you don't have to
      generate a period first just to put one person on one shift. */
  const setRoster = (names) => {
    const base = taResult?.schedule || {};
    const next = {};
    Object.entries(base).forEach(([d, byShift]) => {
      next[d] = {};
      Object.entries(byShift).forEach(([sid, list]) => (next[d][sid] = list.slice()));
    });
    next[boardDate] = next[boardDate] || {};
    next[boardDate][shift.id] = names;
    setTaResult({ ...taResult, schedule: next,
      pinned: { ...(taResult?.pinned || {}), [`${boardDate}|${shift.id}`]: true } });
  };

  return (
    <div className="fixed inset-0 z-40 flex justify-end" style={{ background: DARK_MODE ? "rgba(0,0,0,0.6)" : "rgba(23,36,43,0.35)" }} onClick={() => setSel(null)}>
      <div className="w-full sm:max-w-sm h-full overflow-y-auto"
        style={{ background: T.panel, borderLeft: `1px solid ${T.line}` }} onClick={(e) => e.stopPropagation()}>

        <div className="sticky top-0 flex items-start justify-between gap-3 px-4 py-3 z-10"
          style={{ background: DARK_MODE ? T.panelAlt : T.ink, color: DARK_MODE ? T.ink : T.paper,
            borderBottom: DARK_MODE ? `1px solid ${T.line}` : "none" }}>
          <div>
            <Label style={{ color: DARK_MODE ? T.ink3 : "rgba(233,234,226,0.6)" }}>{isShift ? `${staffOne()} shift` : "Daily window"}</Label>
            <div style={{ fontFamily: FONT_UI, fontSize: 20, fontWeight: 600, letterSpacing: "0.02em" }}>
              {isShift ? shift.name : band.label}
            </div>
            <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: DARK_MODE ? T.ink2 : "rgba(233,234,226,0.75)" }}>
              {fmtDate(boardDate)} · {isShift ? `${fmtH(dayStart)}–${fmtH(shift.end)}` : `${band.start}–${band.end}`}
            </div>
          </div>
          <button onClick={() => setSel(null)} style={{ color: DARK_MODE ? T.ink : T.paper, fontFamily: FONT_MONO, fontSize: 20 }} aria-label="Close">✕</button>
        </div>

        <div className="p-4 space-y-4">
          {isShift && (
            <>
              <div>
                <Label>Name</Label>
                <input className="w-full mt-1" value={shift.name} onChange={(e) => saveShift({ name: e.target.value })} />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <Label>Starts</Label>
                  {isFirst ? (
                    <div style={{ fontFamily: FONT_MONO, fontSize: 13, marginTop: 6 }}>
                      {fmtH(dayStart)}
                      <div style={{ fontSize: 11, color: tx(T.ink3) }}>follows sunrise</div>
                    </div>
                  ) : (
                    <input type="time" className="w-full mt-1" value={fmtH(shift.start)}
                      onChange={(e) => e.target.value && saveShift({ start: hDec(toMin(e.target.value)) })} />
                  )}
                </div>
                <div>
                  <Label>Ends</Label>
                  <input type="time" className="w-full mt-1" value={fmtH(shift.end)}
                    onChange={(e) => e.target.value && saveShift({ end: hDec(toMin(e.target.value)) })} />
                </div>
                <div>
                  <Label>Seats</Label>
                  <input type="number" min={0} max={20} className="w-full mt-1" value={taSlots[shift.id] ?? 0}
                    onChange={(e) => setTaSlots({ ...taSlots, [shift.id]: Math.max(0, Number(e.target.value) || 0) })} />
                </div>
                <div>
                  <Label>Colour</Label>
                  <div className="flex items-center gap-1 mt-1">
                    <select style={{ flex: 1 }} value={swatches().some(([, v]) => v === shift.color) ? shift.color : "custom"}
                      onChange={(e) => e.target.value !== "custom" && saveShift({ color: e.target.value })}>
                      {swatches().map(([n2, v]) => <option key={v} value={v}>{n2}</option>)}
                      <option value="custom">Custom…</option>
                    </select>
                    <input type="color" value={shift.color} title="Any colour you like"
                      onChange={(e) => saveShift({ color: e.target.value })}
                      style={{ width: 30, height: 26, padding: 0, border: `1px solid ${T.line}` }} />
                  </div>
                </div>
              </div>

              <label className="flex items-center gap-2">
                <input type="checkbox" checked={shift.enabled} style={{ accentColor: T.magenta }}
                  onChange={(e) => saveShift({ enabled: e.target.checked })} />
                <span style={{ fontSize: 13 }}>In use</span>
              </label>

              <div style={{ border: `1px solid ${T.line}`, borderRadius: 2, padding: 10 }}>
                <div className="flex items-baseline justify-between">
                  <Label>Working {fmtDate(boardDate)}</Label>
                  <span style={{ fontFamily: FONT_MONO, fontSize: 10,
                    color: rostered.length < (taSlots[shift.id] || 0) ? tx(T.red) : tx(T.sage) }}>
                    {rostered.length}/{taSlots[shift.id] || 0}
                  </span>
                </div>
                {rostered.length === 0 && (
                  <div style={{ fontSize: 13, color: T.ink2, marginTop: 4 }}>
                    Nobody on this shift yet — add someone below.
                  </div>
                )}
                {rostered.map((n) => (
                  <div key={n} className="flex items-center justify-between gap-2 py-1"
                    style={{ borderTop: `1px solid ${T.lineSoft}` }}>
                    <span style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 13 }}>{n}</span>
                    <Btn small tone="danger" onClick={() => setRoster(rostered.filter((x) => x !== n))}>Remove</Btn>
                  </div>
                ))}
                <div className="mt-2 pt-2" style={{ borderTop: `1px solid ${T.line}` }}>
                  <Label style={{ color: tx(T.sage) }}>Available — click to add</Label>
                  {canCover.length === 0 && (
                    <div style={{ fontSize: 12, color: T.ink2, marginTop: 3 }}>
                      Nobody has this shift free {fmtDate(boardDate)}.
                    </div>
                  )}
                  <div className="flex flex-wrap gap-1 mt-1">
                    {canCover.map((n) => (
                      <button key={n} onClick={() => { setRoster([...rostered, n]); say(`${n} added to ${shift.name}`); }}
                        style={{ fontFamily: FONT_UI, fontSize: 13, fontWeight: 600, padding: "4px 8px",
                          border: `1px solid ${T.sage}`, background: tint(T.sage, 0.14),
                          borderRadius: 2, color: T.ink }}>
                        + {n}
                      </button>
                    ))}
                  </div>

                  {others.length > 0 && (
                    <>
                      <button onClick={() => setShowOthers((v) => !v)} className="mt-3"
                        style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em", color: tx(T.ink3) }}>
                        {showOthers ? "HIDE" : "SHOW"} {others.length} NOT NORMALLY AVAILABLE
                      </button>
                      {showOthers && (
                        <div className="flex flex-wrap gap-1 mt-1">
                          {others.map((o) => (
                            <button key={o.name} title={o.why}
                              onClick={() => { setRoster([...rostered, o.name]); say(`${o.name} added — ${o.why}`); }}
                              style={{ fontFamily: FONT_UI, fontSize: 12, padding: "2px 8px",
                                border: `1px dashed ${T.amber}`, borderRadius: 2, color: tx(T.amber) }}>
                              + {o.name}
                            </button>
                          ))}
                        </div>
                      )}
                    </>
                  )}
                </div>
              </div>
              <div style={{ fontSize: 12, color: tx(T.ink3) }}>
                Times, seats and colour apply to every day. The roster above is just {fmtDate(boardDate)}.
              </div>
            </>
          )}

          {band && (
            <>
              <div>
                <Label>Name</Label>
                <input className="w-full mt-1" value={band.label} onChange={(e) => saveBand({ label: e.target.value })} />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <Label>Starts</Label>
                  <input type="time" className="w-full mt-1" value={band.start}
                    onChange={(e) => e.target.value && saveBand({ start: e.target.value })} />
                </div>
                <div>
                  <Label>Ends</Label>
                  <input type="time" className="w-full mt-1" value={band.end}
                    onChange={(e) => e.target.value && saveBand({ end: e.target.value })} />
                </div>
                <div>
                  <Label>Colour</Label>
                  <select className="w-full mt-1" value={band.color} onChange={(e) => saveBand({ color: e.target.value })}>
                    {[["Indigo", T.band], ...swatches()].map(([n, v]) => <option key={v} value={v}>{n}</option>)}
                  </select>
                </div>
                <div>
                  <Label>Applies to</Label>
                  <select className="w-full mt-1" value={band.scope ?? "all"} onChange={(e) => saveBand({ scope: e.target.value })}>
                    {BAND_SCOPES.map(([v, n]) => <option key={v} value={v}>{n}</option>)}
                  </select>
                </div>
                <div>
                  <Label>Length</Label>
                  <div style={{ fontFamily: FONT_MONO, fontSize: 13, marginTop: 6 }}>
                    {toMin(band.end) > toMin(band.start) ? `${hrs(toMin(band.end) - toMin(band.start))} h` : "—"}
                  </div>
                </div>
              </div>
              <label className="flex items-center gap-2">
                <input type="checkbox" checked={band.enabled} style={{ accentColor: T.magenta }}
                  onChange={(e) => saveBand({ enabled: e.target.checked })} />
                <span style={{ fontSize: 13 }}>Shown on the board</span>
              </label>
              <label className="flex items-center gap-2">
                <input type="checkbox" checked={!!band.strong} style={{ accentColor: T.magenta }}
                  onChange={(e) => saveBand({ strong: e.target.checked })} />
                <span style={{ fontSize: 13 }}>Closed — nothing flies in this window</span>

                {(band.scope ?? "all") === "ta" ? `Drawn in the ${staffPlural().toLowerCase()} lane only — the flying board is untouched.`
                  : (band.scope ?? "all") === "aircraft" ? `Drawn across the flying board only — ${staffPlural().toLowerCase()} shifts run as normal.`
                  : `Drawn across the flying board and through the ${staffPlural().toLowerCase()} shifts.`}
              </div>
              {toMin(band.end) <= toMin(band.start) && (
                <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.red) }}>END MUST BE AFTER START</div>
              )}
              <div className="flex gap-2">
                <Btn tone="danger" onClick={() => { setTaskBands(taskBands.filter((x) => x.id !== band.id)); setSel(null); say("Window removed"); }}>
                  Delete window
                </Btn>
                <Btn onClick={() => setSel(null)}>Done</Btn>
              </div>
              <div style={{ fontSize: 12, color: tx(T.ink3) }}>
                This window repeats every day.
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function BookingHoverCard({ hover, stuById, unit, riskReason }) {
  if (!hover) return null;
  const { b, x, y } = hover;
  const t = typeById(b.typeId);
  const st = b.studentId ? stuById(b.studentId) : null;
  const others = partnersOf(b).map(stuById).filter(Boolean);
  const ac = b.aircraftId ? acById(b.aircraftId) : null;
  /* colour says what kind of flight it is — dual, solo, sim, test — not the programme */
  const c = t.color;
  const out = OUT(b), back = BACK(b);
  const W = 268;
  /* keep the card on screen near the cursor */
  const vw = typeof window !== "undefined" ? window.innerWidth : 1200;
  const vh = typeof window !== "undefined" ? window.innerHeight : 900;
  const left = Math.min(x + 16, vw - W - 12);
  const top = Math.min(y + 12, Math.max(12, vh - 300));

  const Line = ({ k, v, color }) => (
    v === "" || v == null ? null : (
      <div className="flex items-baseline justify-between gap-3" style={{ padding: "0px 0px" }}>
        <span style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em", color: tx(T.ink3) }}>{k}</span>
        <span style={{ fontSize: 12, color: color || T.ink, textAlign: "right" }}>{v}</span>
      </div>
    )
  );

  return (
    <div className="fixed" style={{
      left, top, width: W, zIndex: 60, pointerEvents: "none",
      background: T.panel, border: `1px solid ${T.ink}`, borderTop: `4px solid ${c}`,
      borderRadius: 2, boxShadow: DARK_MODE ? "0 8px 24px rgba(0,0,0,0.55)" : "0 8px 24px rgba(23,36,43,0.28)", padding: "8px 8px" }}>

      <div className="flex items-baseline justify-between gap-2">
        <span style={{ fontFamily: FONT_UI, fontWeight: 700, fontSize: 15 }}>
          {st ? st.name : t.name}
        </span>
        <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(t.color) }}>{t.code}</span>
      </div>
      {others.length > 0 && <div style={{ fontSize: 12, color: T.ink2 }}>+ {others.map((p) => p.name).join(", ")}</div>}

      <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: T.ink2, margin: "2px 0 6px" }}>
        {b.start}–{b.end} · {hrs(dur(b))} h · {fmtDate(b.date)}
      </div>

      {(out || back || b.status === "cancelled") && (
        <div style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em", marginBottom: 6,
          color: "#FFFFFF", background: solidBg(out ? T.sage : back ? T.ink2 : T.ink3),
          display: "inline-block", padding: "0px 6px", borderRadius: 2 }}>
          {out ? `AIRBORNE SINCE ${b.checkOutAt}` : back ? `COMPLETE ${b.checkOutAt}–${b.checkInAt}`
            : `CANCELLED${b.cancelReason ? ` — ${reasonName(b.cancelReason).toUpperCase()}` : ""}`}
        </div>
      )}

      <div style={{ borderTop: `1px solid ${T.lineSoft}`, paddingTop: 4 }}>
        <Line k="AIRCRAFT" v={ac ? `${ac.reg} · ${ac.type}` : "Ground / none"} />
        {t.instructor !== "none" && (
          <Line k={isSoloType(t) ? "SIGN OUT INSTRUCTOR" : "INSTRUCTOR"}
            v={b.instructorId ? insById(b.instructorId).name : "—"} />
        )}
        {!isSoloType(t) && b.signOutInstructorId && b.signOutInstructorId !== b.instructorId && (
          <Line k="SIGNED OUT BY" v={insById(b.signOutInstructorId).name} />
        )}
        {t.examiner && b.examiner && <Line k="EXAMINER" v={b.examiner} />}
        {b.course && <Line k="LESSON" v={`${lessonCode(b.course, b.lesson)} · ${lessonName(b.course, b.lesson)}`} />}
        {b.fuelRequested !== "" && (
          <div className="flex items-baseline justify-between gap-3" style={{ padding: "0px 0px" }}>
            <span style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em", color: tx(T.ink3) }}>FUEL</span>
            <span style={{ background: solidBg(T.red), color: "#FFFFFF", borderRadius: 2, padding: "0px 6px",
              fontFamily: FONT_MONO, fontSize: 12, fontWeight: 700 }}>
              {b.fuelRequested} {shortUnit(unit)} MAX
            </span>
          </div>
        )}
        {b.dest && <Line k="DESTINATION" v={b.dest} />}
        {b.eta && <Line k="ETA" v={b.eta}
          color={out && toMin(b.eta) < toMin(nowHHMM()) ? tx(T.red) : undefined} />}
        {riskReason(b) && <Line k="FLAG" v={riskReason(b)} color={tx(T.amber)} />}
        {b.status === "cancelled" && b.cancelNote && <Line k="WHY" v={b.cancelNote} />}
      </div>

      {/* what the block is made of */}
      <div style={{ borderTop: `1px solid ${T.lineSoft}`, marginTop: 4, paddingTop: 4 }}>
        <div className="flex" style={{ height: 8, borderRadius: 2, overflow: "hidden", marginBottom: 3 }}>
          {b.segments.map((sg) => (
            <div key={sg.id} style={{ width: `${(sg.minutes / Math.max(1, segTotal(b.segments))) * 100}%`,
              background: kindById(sg.kindId).color }} />
          ))}
        </div>
        <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(T.ink3) }}>
          {b.segments.map((sg) => `${kindById(sg.kindId).code} ${sg.minutes}`).join(" · ")}
        </div>
      </div>

      {b.note && (
        <div style={{ borderTop: `1px solid ${T.lineSoft}`, marginTop: 4, paddingTop: 4,
          fontSize: 12, fontStyle: "italic", color: T.ink2 }}>
          {b.note}
        </div>
      )}
      {b.fuelNote && (
        <div style={{ fontSize: 12, color: tx(T.amber), marginTop: 2 }}>{b.fuelNote}</div>
      )}
    </div>
  );
}

function BoardView(props) {
  const { boardDate, setBoardDate, boardMode, setBoardMode, bookings, fleet, kinds, sel, setSel, riskReason, gapsForDay,
    stuById, moveBooking, resizeBooking, checkOut, checkIn, outNow, fuelUnit, instructors, fuelFor, types, site,
    taShifts, taSlots, taResult, setView, taskBands, undoDispatch, canEdit, sunFeed, setAircraftStatus, cfiCfg,
    showLegend, boardWindow, boardRoles } = props;

  /* students only ever see the aircraft board */
  const byFleet = canEdit ? boardMode === "fleet" : true;
  /* how narrow a column may get before the board starts scrolling sideways */
  const [colW, setColW] = useState(130);
  const [hover, setHover] = useState(null);
  const showHover = (e, b) => setHover({ b, x: e.clientX, y: e.clientY });
  const hideHover = () => setHover(null);
  const boardWrapRef = useRef(null);
  const wd = wdIndex(boardDate);

  const columns = useMemo(() => {
    if (byFleet)
      return [...fleet.filter((a) => a.status !== "retired"), GROUND_SLOT].map((a) => ({
        key: a.id, ac: a, down: a.status !== "active" }));
    const shown = instructors.filter((i) => !boardRoles.length || boardRoles.includes(i.roleId ?? "r-ins"));
    return [...shown, NO_INS].map((i) => {
      const away = i.id ? insOnLeave(i.id, boardDate) : null;
      const work = i.availability?.[wd] || null;
      return { key: i.id, ins: i, away, work, down: !!away || (!!i.id && !work) };
    });
  }, [byFleet, fleet, instructors, boardDate, wd, boardRoles]);

  /* A long idle stretch is easier to work with as bookable slots than as one
     wide block: one click gives a properly sized booking and the standby list
     has a real window to rank against. Anything left over stays as a part slot. */
  const slotsInGap = (g) => {
    const slot = Math.max(30, Math.round((Number(cfiCfg?.bookingHours) || 2) * 60));
    const from = toMin(g.start), to = toMin(g.end);
    if (to - from <= slot) return [g];
    const out = [];
    /* slots line up on the hour. A gap starting at 08:20 gets a short lead-in to
       09:00; one starting at 08:50 has that stub folded into the first slot, so
       everything after it still lands on clean hours. */
    const firstHour = Math.ceil(from / 60) * 60;
    let cursor = from;
    if (firstHour > from && firstHour < to) {
      if (firstHour - from >= 30) {
        out.push({ ...g, start: toHHMM(from), end: toHHMM(firstHour), part: true });
      } else {
        const end = Math.min(firstHour + slot, to);
        out.push({ ...g, start: toHHMM(from), end: toHHMM(end), part: end - from < slot });
        cursor = end;
      }
      if (!out.length || cursor === from) cursor = firstHour;
    }
    for (let m = cursor; m < to; m += slot) {
      const end = Math.min(m + slot, to);
      /* a short tail is folded into the slot before it rather than left as a sliver */
      if (end - m < 30 && out.length) { out[out.length - 1].end = toHHMM(end); break; }
      out.push({ ...g, start: toHHMM(m), end: toHHMM(end), part: end - m < slot });
    }
    return out;
  };

  const inColumn = (b, colKey) => (byFleet ? b.aircraftId === colKey : b.instructorId === colKey);

  /* columns always fit the window — width isn't something anyone has to set */
  useEffect(() => {
    const fit = () => {
      const avail = boardWrapRef.current?.clientWidth;
      if (!avail) return;
      const per = (avail - GUTTER - (byFleet && STAFF_REF.enabled ? TA_LANE_W : 0) - 4) / Math.max(1, columns.length);
      setColW(Math.max(72, Math.min(260, Math.floor(per / 2) * 2)));
    };
    fit();
    window.addEventListener("resize", fit);
    return () => window.removeEventListener("resize", fit);
  }, [canEdit, byFleet, columns.length]);



  /* daylight markers for the displayed day, and a minute-ticking "now" */
  const computedMarks = useMemo(() => sunMarks(boardDate, site.lat, site.lon), [boardDate, site.lat, site.lon]);
  /* the feed only carries today, so every other date stays on the computed figures */
  const feedApplies = sunFeed?.status === "live" && !!sunFeed.data && boardDate === key(TODAY);
  const marks = feedApplies
    ? { ...computedMarks, sunrise: sunFeed.data.sunrise, sunset: sunFeed.data.sunset }
    : computedMarks;
  /* Window: opens half an hour before sunrise, closes at 01:00 the next morning. */
  /* what the board shows: the sun's own hours, a preset, or hours picked by hand */
  const winFrom = boardWindow.mode === "daylight" ? openFor(boardDate, site.lat, site.lon)
    : boardWindow.mode === "custom" ? toMin(boardWindow.from)
    : (WINDOW_PRESETS.find((w) => w[0] === boardWindow.mode)?.[2] || [6 * 60])[0];
  const winTo = boardWindow.mode === "daylight" ? DAY_END
    : boardWindow.mode === "custom" ? (toMin(boardWindow.to) || DAY_END)
    : (WINDOW_PRESETS.find((w) => w[0] === boardWindow.mode)?.[2] || [, DAY_END])[1];
  setWindow(winFrom, Math.max(winFrom + 60, winTo));
  const nextDate = key(addDays(parseKey(boardDate), 1));

  /** Bookings on this board: today's, plus the next morning's up to 01:00. */
  const onBoard = useMemo(() => {
    const list = bookings.filter((b) => b.date === boardDate).map((b) => ({ b, off: 0 }));
    for (const b of bookings) {
      if (b.date !== nextDate) continue;
      if (toMin(b.start) + 1440 < CLOSE_MIN) list.push({ b, off: 1440 });
    }
    return list;
  }, [bookings, boardDate, nextDate]);

  const [nowMin, setNowMin] = useState(() => toMin(nowHHMM()));
  useEffect(() => {
    const id = window.setInterval(() => setNowMin(toMin(nowHHMM())), 30000);
    return () => window.clearInterval(id);
  }, []);
  const isToday = boardDate === key(TODAY);
  /* only actual flights count — a ground or briefing booking isn't an aircraft in the air */
  const flyingNow = outNow.filter((b) => b.aircraftId && acById(b.aircraftId).class !== "sim");
  const overdueNow = flyingNow.filter((b) => b.eta && toMin(b.eta) < toMin(nowHHMM()));
  /* everything still to go out today, earliest first — several can share a slot time */
  /* only airframes queue on the line — a briefing room needs nothing pulled out */
  const pendingOut = bookings.filter((b) => b.date === boardDate && b.status === "scheduled"
    && !OUT(b) && !BACK(b) && b.aircraftId)
    .sort((a, b) => toMin(a.start) - toMin(b.start));
  const nextOut = pendingOut.filter((b) => b.start === (pendingOut[0] || {}).start);
  const onScale = (m) => m != null && m >= OPEN_MIN && m <= CLOSE_MIN;
  const yFor = (m) => (m - OPEN_MIN) * PX_PER_MIN;

  /* TA shifts for this day, with whoever's rostered if a schedule has been built */
  const taSchedule = taResult && taResult.schedule[boardDate] ? taResult.schedule[boardDate] : null;
  const taLane = useMemo(() => {
    const { shifts } = taShiftsForDate(boardDate, taShifts, site.lat, site.lon);
    return shifts.map((s) => ({
      ...s,
      startMin: Math.round(s.start * 60),
      endMin: Math.round(s.end * 60),
      need: taSlots[s.id] || 0,
      names: taSchedule ? (taSchedule[s.id] || []) : [],
    }));
  }, [boardDate, taShifts, site.lat, site.lon, taSlots, taSchedule]);

  const gridRef = useRef(null);
  const [drag, setDrag] = useState(null);
  const dragRef = useRef(null);
  const suppressClick = useRef(false);
  dragRef.current = drag;

  const beginDrag = (e, b, mode) => {
    if (!canEdit || b.status === "cancelled") return;
    e.stopPropagation();
    suppressClick.current = false;
    const rect = gridRef.current?.getBoundingClientRect();
    if (!rect) return;
    const colWidth = (rect.width - GUTTER - (byFleet && STAFF_REF.enabled ? TA_LANE_W : 0)) / columns.length;
    const c0 = Math.max(0, columns.findIndex((c) => inColumn(b, c.key)));
    const off = b.date === boardDate ? 0 : 1440;
    const s0 = toMin(b.start) + off;
    setDrag({ id: b.id, mode, x0: e.clientX, y0: e.clientY, s0, d0: dur(b), c0, colWidth,
      pStart: s0, pDur: dur(b), pCol: c0, live: false });
  };

  useEffect(() => {
    if (!drag) return;
    const move = (e) => setDrag((d) => {
      if (!d) return d;
      const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
      /* only engage after a deliberate movement, so a plain click always opens the booking */
      const live = d.live || Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD;
      if (!live) return d;
      const dm = Math.round(dy / PX_PER_MIN / 5) * 5;
      if (d.mode === "resize") return { ...d, live, pDur: Math.max(20, Math.min(d.d0 + dm, CLOSE_MIN - d.s0)) };
      const pStart = Math.max(OPEN_MIN, Math.min(d.s0 + dm, CLOSE_MIN - d.d0));
      const pCol = Math.max(0, Math.min(columns.length - 1, d.c0 + (d.colWidth ? Math.round(dx / d.colWidth) : 0)));
      return { ...d, live, pStart, pCol };
    });
    const up = () => {
      const d = dragRef.current;
      if (d && d.live) {
        suppressClick.current = true;
        if (d.mode === "resize") resizeBooking(d.id, d.pDur);
        else {
          const past = d.pStart >= 1440;
          const patch = { start: toHHMM(d.pStart - (past ? 1440 : 0)), date: past ? nextDate : boardDate };
          patch[byFleet ? "aircraftId" : "instructorId"] = columns[d.pCol].key;
          moveBooking(d.id, patch);
        }
      }
      setDrag(null);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
    return () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
    };
  }, [drag?.id, drag?.mode, columns.length, byFleet]);

  const openBooking = (b) => {

  /** Click anywhere empty on the grid to start a booking there. */

    const m = Math.max(OPEN_MIN, Math.min(Math.round(raw / 60) * 60, CLOSE_MIN - 60));
    const past = m >= 1440;
    const start = toHHMM(m - (past ? 1440 : 0));
    setSel({

  const weekStart = mondayOf(parseKey(boardDate));

  return (

        {canEdit && showLegend && (
        <div className="flex flex-wrap items-center gap-x-3 gap-y-1 ml-auto">

              <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: T.ink2 }}>{x.name}</span>
            </span>

          {types.filter((x) => !needsStudent(x)).map((x) => (
            <span key={x.id} className="flex items-center gap-1">

              <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: T.ink2 }}>{x.name}</span>
            </span>
          ))}
          <span style={{ color: T.line }}>|</span>
          <span className="flex items-center gap-1">
            <span style={{ width: 16, height: 10, display: "inline-block", borderRadius: 2,

            <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: T.ink2 }}>Airborne</span>
          </span>
          <span className="flex items-center gap-1">
            <span style={{ width: 16, height: 10, display: "inline-block", borderRadius: 2,
              background: tint(darken(T.ink2, 0.55), 0.46), borderLeft: `3px solid ${darken(T.ink2, 0.55)}` }} />
            <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: T.ink2 }}>Complete</span>
          </span>
        </div>
        )}
      </div>

      {/* week jump */}
      <div className="flex flex-wrap items-center gap-1 mb-3">
        {Array.from({ length: 7 }, (_, i) => key(addDays(weekStart, i))).map((d) => {
          const n = bookings.filter((b) => b.date === d && b.status !== "cancelled").length;
          const on = d === boardDate;
          return (
            <button key={d} onClick={() => setBoardDate(d)} style={{
              fontFamily: FONT_MONO, fontSize: 11, padding: "2px 8px", borderRadius: 2,

              color: on ? T.paper : d === key(TODAY) ? T.magenta : T.ink2 }}>
              {DAY_ABBR[wdIndex(d)].toUpperCase()} {String(parseKey(d).getDate()).padStart(2, "0")} · {n}
            </button>
          );
        })}

        <span className="flex flex-wrap items-center gap-x-3 ml-auto"
          title={`Daylight at ${site.ident}`} style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em" }}>
          <span style={{ color: tx(T.ink3) }}>{site.ident}</span>
          {[["CT", marks.civilStart, T.blue], ["SR", marks.sunrise, T.amber],

            <span key={l} style={{ color: col }}>

          ))}
        </span>
      </div>

      {/* say plainly where the sun times came from */}
      <div className="mb-3" style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em" }}>

          </span>
        ) : sunFeed?.status === "loading" ? (
          <span style={{ color: tx(T.ink3) }}>▪ CHECKING ENVIRONMENT CANADA…</span>
        ) : sunFeed?.status === "failed" ? (
          <span style={{ color: tx(T.amber) }} title={sunFeed.error}>
            ▪ ENVIRONMENT CANADA UNREACHABLE — TIMES COMPUTED ON DEVICE
          </span>
        ) : sunFeed?.status === "live" ? (
          <span style={{ color: tx(T.ink3) }}>▪ ENVIRONMENT CANADA COVERS TODAY ONLY — THIS DATE IS COMPUTED</span>
        ) : (
          <span style={{ color: tx(T.ink3) }}>▪ TIMES COMPUTED ON DEVICE · ADD AN ENVIRONMENT CANADA SITE CODE ON SETUP</span>
        )}
      </div>

      {/* dispatched — every aircraft currently signed out, plus what's next out */}
      {canEdit && byFleet && (
      <div className="mb-3" style={{ border: `1px solid ${outNow.length ? T.sage : T.line}`, background: T.panel }}>
        <div className="px-3 py-2 flex flex-wrap items-baseline gap-x-4 gap-y-1"
          style={{ borderBottom: outNow.length ? `1px solid ${T.lineSoft}` : "none" }}>
          <span style={{ fontFamily: FONT_UI, fontWeight: 700, fontSize: 13, letterSpacing: "0.06em", textTransform: "uppercase" }}>
            Dispatched
          </span>
          <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: flyingNow.length ? tx(T.sage) : tx(T.ink3) }}>
            {flyingNow.length} FLYING
            {overdueNow.length ? ` · ${overdueNow.length} OVERDUE` : ""}
          </span>
          {outNow.length === 0 && (
            <span style={{ fontSize: 13, color: T.ink2 }}>Nothing signed out.</span>
          )}
        </div>

        {/* one compact line each — a busy morning stays a short list */}
        {outNow.length > 0 && (
          <div>
            {outNow.map((b) => {
              const st = stuById(b.studentId);
              const late = b.eta && toMin(b.eta) < toMin(nowHHMM());
              return (
                <div key={b.id} className="flex items-center gap-3 px-3 py-1 overflow-x-auto"
                  style={{ borderTop: `1px solid ${T.lineSoft}`, borderLeft: `4px solid ${late ? T.red : T.sage}`,
                    whiteSpace: "nowrap" }}>
                  <button onClick={() => setSel({ type: "booking", id: b.id })}
                    style={{ fontFamily: FONT_MONO, fontSize: 13, fontWeight: 600, width: 79, textAlign: "left" }}>
                    {b.aircraftId ? acById(b.aircraftId).reg : "GROUND"}
                  </button>
                  <button onClick={() => setSel({ type: "booking", id: b.id })}
                    style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 13, minWidth: 130, textAlign: "left" }}>
                    {st ? st.name : typeById(b.typeId).name}
                  </button>
                  <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3) }}>
                    OUT {b.checkOutAt}
                  </span>
                  <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3), width: 53 }}>
                    {b.dest || ""}
                  </span>
                  <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3), width: 94 }}>
                    {b.fuelOnBoard !== "" ? `${b.fuelOnBoard} ${shortUnit(fuelUnit)}` : ""}
                    {b.oilQts !== "" ? ` ${b.oilQts}qt` : ""}
                  </span>
                  <span style={{ fontFamily: FONT_MONO, fontSize: 11, fontWeight: 600,
                    color: late ? tx(T.red) : T.ink2, width: 110 }}>
                    {b.eta ? (late ? `OVERDUE ${b.eta}` : `ETA ${b.eta}`) : ""}
                  </span>
                  <span className="flex items-center gap-1" style={{ marginLeft: "auto" }}>
                    {canEdit && <Btn small onClick={() => undoDispatch(b)} title="Signed out by mistake — put it back on the line">
                      Undo
                    </Btn>}
                    {canEdit && <Btn small tone="go" onClick={() => checkIn(b)}>Check in</Btn>}
                  </span>
                </div>
              );
            })}
          </div>
        )}
      </div>

      )}

      {/* on the line — what's queued to go out next, ready to sign out */}
      {canEdit && byFleet && (
      <div className="mb-3" style={{ border: `1px solid ${T.line}`, background: T.panel }}>
        <div className="px-3 py-2 flex flex-wrap items-baseline gap-x-4 gap-y-1"
          style={{ borderBottom: nextOut.length ? `1px solid ${T.lineSoft}` : "none" }}>
          <span style={{ fontFamily: FONT_UI, fontWeight: 700, fontSize: 13, letterSpacing: "0.06em", textTransform: "uppercase" }}>
            On the line
          </span>
          {nextOut.length > 0 && (
            <>
              <span style={{ fontFamily: FONT_MONO, fontSize: 13, fontWeight: 600, color: T.ink }}>
                {nextOut[0].start}
              </span>
              <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3) }}>
                {pendingOut.length - nextOut.length} LATER TODAY
              </span>
            </>
          )}
          {pendingOut.length === 0 && (
            <span style={{ fontSize: 13, color: T.ink2 }}>Nothing left to go out today.</span>
          )}
        </div>

        {/* one compact line each, matching the dispatched list */}
        {nextOut.length > 0 && (
          <div>
            {nextOut.map((b) => {
              const st = stuById(b.studentId);
              const risky = riskReason(b);
              return (
                <div key={b.id} className="flex items-center gap-3 px-3 py-1 overflow-x-auto"
                  style={{ borderTop: `1px solid ${T.lineSoft}`, borderLeft: `4px solid ${risky ? T.amber : T.ink}`,
                    background: tint(T.ink, 0.03), whiteSpace: "nowrap" }}>
                  <button onClick={() => setSel({ type: "booking", id: b.id })}
                    style={{ fontFamily: FONT_MONO, fontSize: 13, fontWeight: 600, width: 79, textAlign: "left" }}>
                    {b.aircraftId ? acById(b.aircraftId).reg : "GROUND"}
                  </button>
                  <button onClick={() => setSel({ type: "booking", id: b.id })}
                    style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 13, minWidth: 130, textAlign: "left" }}>
                    {st ? st.name : typeById(b.typeId).name}
                  </button>
                  <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3), width: 89 }}>
                    {typeById(b.typeId).code}
                  </span>
                  <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.ink3), width: 72 }}>

                  </span>

                    {b.fuelRequested !== "" && (
                      <span style={{ background: solidBg(T.red), color: "#FFFFFF", borderRadius: 2, padding: "0px 4px",

                  <span style={{ marginLeft: "auto" }}>

                  </span>

        <div style={{ minWidth: GUTTER + (byFleet && STAFF_REF.enabled ? TA_LANE_W : 0) + columns.length * colW }}>
          <div className="flex" style={{ borderBottom: `1px solid ${T.line}`, background: T.panelAlt }}>
            <div style={{ width: GUTTER }} />
            {byFleet && STAFF_REF.enabled && (
              <div className="px-2 py-1 shrink-0"
                style={{ width: TA_LANE_W, borderRight: `2px solid ${T.line}`, background: tint(T.ink, 0.04) }}>
                <div style={{ fontFamily: FONT_MONO, fontWeight: 600, fontSize: 13, letterSpacing: "0.06em" }}>

            {columns.map((c) => {

                const n = bookings.filter((b) => inColumn(b, c.key) && b.status !== "cancelled").length;

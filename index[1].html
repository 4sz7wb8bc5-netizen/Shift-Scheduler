/* ============================================================
   FLIGHT PROGRESS BOARD
   A dispatch board for a flight training unit: one day, one
   column per airframe, strips you drag, click, and sign out.

   Anything renameable is referenced by a stable id, so an admin
   can rename it without orphaning existing bookings.
   ============================================================ */

/* Two palettes with the same keys. `T` points at whichever is live; the app
   swaps it before its children render, the same way the fleet mirror works.
   Accents are brighter on dark so they hold their identity against the panel. */
const LIGHT = {
  paper: "#E9EAE2", panel: "#F7F7F2", panelAlt: "#EFEFE8",
  ink: "#17242B", ink2: "#4B5A62", ink3: "#7C8891",
  line: "#CBCEC0", lineSoft: "#DEE0D4",
  magenta: "#B4257A", blue: "#2E6E9E", teal: "#1F7A6B",
  sage: "#5F7A46", amber: "#B4790F", violet: "#7A4E8F", red: "#A6342B",
  band: "#5A4B9E", wash: "#3E7C8C", cyan: "#0F6E86",
};
const DARK = {
  paper: "#12181B", panel: "#1A2226", panelAlt: "#212B30",
  ink: "#E7ECEA", ink2: "#AFBBBF", ink3: "#7E8D92",
  line: "#33424A", lineSoft: "#27333A",
  magenta: "#E86AB0", blue: "#69A9DA", teal: "#5FD3B9", sage: "#A0C877",
  amber: "#E5AE43", violet: "#BE92D6", red: "#EC7A70",
  band: "#9A8FE8", wash: "#7ECBDC", cyan: "#68CFE8",
};

/* Annunciator convention, borrowed from the flight deck and used throughout:
     green  — normal, proceeding (airborne, on line, available)
     amber  — caution, needs a decision (restrictions, short-staffed, away)
     red    — warning, stop (overdue, unserviceable, over a limit)
     cyan   — advisory, information only (daylight, twilight, counts)
     magenta— the thing you have selected or are acting on
   Anything that isn't one of those stays in the neutral inks. */
let T = LIGHT;
let DARK_MODE = false;
/** Swap the palette. Called by the app before anything renders. */
const useTheme = (mode) => { DARK_MODE = mode === "dark"; T = DARK_MODE ? DARK : LIGHT; };

const SWATCH_KEYS = ["ink", "magenta", "blue", "teal", "sage", "amber", "violet", "red", "ink3"];
const SWATCH_NAMES = { ink: "Ink", magenta: "Magenta", blue: "Chart blue", teal: "Teal",
  sage: "Sage", amber: "Amber", violet: "Violet", red: "Red", ink3: "Grey" };
/* built per render so the swatch values follow the live theme */
const swatches = () => SWATCH_KEYS.map((k) => [SWATCH_NAMES[k], T[k]]);

/* IBM Plex: drawn for technical and operational interfaces, so it carries dense
   tabular data without looking either playful or generic. Condensed for the
   board, where column width is the scarce resource; the regular face for prose;
   the mono for anything that has to line up in a column. */
const FONT_UI = "'IBM Plex Sans Condensed', 'Barlow Semi Condensed', 'Helvetica Neue', Arial, sans-serif";
const FONT_BODY = "'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif";
const FONT_MONO = "'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace";

/* ------------------------- readable text colours ----------------------
   Every colour in the palette doubles as a fill and as text. These pick a
   variant that clears WCAG AA (4.5:1) against whatever it sits on, so no
   label is ever washed out by its own background. */

const _rgb = (h) => {
  let x = String(h).replace("#", "");
  if (x.length === 3) x = x.split("").map((c) => c + c).join("");
  const n = parseInt(x, 16);
  return Number.isNaN(n) ? [0, 0, 0] : [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const _hex = (c) => "#" + c.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
const _lum = (rgb) => {
  const a = rgb.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
};
const contrast = (fg, bg) => {
  const a = _lum(_rgb(fg)), b = _lum(_rgb(bg));
  return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
};

/** Raw translucent colour — for veiling a surface in its own panel colour. */
const veil = (hex, alpha) => {
  const h = String(hex).replace("#", "");
  const f = h.length === 3 ? h.split("").map((x) => x + x).join("") : h;
  const n = parseInt(f, 16);
  if (Number.isNaN(n)) return `rgba(23,36,43,${alpha})`;
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
};

/** Accent tint for filling strips and bands. On the dark theme the same alpha
    would wash a bright accent into a mid tone that neither light nor dark text
    can sit on, so the strength is pulled back and fills stay dark. */
const tint = (hex, alpha) => veil(hex, DARK_MODE ? alpha * 0.42 : alpha);

/** Text colour for sitting on a solid fill of `bg` — white or ink, whichever reads better. */
const onSolid = (bg) => (contrast("#FFFFFF", bg) >= contrast("#17242B", bg) ? "#FFFFFF" : "#17242B");

/** A fill that white text is guaranteed to read on. Mid-tone colours like amber
    sit in a dead zone where neither white nor ink works, so the fill gives way. */
const _solidCache = {};
const solidBg = (color) => {
  if (!color) return "#17242B";
  if (_solidCache[color]) return _solidCache[color];
  const base = _rgb(color);
  let out = color;
  for (let f = 1.0; f > 0.2; f -= 0.02) {
    const c = _hex(base.map((v) => v * f));
    if (contrast("#FFFFFF", c) >= 4.5) { out = c; break; }
  }
  _solidCache[color] = out;
  return out;
};

/** A variant of `color` that stays legible as text on the current panel and on
    tints of itself — darkened on the light theme, lightened on the dark one.
    Memoised per theme, since this runs inside render. */
const _txCache = {};
const _mix = (c, f) => {
  /* f < 1 darkens toward black, f > 1 lightens toward white */
  const base = _rgb(c);
  return _hex(f <= 1 ? base.map((v) => v * f)
    : base.map((v) => v + (255 - v) * (f - 1)));
};
const tx = (color) => {
  if (!color) return T.ink;
  const key = (DARK_MODE ? "d:" : "l:") + color;
  if (_txCache[key]) return _txCache[key];
  const panel = T.panel;
  const tintBg = _hex(_rgb(color).map((v, i) => v * 0.62 + _rgb(panel)[i] * 0.38));
  let out = color;
  for (let step = 0; step <= 40; step++) {
    const f = DARK_MODE ? 1 + step * 0.025 : 1 - step * 0.02;
    const c = _mix(color, f);
    if (contrast(c, panel) >= 4.5 && contrast(c, tintBg) >= 4.5) { out = c; break; }
  }
  _txCache[key] = out;
  return out;
};

/** Darker shade of a hex colour — used for completed bookings. */
const darken = (hex, f = 0.55) => {
  const h = String(hex).replace("#", "");
  const s = h.length === 3 ? h.split("").map((x) => x + x).join("") : h;
  const n = parseInt(s, 16);
  if (Number.isNaN(n)) return hex;
  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * f));
  return `#${ch.map((v) => v.toString(16).padStart(2, "0")).join("")}`;
};


/* ---------------------------- time helpers ---------------------------- */

const toMin = (t) => { const [h, m] = String(t).split(":").map(Number); return h * 60 + m; };
const toHHMM = (m) => {
  const mm = Math.max(0, Math.min(24 * 60 - 1, Math.round(m)));
  return `${String(Math.floor(mm / 60)).padStart(2, "0")}:${String(mm % 60).padStart(2, "0")}`;
};
const dur = (b) => toMin(b.end) - toMin(b.start);
const hrs = (m) => (m / 60).toFixed(1);
const key = (d) => {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
};
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); x.setHours(0, 0, 0, 0); return x; };
const parseKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const mondayOf = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return addDays(x, -((x.getDay() + 6) % 7)); };
const DAY_ABBR = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MON_ABBR = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const wdIndex = (dk) => (parseKey(dk).getDay() + 6) % 7;
const overlaps = (aS, aE, bS, bE) => aS < bE && bS < aE;
const fmtDate = (dk) => {
  const d = parseKey(dk);
  return `${DAY_ABBR[wdIndex(dk)].toUpperCase()} ${String(d.getDate()).padStart(2, "0")} ${MON_ABBR[d.getMonth()]}`;
};
const uid = (p) => `${p}${Date.now().toString(36)}${Math.floor(Math.random() * 999).toString(36)}`;
const nowHHMM = () => { const d = new Date(); return toHHMM(d.getHours() * 60 + d.getMinutes()); };

/** Never let a fuel figure exceed what the airframe can hold, and keep it whole. */
const clampFuel = (v, cap) => {
  if (v === "" || v === null || v === undefined) return "";
  const n = Math.round(Number(v));
  if (Number.isNaN(n)) return "";
  return Math.max(0, Math.min(n, Math.round(cap || 0)));
};
const shortUnit = (u) => (u === "US gal" ? "gal" : u);

/** Oil goes in to the nearest tenth of a quart. */
const clampOil = (v) => {
  if (v === "" || v === null || v === undefined) return "";
  const n = Number(v);
  if (Number.isNaN(n)) return "";
  return Math.max(0, Math.min(12, Math.round(n * 10) / 10));
};

/* Aircraft states. Anything other than active means the airframe can't fly, and
   `downFrom`/`downTo` let a known return date be recorded when it goes away. */
const AC_STATUS = [
  ["active", "Serviceable", "SVC"],
  ["maintenance", "Maintenance", "MAINT"],
  ["overhaul", "Overhaul", "OVHL"],
  ["retired", "Retired", "RETIRED"],
];
/* Set by hand; 'retired' is only reached by removing an airframe that has
   bookings on file, so it stays out of the lists. */
const AC_STATUS_PICK = AC_STATUS.filter(([v]) => v !== "retired");
/** Options for a status control, keeping the current value selectable. */
const statusOptions = (current) =>
  AC_STATUS_PICK.some(([v]) => v === current) || !current
    ? AC_STATUS_PICK
    : [...AC_STATUS_PICK, AC_STATUS.find(([v]) => v === current)];

const statusName = (v) => (AC_STATUS.find((x) => x[0] === v) || [, v])[1];
const statusCode = (v) => (AC_STATUS.find((x) => x[0] === v) || [, , "—"])[2];

/** Is the airframe unavailable on this date? A dated window wins over the flag. */
const acDownOn = (a, dateKey) => {
  if (!a || a.id === "") return false;
  if (a.status === "retired") return true;
  /* a dated window governs on its own: away inside it, on line either side */
  if (a.downFrom || a.downTo) {
    const afterStart = !a.downFrom || dateKey >= a.downFrom;
    const beforeEnd = !a.downTo || dateKey <= a.downTo;
    return afterStart && beforeEnd;
  }
  return a.status !== "active";
};

  if (type.debriefMin) out.push(seg("k-debrief", type.debriefMin));
  if (type.adminMin) out.push(seg("k-admin", type.adminMin));
  return out;
};

function bookingLabel(b, stu, others = []) {
  if (b.label && b.label.trim()) return b.label.trim();
  const t = typeById(b.typeId);
  /* No student on this booking — the type is the name. */
  if (!b.studentId) return t.name;
  const map = {
    student: stu?.name || "Unassigned",
    first: stu?.name?.split(" ")[0] || "Unassigned",
    partner: (others || []).map((p) => p.name).join(", "),
    course: b.course,
    lesson: b.course ? lessonCode(b.course, b.lesson) : "",
    lessonname: b.course ? lessonName(b.course, b.lesson) : "",
    type: t.name,
    typecode: t.code,
    aircraft: b.aircraftId ? acById(b.aircraftId).reg : "Ground",
    instructor: insShort(b.instructorId),
    signout: insShort(b.signOutInstructorId),
    fuel: b.fuelRequested === "" ? "" : `${b.fuelRequested} ${shortUnit(UNIT_REF)}`,
    start: b.start, end: b.end,
  };
  return LABEL_REF.replace(/\{(\w+)\}/g, (m, k) => (k.toLowerCase() in map ? map[k.toLowerCase()] : m))
    .replace(/\s{2,}/g, " ").replace(/\s*·\s*·\s*/g, " · ")
    .replace(/^[\s·—-]+|[\s·—-]+$/g, "").trim() || (stu?.name || "Booking");
}

/* --------------------------- booking seeding -------------------------- */

function makeRng(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}

function seedBookings() {
  const rng = makeRng(20260730);
  const start = addDays(mondayOf(TODAY), -7);
  const out = [];
  const slots = ["08:00","10:00","12:00","14:00","16:00","18:00"];
  const next = {};
  SEED_STUDENTS.forEach((s) => (next[s.id] = s.done.length));
  let n = 0;

  for (let d = 0; d < 21; d++) {
    const date = key(addDays(start, d));
    const wd = wdIndex(date);
    const busy = { ac: {}, ins: {}, stu: {} };
    const push = (m, k, s, e) => ((m[k] = m[k] || []).push([s, e]));
    const free = (m, k, s, e) => !(m[k] || []).some(([x, y]) => overlaps(s, e, x, y));

    for (const ins of SEED_INSTRUCTORS) {
      /* nobody gets booked on a day they don't work, or outside their hours */
      const iw = ins.availability?.[wd];
      if (!iw) continue;
      if ((ins.timeOff || []).some((t) => date >= t.start && date <= t.end)) continue;
      const iStart = toMin(iw[0]), iEnd = toMin(iw[1]);

      const count = wd >= 5 ? 2 + Math.floor(rng() * 2) : 3 + Math.floor(rng() * 2);
      const roster = SEED_STUDENTS.filter((s) => s.instructorId === ins.id);
      const pool = [...slots].sort(() => rng() - 0.5).slice(0, count);
      for (const slot of pool) {
        const block = rng() > 0.65 ? 120 : 90;
        const s0 = toMin(slot), e0 = s0 + block;
        if (s0 < iStart || e0 > iEnd) continue;
        const cand = roster.filter((st) => {
          const w = st.availability[wd];
          if (!w || toMin(w[0]) > s0 || toMin(w[1]) < e0) return false;
          return free(busy.stu, st.id, s0, e0);
        }).sort(() => rng() - 0.5);
        if (!cand.length) continue;
        const st = cand[0];
        if (!free(busy.ins, ins.id, s0, e0)) continue;

        const li = Math.min(next[st.id], SEED_SYLLABI[st.course].lessons.length - 1);
        const lname = SEED_SYLLABI[st.course].lessons[li];
        const r = rng();
        let typeId = "t-dual";
        if (lname.startsWith("Solo")) typeId = "t-solo";
        else if (st.course === "IFR" && r > 0.72) typeId = "t-simd";
        else if (st.course === "FI" && r > 0.6) typeId = "t-dmut";
        else if (r > 0.9) typeId = "t-ground";
        let type = SEED_TYPES.find((t) => t.id === typeId);

        let acId = "";
        if (type.aircraft !== "none") {
          const want = type.aircraft === "sim" ? (a) => a.class === "sim"
            : st.course === "Multi" ? (a) => a.class === "multi" : (a) => a.class === "single";
          const ac = SEED_FLEET.filter(want).find((a) => free(busy.ac, a.id, s0, e0));
          if (!ac) continue;
          acId = ac.id;
        }

        let partnerIds = [];
        if (type.partner) {
          const p = SEED_STUDENTS.find((o) => o.id !== st.id && o.course === st.course && free(busy.stu, o.id, s0, e0));
          if (!p) { typeId = "t-dual"; type = SEED_TYPES[0]; }
          else { partnerIds = [p.id]; push(busy.stu, p.id, s0, e0); }
        }

        const past = parseKey(date) < TODAY;
        const status = past ? (rng() > 0.88 ? "cancelled" : "flown") : "scheduled";
        /* weather dominates in the real world, then snags, then the rest */
        const rw = rng();
        const why = status !== "cancelled" ? ""
          : rw < 0.42 ? "weather" : rw < 0.66 ? "snag" : rw < 0.82 ? "sick" : rw < 0.94 ? "conflict" : "other";
        if (status !== "cancelled") next[st.id] = li + 1;

        out.push(syncEnd({
          id: `b${++n}`, date, start: toHHMM(s0), end: toHHMM(e0),
          studentId: st.id, partnerIds, instructorId: ins.id,
          signOutInstructorId: ins.id, aircraftId: acId,
          course: st.course, lesson: li, typeId, status,
          label: "", note: ins.id !== st.instructorId ? "Covering flight" : "",
          examiner: "", fuelRequested: "", fuelNote: "",
          cancelReason: why, cancelNote: why === "other" ? "Airspace closed for an airshow." : "",
          checkOutAt: "", checkInAt: "", fuelOnBoard: "", oilQts: "", dest: "", eta: "",
          segments: defaultSegments(type, block),
        }));
        if (acId) push(busy.ac, acId, s0, e0);
        push(busy.ins, ins.id, s0, e0);
        push(busy.stu, st.id, s0, e0);
      }
    }
  }

  /* one aircraft already back, one still out, so the board reads as a real day */
  const todayFlights = out.filter((b) => b.date === key(TODAY) && b.aircraftId && b.status === "scheduled")
    .sort((a, b) => toMin(a.start) - toMin(b.start));
  if (todayFlights[0]) {
    const b = todayFlights[0];
    b.checkOutAt = b.start; b.checkInAt = b.end; b.status = "flown";
  }
  if (todayFlights[1]) {
    const b = todayFlights[1];
    b.checkOutAt = b.start;
    b.fuelOnBoard = 30; b.oilQts = 1; b.dest = "CYLW";
    b.eta = toHHMM(toMin(b.start) + Math.round(dur(b) * 0.8));
    b.fuelNote = "Weight limited with two on board.";
  }
  const xc = out.find((b) => b.status === "scheduled" && b.aircraftId && lessonName(b.course, b.lesson).includes("Cross-Country"));
  if (xc) {
    xc.fuelRequested = SEED_FLEET.find((a) => a.id === xc.aircraftId).fuelCap;
    xc.fuelNote = "Full tanks — no fuel available at the destination.";
    xc.note = "Route via the valley, PIREPs for turbulence east.";
  }
  const heavy = out.find((b) => b.status === "scheduled" && b.aircraftId === "a3" && b.date >= key(TODAY));
  if (heavy) { heavy.fuelRequested = 16; heavy.fuelNote = "Weight limited with two on board."; }
  const notes = [
    "Third attempt at the flare — be patient on the roundout.",
    "Bring the nav log, we'll file this one.",
    "Pre-solo written to be marked before we walk out.",
    "Radio work needs polish — student flies, you talk.",
  ];
  out.filter((b) => b.date >= key(TODAY) && b.status === "scheduled" && !b.note)
    .slice(0, 4).forEach((b, i) => (b.note = notes[i]));

  /* a couple of studentless bookings so the board shows the pattern */
  const mkHold = (typeId, aircraftId, date, start, block, note) => {
    const t = SEED_TYPES.find((x) => x.id === typeId);
    const s0 = toMin(start);
    if (out.some((b) => b.aircraftId === aircraftId && b.date === date && b.status !== "cancelled" &&
      overlaps(s0, s0 + block, toMin(b.start), toMin(b.end)))) return;
    out.push(syncEnd({
      id: `b${++n}`, date, start, end: start,
      studentId: "", partnerIds: [], instructorId: "", signOutInstructorId: "",
      aircraftId, course: "", lesson: 0, typeId, status: "scheduled",
      label: "", note, examiner: "", fuelRequested: "", fuelNote: "", cancelReason: "", cancelNote: "",
      checkOutAt: "", checkInAt: "", fuelOnBoard: "", oilQts: "", dest: "", eta: "",
      segments: defaultSegments(t, block),
    }));
  };
  mkHold("t-maint", "a2", key(addDays(TODAY, 1)), "08:00", 240, "100-hour inspection — aircraft unavailable all morning.");
  mkHold("t-hold", "a4", key(TODAY), "16:00", 120, "Held for the chief pilot's currency check.");
  mkHold("t-wash", "a1", key(addDays(TODAY, 1)), "16:00", 60, "Bugs off the leading edges before the weekend.");
  return out;
}

/** Live local and Zulu clock, 24-hour, ticking each second. */
function Clock() {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => {
    const id = window.setInterval(() => setNow(new Date()), 1000);
    return () => window.clearInterval(id);
  }, []);
  const pad = (n) => String(n).padStart(2, "0");
  const local = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const utc = `${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())}`;
  const zone = (() => {
    try {
      return new Intl.DateTimeFormat(undefined, { timeZoneName: "short" })
        .formatToParts(now).find((p) => p.type === "timeZoneName")?.value || "LOCAL";
    } catch { return "LOCAL"; }
  })();
  const diff = now.getUTCDate() - now.getDate();
  const utcDayNote = diff === 0 ? "" : diff === 1 || diff < -1 ? "+1" : "−1";
  const dim = DARK_MODE ? T.ink3 : "rgba(233,234,226,0.55)";
  const main = DARK_MODE ? T.ink : T.paper;

  const Face = ({ label, time, note, accent }) => (
    <span className="flex items-baseline gap-1">
      <span style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.12em", color: dim }}>{label}</span>

  return (

  );
}

/* --------------------- Environment Canada rise/set --------------------
   MSC Datamart publishes sunrise and sunset in the citypage weather XML.
   Files are named with a timestamp, so the hour directory is listed first
   and the matching file pulled from it.

   Two things this cannot do, and the interface says so rather than pretending:
   the feed only carries today and the next few days, so the year-round
   capacity model stays on the computed figures; and the browser may be
   refused by CORS, in which case we fall back and label the source. */

const EC_BASE = "https://dd.weather.gc.ca/today/citypage_weather";

async function fetchEnvCanadaRiseSet({ prov, code }) {
  if (!prov || !code) throw new Error("no site code set");
  const hh = String(new Date().getUTCHours()).padStart(2, "0");
  const dir = `${EC_BASE}/${prov}/${hh}/`;
  const listing = await fetch(dir).then((r) => {
    if (!r.ok) throw new Error(`directory ${r.status}`);
    return r.text();
  });
  const match = listing.match(new RegExp(`[0-9TZ.]+_MSC_CitypageWeather_${code}_en\\.xml`));
  if (!match) throw new Error("no file for that site code this hour");
  const xml = await fetch(dir + match[0]).then((r) => {
    if (!r.ok) throw new Error(`file ${r.status}`);
    return r.text();
  });
  const doc = new DOMParser().parseFromString(xml, "text/xml");
  const pick = (name) => {
    const el = [...doc.querySelectorAll("riseSet dateTime")]
      .find((n) => n.getAttribute("name") === name && n.getAttribute("zone") !== "UTC");
    if (!el) return null;
    const h = el.querySelector("hour")?.textContent, m = el.querySelector("minute")?.textContent;
    return h != null && m != null ? Number(h) * 60 + Number(m) : null;
  };
  const sunrise = pick("sunrise"), sunset = pick("sunset");
  if (sunrise == null || sunset == null) throw new Error("rise/set missing from the feed");
  return { sunrise, sunset, fetchedAt: new Date() };
}

/* ---------------------------- sun times ------------------------------- */

/** NOAA sunrise/sunset approximation. zenith 90.833 = sun's upper limb at the
    horizon; 96 = civil twilight. Returns local minutes past midnight, or null
    if the event doesn't happen that day. */
function sunEvent(dateKey, lat, lon, zenith, rising) {
  const d = parseKey(dateKey);
  const start = new Date(d.getFullYear(), 0, 0);
  const N = Math.floor((d - start) / 86400000);
  const rad = Math.PI / 180, deg = 180 / Math.PI;
  const lngHour = lon / 15;

  const t = N + ((rising ? 6 : 18) - lngHour) / 24;
  const M = 0.9856 * t - 3.289;
  let L = M + 1.916 * Math.sin(M * rad) + 0.020 * Math.sin(2 * M * rad) + 282.634;
  L = ((L % 360) + 360) % 360;

  let RA = Math.atan(0.91764 * Math.tan(L * rad)) * deg;
  RA = ((RA % 360) + 360) % 360;
  /* keep RA in the same quadrant as L */
  RA += Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90;
  RA /= 15;

  const sinDec = 0.39782 * Math.sin(L * rad);
  const cosDec = Math.cos(Math.asin(sinDec));
  const cosH = (Math.cos(zenith * rad) - sinDec * Math.sin(lat * rad)) / (cosDec * Math.cos(lat * rad));
  if (cosH > 1 || cosH < -1) return null; /* sun never rises or never sets */

  const H = (rising ? 360 - Math.acos(cosH) * deg : Math.acos(cosH) * deg) / 15;
  const T = H + RA - 0.06571 * t - 6.622;
  let UT = ((T - lngHour) % 24 + 24) % 24;

  /* convert that UTC instant to the site's local clock, DST included */
  const utc = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0));
  utc.setUTCMinutes(utc.getUTCMinutes() + Math.round(UT * 60));
  return utc.getHours() * 60 + utc.getMinutes();
}

/** The four daylight markers a flight school actually schedules against. */
function sunMarks(dateKey, lat, lon) {
  return {
    civilStart: sunEvent(dateKey, lat, lon, 96, true),
    sunrise: sunEvent(dateKey, lat, lon, 90.833, true),
    sunset: sunEvent(dateKey, lat, lon, 90.833, false),
    civilEnd: sunEvent(dateKey, lat, lon, 96, false),
  };
}

const hDec = (m) => m / 60;
const fmtH = (h) => toHHMM(Math.round(h * 60));
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

/** Rolling periods built from an anchor date and a length the user sets, so a
    two-week cycle can start on any day rather than the 1st and 16th. */
function buildPeriods(anchorKey, lengthDays, count = 14) {
  const list = [];
  let d = parseKey(anchorKey);
  for (let i = 0; i < count; i++) {
    const startD = d;
    const endD = addDays(d, lengthDays - 1);
    const a = `${String(startD.getDate()).padStart(2, "0")} ${MON_ABBR[startD.getMonth()]}`;
    const b = `${String(endD.getDate()).padStart(2, "0")} ${MON_ABBR[endD.getMonth()]}`;
    list.push({ id: `p-${key(startD)}`, label: `${a} – ${b}`, start: key(startD), end: key(endD) });
    d = addDays(endD, 1);
  }
  return list;
}

/** The period covering today, so the page opens on the current cycle. */
const currentPeriodId = (periods) => {
  const t = key(TODAY);
  return (periods.find((p) => t >= p.start && t <= p.end) || periods[0]).id;
};

const datesIn = (period) => {
  const out = [];
  let d = parseKey(period.start);
  const end = parseKey(period.end);
  while (d <= end) { out.push(key(d)); d = addDays(d, 1); }
  return out;
};

/** Shift 1 opens 30 min before sunrise, rounded to the half hour, never later than 08:00. */
function taShiftsForDate(dateKey, shifts, lat, lon) {
  const sr = sunEvent(dateKey, lat, lon, 90.833, true);
  const sunriseH = sr == null ? 6 : hDec(sr);
  const rounded = Math.min(Math.round((sunriseH - 0.5) * 2) / 2, 8.0);
  const live = shifts.filter((s) => s.enabled);
  return { shifts: live.map((s, i) => (i === 0 ? { ...s, start: rounded } : { ...s })), sunriseH };
}

/* ------------------------- schedule generation ------------------------ */

/** Faithful port: Rule 1 is hard, Rule 2 is relaxed only to avoid an empty seat. */
function generateTaSchedule({ shifts, templates, exceptions, slots, days }) {
  const live = shifts.filter((s) => s.enabled);
  if (!live.length) return { schedule: {}, violations: [] };
  const FIRST = live[0].id, LAST = live[live.length - 1].id;
  const idx = {}; live.forEach((s, i) => (idx[s.id] = i));

  /* Rule 1: whoever closed yesterday can't open today. */
  const passes1 = (prev, s) => !(prev === LAST && s.id === FIRST);
  /* Rule 2: no same shift twice running, and 1→2→3 progresses in order. */
  const passes2 = (prev, s) => {
    if (prev === undefined) return true;
    if (prev === s.id) return false;
    if (prev !== LAST) return idx[s.id] === idx[prev] + 1;
    return true;
  };
  const byLoad = (load) => (a, b) => ((load[a] || 0) - (load[b] || 0)) || a.localeCompare(b);
  /* someone mid-rotation is preferred over a fresh start, so chains aren't stalled */
  const byContinuity = (prevMap, load) => (a, b) =>
    ((prevMap[a] === undefined ? 1 : 0) - (prevMap[b] === undefined ? 1 : 0)) || byLoad(load)(a, b);

  function fillSeats(pool, need, prevMap, s, load, violations, ctx) {
    const p1 = pool.filter((n) => passes1(prevMap[n], s));
    const strict = p1.filter((n) => passes2(prevMap[n], s)).sort(byContinuity(prevMap, load));
    let chosen = strict.slice(0, need);
    chosen.forEach((n) => (load[n] = (load[n] || 0) + 1));
    const short = need - chosen.length;
    if (short > 0) {
      const relaxed = p1.filter((n) => !chosen.includes(n) && !passes2(prevMap[n], s)).sort(byLoad(load));
      const extra = relaxed.slice(0, short);
      extra.forEach((n) => {
        load[n] = (load[n] || 0) + 1;
        violations.push({ ...ctx, shiftId: s.id, name: n, prevShift: prevMap[n] });
      });
      chosen = chosen.concat(extra);
    }
    return chosen;
  }

  const prevWeekday = (d) => (d + 6) % 7;
  const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];
  const shiftMapOf = (dayAssign) => {
    const map = {};
    if (dayAssign) live.forEach((ps) => (dayAssign[ps.id] || []).forEach((n) => (map[n] = ps.id)));
    return map;
  };

  function buildWeek(mondaySeed, load) {
    const week = {}, wv = [];
    WEEK_ORDER.forEach((wd) => {
      const takenToday = new Set();
      week[wd] = {};
      const prevMap = wd === 1 && mondaySeed ? mondaySeed : shiftMapOf(week[prevWeekday(wd)]);
      live.forEach((s) => {
        const need = slots[s.id] || 0;
        week[wd][s.id] = [];
        if (need <= 0) return;
        const seen = new Set(), pool = [];
        templates.forEach((t) => {
          if (t.shiftIds.includes(s.id) && t.days.includes(wd) && !takenToday.has(t.name) && !seen.has(t.name)) {
            seen.add(t.name); pool.push(t.name);
          }
        });
        fillSeats(pool, need, prevMap, s, load, wv, { weekday: wd }).forEach((n) => {
          week[wd][s.id].push(n); takenToday.add(n);
        });
      });
    });
    return { week, wv };
  }

  /* pass 1 learns Sunday; pass 2 seeds Monday with it and is the real result */
  const pass1 = buildWeek(null, {});
  const load = {};
  const { week, wv } = buildWeek(shiftMapOf(pass1.week[0]), load);

  /* Monday against pass 2's actual Sunday — flagged rather than re-cascaded */
  const sunMap = shiftMapOf(week[0]);
  live.forEach((s) => {
    week[1][s.id].forEach((n) => {
      const prev = sunMap[n];
      if (prev === s.id || (prev === LAST && s.id === FIRST)) wv.push({ weekday: 1, shiftId: s.id, name: n, prevShift: prev });
    });
  });

  /* expand the weekly pattern across every date in the period */
  const schedule = {}, violations = [];
  days.forEach((d) => {
    const wd = parseKey(d).getDay();
    const assign = {};
    live.forEach((s) => (assign[s.id] = (week[wd][s.id] || []).slice()));
    schedule[d] = assign;
    wv.filter((v) => v.weekday === wd).forEach((v) =>
      violations.push({ date: d, shiftId: v.shiftId, name: v.name, prevShift: v.prevShift }));
  });

  /* one-off unavailability is always hard — pull them and backfill chronologically */
  days.forEach((d) => {
    const wd = parseKey(d).getDay();
    const hits = exceptions.filter((e) => e.dates.includes(d));
    if (!hits.length) return;
    const assign = schedule[d];
    const excepted = new Set();
    live.forEach((s) => {
      const off = hits.filter((e) => e.shiftIds.includes(s.id)).map((e) => e.name);
      if (!off.length) return;
      const before = assign[s.id].length;
      assign[s.id] = assign[s.id].filter((n) => !off.includes(n));
      off.forEach((n) => excepted.add(n));
      const shortfall = before - assign[s.id].length;
      if (shortfall <= 0) return;
      for (let i = violations.length - 1; i >= 0; i--)
        if (violations[i].date === d && violations[i].shiftId === s.id && excepted.has(violations[i].name)) violations.splice(i, 1);

      const busy = new Set();
      live.forEach((o) => (assign[o.id] || []).forEach((n) => busy.add(n)));
      const unavailableHere = new Set(hits.filter((e) => e.shiftIds.includes(s.id)).map((e) => e.name));
      const prevDate = key(addDays(parseKey(d), -1));
      const prevMap = shiftMapOf(schedule[prevDate]);
      const pool = [];
      const seen = new Set();
      templates.forEach((t) => {
        if (t.shiftIds.includes(s.id) && t.days.includes(wd) && !busy.has(t.name) &&
            !unavailableHere.has(t.name) && !seen.has(t.name)) { seen.add(t.name); pool.push(t.name); }
      });
      fillSeats(pool, shortfall, prevMap, s, load, violations, { date: d }).forEach((n) => assign[s.id].push(n));
    });
  });

  return { schedule, violations };
}

    setInstructors((is) => is.map((i) => (i.id === id ? { ...i, timeOff: [...i.timeOff, entry] } : i)));
    const hit = bookings.filter((b) => b.instructorId === id && b.status === "scheduled" && b.date >= entry.start && b.date <= entry.end);
    say(hit.length ? `Saved — ${hit.length} ${hit.length === 1 ? "flight needs" : "flights need"} another instructor` : "Time off saved");
  };
  const removeInsTimeOff = (id, tid) =>
    setInstructors((is) => is.map((i) => (i.id === id ? { ...i, timeOff: i.timeOff.filter((t) => t.id !== tid) } : i)));

  const conflictsFor = (b) => {
    const out = [];
    const s = toMin(b.start), e = toMin(b.end);
    const t = typeById(b.typeId);
    const others = bookings.filter((o) => o.id !== b.id && o.date === b.date && o.status !== "cancelled");
    const hits = (pred) => others.some((o) => pred(o) && overlaps(s, e, toMin(o.start), toMin(o.end)));

    if (b.aircraftId && hits((o) => o.aircraftId === b.aircraftId)) out.push(`${acById(b.aircraftId).reg} is booked by another flight`);
    if (acDown(b)) out.push(`${acById(b.aircraftId).reg} is ${acById(b.aircraftId).status} — move this to another airframe`);
    if (t.aircraft === "sim" && b.aircraftId && acById(b.aircraftId).class !== "sim") out.push(`${t.name} needs a simulator, not an aircraft`);
    if (t.aircraft === "none" && b.aircraftId) out.push(`${t.name} shouldn't hold an airframe`);
    if (t.aircraft === "any" && !b.aircraftId) out.push("No aircraft assigned");
    if (b.aircraftId && b.fuelRequested !== "" && Number(b.fuelRequested) > acById(b.aircraftId).fuelCap)
      out.push(`Fuel request is over ${acById(b.aircraftId).reg}'s max of ${acById(b.aircraftId).fuelCap} ${shortUnit(UNIT_REF)}`);

    if (b.instructorId && hits((o) => o.instructorId === b.instructorId)) out.push(`${insShort(b.instructorId)} is teaching another flight`);
    if (t.instructor === "required" && !b.instructorId) out.push(`${t.name} needs an instructor`);
    if (b.instructorId) {
      const iw = insById(b.instructorId).availability[wdIndex(b.date)];
      if (!iw || toMin(iw[0]) > s || toMin(iw[1]) < e) out.push(`Outside ${insShort(b.instructorId)}'s working hours`);
      const il = insOnLeave(b.instructorId, b.date);
      if (il) out.push(`${insShort(b.instructorId)} is away — ${il.reason}`);
    }
    if (t.instructor !== "none" && !b.signOutInstructorId) out.push(isSoloType(t) ? "No sign out instructor set" : "Nobody is signing this flight out");

    if (needsStudent(t) && !b.studentId) out.push(`${t.name} needs a student`);
    if (!needsStudent(t) && b.studentId) out.push(`${t.name} doesn't normally carry a student`);

    for (const id of crewOf(b)) {
      const st = stuById(id);
      if (!st) continue;
      const first = st.name.split(" ")[0];
      if (hits((o) => onBooking(o, id))) out.push(`${first} is already flying then`);
      const w = st.availability[wdIndex(b.date)];
      if (!w || toMin(w[0]) > s || toMin(w[1]) < e) out.push(`Outside ${first}'s stated availability`);
      if (onLeave(id, b.date)) out.push(`${first} has time off booked on this date`);
      if (isSoloType(t) && !soloReady(st)) out.push(`${first} hasn't been sent solo yet`);
    }
    if (t.examiner && !(b.examiner || "").trim()) out.push(`${t.name} needs an examiner`);
    if (t.partner && partnersOf(b).length === 0) out.push(`${t.name} needs a second student`);
    if (partnersOf(b).includes(b.studentId)) out.push("The same student is on the flight twice");
    if (new Set(partnersOf(b)).size !== partnersOf(b).length) out.push("The same student is listed twice");
    return out;
  };

  const lastFlown = (studentId, before) => {
    const past = bookings.filter((b) => onBooking(b, studentId) && b.status === "flown" && b.date < before)
      .sort((a, b) => (a.date < b.date ? 1 : -1));
    return past[0]?.date || null;
  };
  const daysSince = (dk, ref) => (dk ? Math.round((parseKey(ref) - parseKey(dk)) / 86400000) : null);

  const standbyFor = ({ date, start, end, aircraftId, instructorId, typeId, exclude = [], excludeBookingId }) => {
    const s = toMin(start), e = toMin(end), wd = wdIndex(date);
    const ac = acById(aircraftId);
    const t = typeId ? typeById(typeId) : null;
    return students.filter((st) => !exclude.includes(st.id)).map((st) => {
      const reasons = [], blocks = [];
      const w = st.availability[wd];
      if (!w || toMin(w[0]) > s || toMin(w[1]) < e) blocks.push(`Not available ${DAY_ABBR[wd]} ${start}–${end}`);
      const leave = onLeave(st.id, date);
      if (leave) blocks.push(`Time off — ${leave.reason}`);
      const clash = bookings.find((b) => b.id !== excludeBookingId && b.status !== "cancelled" && b.date === date &&
        onBooking(b, st.id) && overlaps(s, e, toMin(b.start), toMin(b.end)));
      if (clash) blocks.push(`Already booked ${clash.start}–${clash.end}`);
      if (aircraftId) {
        if (st.course === "Multi" && ac.class !== "multi") blocks.push(`Needs a twin, not ${ac.type}`);
        if (st.course !== "Multi" && ac.class === "multi") blocks.push(`${ac.type} is a twin — wrong class`);
      }
      if (t && isSoloType(t) && !soloReady(st)) blocks.push("Not yet sent solo");

      let score = 0;
      if (instructorId) {
        if (st.instructorId === instructorId) { score += 40; reasons.push(`${insShort(instructorId)}'s student`); }
        else if (insById(instructorId).quals.includes(st.course) || ["PPL","CPL"].includes(st.course))
          reasons.push(`${insShort(instructorId)} can cover ${st.course}`);
        else blocks.push(`${insShort(instructorId)} isn't qualified for ${st.course}`);
      }
      const ds = daysSince(lastFlown(st.id, date), date);
      if (ds === null) { score += 25; reasons.push("No flights on record"); }
      else { score += Math.min(ds * 2, 30); reasons.push(`Last flew ${ds} ${ds === 1 ? "day" : "days"} ago`); }
      const nxt = st.done.length;
      if (nxt < getSyl(st.course).lessons.length) reasons.push(`Next up ${lessonCode(st.course, nxt)}`);
      else blocks.push("Syllabus complete");
      if (!bookings.some((b) => b.studentId === st.id && b.status === "scheduled" && b.date >= date)) score += 12;
      return { student: st, ok: blocks.length === 0, reasons, blocks, score };
    }).sort((a, b) => (a.ok === b.ok ? b.score - a.score : a.ok ? -1 : 1));
  };

  const gapsForDay = (date) => {
    const out = [];
    for (const ac of fleet.filter((a) => a.status === "active")) {
      const day = bookings.filter((b) => b.date === date && b.aircraftId === ac.id && b.status !== "cancelled")
        .sort((a, b) => toMin(a.start) - toMin(b.start));
      /* look for idle time between sunrise and the end of evening civil twilight */
      const m = sunMarks(date, site.lat, site.lon);
      let cursor = m.sunrise ?? toMin("08:00");
      const close = m.civilEnd ?? toMin("20:00");
      for (const b of day) {
        if (toMin(b.start) - cursor >= 90) out.push({ aircraftId: ac.id, date, start: toHHMM(cursor), end: b.start });
        cursor = Math.max(cursor, toMin(b.end));
      }
      if (close - cursor >= 90) out.push({ aircraftId: ac.id, date, start: toHHMM(cursor), end: toHHMM(close) });
    }
    return out;
  };

  /* ---------------------------- mutations ---------------------------- */

  const patchBooking = (id, patch) => setBookings((bs) => bs.map((b) => (b.id === id ? syncEnd({ ...b, ...patch }) : b)));
  const setSegments = (id, segments) => patchBooking(id, { segments });
  const resizeBooking = (id, newDurMin) =>
    setBookings((bs) => bs.map((b) => {
      if (b.id !== id) return b;
      const delta = Math.max(20, newDurMin) - segTotal(b.segments);
      const pi = primaryIdx(b.segments);
      return syncEnd({ ...b, segments: b.segments.map((s, i) => (i === pi ? { ...s, minutes: Math.max(5, s.minutes + delta) } : s)) });
    }));
  const moveBooking = (id, patch) => patchBooking(id, patch);
  const shiftBooking = (b, d) => patchBooking(b.id, { start: toHHMM(toMin(b.start) + d) });

  const checkOut = (b) => {
    patchBooking(b.id, { checkOutAt: nowHHMM(), checkInAt: "" });
    say(`${acById(b.aircraftId).reg || "Booking"} signed out at ${nowHHMM()}`);
  };
  const checkIn = (b) => {
    patchBooking(b.id, { checkInAt: nowHHMM(), status: "flown" });
    say(`${acById(b.aircraftId).reg || "Booking"} back at ${nowHHMM()}`);
  };
  /** Reverse a check out or check in — the fuel, oil, destination and ETA stay,
      since those were filled in before the aircraft moved. */
  const undoDispatch = (b) => {
    patchBooking(b.id, { checkOutAt: "", checkInAt: "", status: "scheduled" });
    say(`${b.aircraftId ? acById(b.aircraftId).reg : "Booking"} put back on the line`);
  };
  /** Undo just the check in, leaving the aircraft signed out. */
  const undoCheckIn = (b) => {
    patchBooking(b.id, { checkInAt: "", status: "scheduled" });
    say(`${b.aircraftId ? acById(b.aircraftId).reg : "Booking"} back to airborne`);
  };

  const changeType = (b, typeId) => {
    const t = typeById(typeId);
    const patch = { typeId };
    if (t.aircraft === "none") { patch.aircraftId = ""; patch.fuelRequested = ""; }
    if (t.aircraft === "sim" && acById(b.aircraftId).class !== "sim")
      patch.aircraftId = fleet.find((a) => a.class === "sim" && a.status === "active")?.id || "";
    if (t.aircraft === "any" && (!b.aircraftId || acById(b.aircraftId).class === "sim")) {
      const wantMulti = stuById(b.studentId)?.course === "Multi";
      patch.aircraftId = fleet.find((a) => a.status === "active" && (wantMulti ? a.class === "multi" : a.class === "single"))?.id || "";
    }
    if (!t.partner) patch.partnerIds = [];
    if (!needsStudent(t)) { patch.studentId = ""; patch.partnerIds = []; patch.course = ""; }
    if (t.instructor === "none") { patch.instructorId = ""; patch.signOutInstructorId = ""; }
    patchBooking(b.id, patch);
  };

  /** Attach or detach the student on an existing booking. */
  const setBookingStudent = (b, studentId) => {
    if (!studentId) { patchBooking(b.id, { studentId: "", partnerIds: [], course: "" }); return; }
    const st = stuById(studentId);
    patchBooking(b.id, { studentId, course: st.course,
      lesson: Math.min(st.done.length, getSyl(st.course).lessons.length - 1),
      instructorId: b.instructorId || st.instructorId,
      signOutInstructorId: b.instructorId || st.instructorId });
  };

  const reassign = (bookingId, studentId) => {
    const st = stuById(studentId);
    setBookings((bs) => bs.map((b) => {
      if (b.id !== bookingId) return b;
      return syncEnd({ ...b, studentId, status: "scheduled",
        partnerIds: partnersOf(b).filter((id) => id !== studentId),
        course: st.course, lesson: Math.min(st.done.length, getSyl(st.course).lessons.length - 1) });
    }));
    say(`${st.name} now holds the slot`);
  };

  /** Put another student on a mutual flight. */
  const addPartner = (bookingId, studentId) => {
    const st = stuById(studentId);
    setBookings((bs) => bs.map((b) => {
      if (b.id !== bookingId || b.studentId === studentId || partnersOf(b).includes(studentId)) return b;
      return { ...b, partnerIds: [...partnersOf(b), studentId] };
    }));
    say(`${st.name} added to the flight`);
  };

  const createBooking = ({ date, start, block = 120, aircraftId = "", studentId = "", partnerIds = [], typeId = "t-dual",
    instructorId, fuelRequested, fuelNote = "", examiner = "", lesson, note = "", segments }) => {
    const st = studentId ? stuById(studentId) : null;
    const t = typeById(typeId);
    const ins = instructorId ?? (st ? st.instructorId : "");
    const standing = fuelFor(aircraftId);
    const nb = syncEnd({
      id: uid("b"), date, start, end: start, studentId, partnerIds, examiner,
      instructorId: ins, signOutInstructorId: ins, aircraftId,
      course: st ? st.course : "",
      lesson: st ? (lesson ?? Math.min(st.done.length, getSyl(st.course).lessons.length - 1)) : 0,
      typeId, status: "scheduled", label: "", note,
      fuelRequested: t.aircraft === "none" ? "" : (fuelRequested ?? ""),
      fuelNote: t.aircraft === "none" ? "" : fuelNote,
      cancelReason: "", cancelNote: "",
      checkOutAt: "", checkInAt: "", fuelOnBoard: "", oilQts: "", dest: "", eta: "",
      segments: segments && segments.length ? segments : defaultSegments(t, block),
    });
    setBookings((bs) => [...bs, nb]);
    setSel({ type: "booking", id: nb.id });
    return nb;
  };

  const createFromGap = (gap, studentId) => {
    createBooking({ date: gap.date, start: gap.start, block: Math.min(120, toMin(gap.end) - toMin(gap.start)),
      aircraftId: gap.aircraftId, studentId });
    say(`${stuById(studentId).name} booked on ${acById(gap.aircraftId).reg}`);
  };

  const toggleLesson = (studentId, idx) =>
    setStudents((ss) => ss.map((s) => s.id === studentId
      ? { ...s, done: s.done.includes(idx) ? s.done.filter((i) => i !== idx) : [...s.done, idx].sort((a, b) => a - b) } : s));

  const addStudent = ({ name, course, instructorId }) => {
    const st = { id: uid("s"), name: name.trim(), course, instructorId,
      done: [], availability: { 0: ["09:00","17:00"], 1: ["09:00","17:00"], 2: ["09:00","17:00"],
        3: ["09:00","17:00"], 4: ["09:00","17:00"] }, hours: 0, timeOff: [] };
    setStudents((ss) => [...ss, st]);
    setActiveStudent(st.id);
    say(`${st.name} added to the roster`);
    return st;
  };

  /** Remove a student. Their past flights stay on the books as history. */
  const removeStudent = (id) => {
    const st = stuById(id);
    const future = bookings.filter((b) => onBooking(b, id) &&
      b.date >= key(TODAY) && b.status === "scheduled").length;
    setBookings((bs) => bs.filter((b) => !(onBooking(b, id) &&
      b.date >= key(TODAY) && b.status === "scheduled")));
    setStudents((ss) => ss.filter((x) => x.id !== id));
    setActiveStudent((cur) => (cur === id ? (students.find((x) => x.id !== id)?.id || "") : cur));
    say(future ? `${st.name} removed — ${future} upcoming ${future === 1 ? "flight" : "flights"} cancelled`
      : `${st.name} removed`);
  };

  const saveStudent = (id, patch) =>
    setStudents((ss) => ss.map((x) => (x.id === id ? { ...x, ...patch } : x)));

  const setAvailability = (studentId, wd, val) =>
    setStudents((ss) => ss.map((s) => {
      if (s.id !== studentId) return s;
      const a = { ...s.availability };
      if (val === null) delete a[wd]; else a[wd] = val;
      return { ...s, availability: a };
    }));

  const addTimeOff = (studentId, entry) => {
    setStudents((ss) => ss.map((s) => (s.id === studentId ? { ...s, timeOff: [...s.timeOff, entry] } : s)));
    const hit = bookings.filter((b) => onBooking(b, studentId) &&
      b.status === "scheduled" && b.date >= entry.start && b.date <= entry.end);
    say(hit.length ? `Time off saved — ${hit.length} ${hit.length === 1 ? "flight" : "flights"} flagged for re-crewing` : "Time off saved");
  };
  const removeTimeOff = (studentId, id) =>
    setStudents((ss) => ss.map((s) => (s.id === studentId ? { ...s, timeOff: s.timeOff.filter((t) => t.id !== id) } : s)));

  /* --------------------------- admin edits --------------------------- */

  /** Change an airframe's state from wherever it's shown. */
  const setAircraftStatus = (id, status) => {
    setFleet((fs) => fs.map((a) => (a.id === id
      ? { ...a, status, ...(status === "active" ? { downFrom: "", downTo: "" } : {}) } : a)));
    say(`${acById(id).reg} — ${statusName(status).toLowerCase()}`);
  };

  const saveAircraft = (id, patch) => setFleet((f) => f.map((a) => (a.id === id ? { ...a, ...patch } : a)));
  const addAircraft = (a) => setFleet((f) => [...f, { ...a, id: uid("ac") }]);
  const removeAircraft = (id) => {
    const used = bookings.filter((b) => b.aircraftId === id).length;
    if (used) { saveAircraft(id, { status: "retired", downFrom: "", downTo: "" });
      say(`${acById(id).reg} has ${used} bookings on file — retired rather than deleted, so the history stands`); return; }
    setFleet((f) => f.filter((a) => a.id !== id));
    say("Aircraft removed");
  };

  const saveType = (id, patch) => setTypes((ts) => ts.map((t) => (t.id === id ? { ...t, ...patch } : t)));
  const addType = () => {
    setTypes((ts) => [...ts, { id: uid("t"), name: "New booking type", code: "NEW", color: tx(T.ink3), student: "required", instructor: "required",
      partner: false, aircraft: "any", mainKindId: kinds[0]?.id || "k-flight", briefMin: 15, debriefMin: 15, adminMin: 0 }]);
    say("Booking type added — rename it below");
  };
  const removeType = (id) => {
    const used = bookings.filter((b) => b.typeId === id).length;
    if (used) { say(`${typeById(id).name} is on ${used} bookings — rename it instead of deleting`); return; }
    setTypes((ts) => ts.filter((t) => t.id !== id));
  };

  const saveKind = (id, patch) => setKinds((ks) => ks.map((k) => (k.id === id ? { ...k, ...patch } : k)));
  const addKind = () => { setKinds((ks) => [...ks, { id: uid("k"), name: "New item", code: "NEW", color: tx(T.ink3), counts: "ground" }]); say("Booking item added"); };
  const removeKind = (id) => {
    const used = bookings.filter((b) => b.segments.some((s) => s.kindId === id)).length;
    if (used) { say(`That item is used in ${used} bookings — rename it instead of deleting`); return; }
    setKinds((ks) => ks.filter((k) => k.id !== id));
  };

  const renameLesson = (course, idx, name) =>
    setSyllabi((sy) => ({ ...sy, [course]: { ...sy[course], lessons: sy[course].lessons.map((l, i) => (i === idx ? name : l)) } }));
  const addLesson = (course, name) =>
    setSyllabi((sy) => ({ ...sy, [course]: { ...sy[course], lessons: [...sy[course].lessons, name || "New lesson"] } }));
  const removeLesson = (course, idx) => {
    setSyllabi((sy) => ({ ...sy, [course]: { ...sy[course], lessons: sy[course].lessons.filter((_, i) => i !== idx) } }));
    setStudents((ss) => ss.map((s) => (s.course !== course ? s
      : { ...s, done: s.done.filter((i) => i !== idx).map((i) => (i > idx ? i - 1 : i)) })));
    setBookings((bs) => bs.map((b) => (b.course !== course ? b
      : { ...b, lesson: b.lesson > idx ? b.lesson - 1 : Math.min(b.lesson, Math.max(0, idx - 1)) })));
    say("Lesson removed and student records re-indexed");
  };

  /* ---------------------------- ident line --------------------------- */

  const todayKey = key(TODAY);
  const outNow = bookings.filter((b) => OUT(b) && b.status !== "cancelled");
  const flyingCount = outNow.filter((b) => b.aircraftId && acById(b.aircraftId).class !== "sim").length;
  const todayBookings = bookings.filter((b) => b.date === todayKey && b.status !== "cancelled");
  const openHours = gapsForDay(boardDate).reduce((a, g) => a + (toMin(g.end) - toMin(g.start)) / 60, 0);
  const downCount = fleet.filter((a) => a.status !== "active").length;
  const selBooking = sel?.type === "booking" ? bookings.find((b) => b.id === sel.id) : null;

  const STAFF_NAV = [["board","Schedule"],["fuel","Fuel"],["instructors","Instructors"],
    ...(staffCfg.enabled ? [["tas", staffCfg.plural]] : []),
    ["students","Students"],["progress","Progress reports"],["cfi","CFI"],["setup","Setup"]];
  /* students see the schedule and nothing else */
  const NAV = canEdit ? STAFF_NAV : [["board","Schedule"]];

  return (
    <div style={{ background: T.paper, color: T.ink, fontFamily: FONT_BODY, minHeight: "100vh" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        /* figures line up in columns and don't jitter as they tick */
        body, button, input, select, textarea, table { font-variant-numeric: tabular-nums; }
        /* the mono face is wide; pull it back so dense labels keep their fit */
        code, kbd { font-family: ${FONT_MONO}; }
        input, select, textarea { font-family: ${FONT_MONO}; font-size: 12px; color: ${T.ink};
          background: ${T.panelAlt}; border: 1px solid ${T.line}; border-radius: 2px; padding: 4px 6px; }
        /* the browser draws its own arrow on the right — keep text clear of it */
        select { padding-right: 24px; text-overflow: ellipsis; }
        select[multiple] { padding-right: 6px; }
        input[type="date"], input[type="time"], input[type="number"] { color-scheme: ${DARK_MODE ? "dark" : "light"}; }
        ::placeholder { color: ${T.ink3}; opacity: 1; }
        input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid ${T.magenta}; outline-offset: 1px; }
        .strip { touch-action: none; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
      `}</style>

      <header style={{ borderBottom: `1px solid ${T.lineSoft}`, background: T.panel }}>
        <div className="flex items-center justify-between px-4 py-2 gap-4">
          <div className="flex items-baseline gap-3 min-w-0">
            <span style={{ fontFamily: FONT_MONO, fontSize: 13, fontWeight: 700, letterSpacing: "0.18em",
              border: `1px solid ${T.ink2}`, borderRadius: 2, padding: "2px 8px", color: T.ink }}>
              {site.ident}
            </span>
            <div style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 20, letterSpacing: "0.12em", textTransform: "uppercase" }}>
              Flight Progress Board
            </div>
            <div className="hidden md:block" style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.12em",
              textTransform: "uppercase", color: tx(T.ink3) }}>
              Training Unit Dispatch
            </div>
          </div>
          <div className="flex items-center gap-3">
            {flash && <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: tx(T.sage), border: `1px solid ${T.sage}`, padding: "2px 8px", borderRadius: 2 }}>{flash}</div>}
            <button onClick={() => setTheme(theme === "dark" ? "light" : "dark")}
              title={theme === "dark" ? "Day panel lighting" : "Night panel lighting"}
              style={{ fontFamily: FONT_UI, fontSize: 12, fontWeight: 600, padding: "4px 8px",
                border: `1px solid ${T.line}`, borderRadius: 2, color: T.ink2 }}>
              {theme === "dark" ? "Day" : "Night"}
            </button>
            <div className="flex" style={{ border: `1px solid ${T.line}`, borderRadius: 2 }}
              title="Preview of what each role can see and do">
              {[["staff","Staff"],["student","Student"]].map(([r, l]) => (
                <button key={r} onClick={() => { setRole(r); if (r !== "staff") { setView("board"); setSel(null); } }}

/* ============================== BOARD ================================= */

/* The board window is set per day: it opens half an hour before sunrise and
   runs through to 01:00 the following morning. Minutes past 1440 are the small
   hours of the next calendar date. BoardView sets these before its children
   render, the same way the fleet and syllabus mirrors work. */
const DAY_END = 25 * 60; /* 01:00 next day */
let OPEN_MIN = toMin("06:00"), CLOSE_MIN = DAY_END;
const PX_PER_MIN = 0.78;
let BOARD_H = (CLOSE_MIN - OPEN_MIN) * PX_PER_MIN;
const GUTTER = 62, DRAG_THRESHOLD = 4, TA_LANE_W = 128;

/** Clock label for a board minute, wrapping past midnight. */
const winLabel = (m) => toHHMM(((m % 1440) + 1440) % 1440);

/** Opening time for a day: 30 min before sunrise, falling back sensibly. */
const openFor = (dateKey, lat, lon) => {
  const sr = sunEvent(dateKey, lat, lon, 90.833, true);
  return sr == null ? toMin("06:00") : Math.max(0, Math.floor((sr - 30) / 15) * 15);
};

/** Apply a window and recompute the board height. Close may run past midnight,
    so a full 24 hours is 00:00 to 24:00 and the default day ends at 01:00. */
const setWindow = (open, close = DAY_END) => {
  OPEN_MIN = Math.max(0, Math.min(open, close - 60));
  CLOSE_MIN = Math.min(close, 48 * 60);
  BOARD_H = (CLOSE_MIN - OPEN_MIN) * PX_PER_MIN;
};

/* Presets for what the board shows. 'daylight' follows the sun each day. */
const WINDOW_PRESETS = [
  ["daylight", "Daylight", null],
  ["day", "07:00 – 19:00", [7 * 60, 19 * 60]],
  ["long", "06:00 – 22:00", [6 * 60, 22 * 60]],
  ["full", "24 hours", [0, 24 * 60]],
  ["custom", "Custom", null],
];

/** The hour scale, drawn like an instrument tape: long ticks on the hour,
    short ones every fifteen minutes, figures set against them. */
function TimeGutter({ suppress = [] }) {
  const parts = [];
  const clash = (m) => suppress.some((x) => x != null && Math.abs(x - m) * PX_PER_MIN < 13);

  for (let m = Math.ceil(OPEN_MIN / 15) * 15; m <= CLOSE_MIN; m += 15) {
    const hour = m % 60 === 0;
    parts.push(<div key={`t${m}`} className="absolute"
      style={{ right: 0, top: (m - OPEN_MIN) * PX_PER_MIN, width: hour ? 9 : 4,
        borderTop: `1px solid ${hour ? (m >= 1440 ? T.violet : T.line) : T.lineSoft}` }} />);
  }
  for (let m = Math.ceil(OPEN_MIN / 60) * 60; m <= CLOSE_MIN; m += 60) {
    if (clash(m)) continue;
    parts.push(<div key={`l${m}`} className="absolute"
      style={{ right: 12, top: (m - OPEN_MIN) * PX_PER_MIN - 7, fontFamily: FONT_MONO, fontSize: 10,
        fontWeight: 500, letterSpacing: "0.06em",
        color: m >= 1440 ? tx(T.violet) : tx(T.ink3) }}>{winLabel(m)}</div>);
  }
  return (
    <div className="relative shrink-0"
      style={{ width: GUTTER, height: BOARD_H, borderRight: `1px solid ${T.line}` }}>
      {parts}
    </div>
  );
}

function GridLines() {
  const rows = [];
  for (let m = Math.ceil(OPEN_MIN / 30) * 30; m <= CLOSE_MIN; m += 30) {
    const hour = m % 60 === 0;
    rows.push(<div key={m} className="absolute left-0 right-0"
      style={{ top: (m - OPEN_MIN) * PX_PER_MIN,
        borderTop: `1px ${hour ? "solid" : "dotted"} ${m === 1440 ? T.violet : hour ? T.line : T.lineSoft}` }} />);
  }
  return <>{rows}</>;
}

function SegmentLadder({ segments, height, c }) {
  const total = segTotal(segments) || 1;
  let y = 0;
  return (
    <div className="absolute" style={{ right: 0, top: 0, bottom: 0, width: 5, background: veil(T.panel, 0.7) }}>
      {segments.map((s) => {
        const k = kindById(s.kindId);
        const h = (s.minutes / total) * height;
        const top = y; y += h;
        return <div key={s.id} title={`${k.name} ${s.minutes} min`}
          style={{ position: "absolute", top, height: Math.max(h - 1, 1), left: 0, right: 0, background: k.color, opacity: 0.85 }} />;
      })}
    </div>
  );
}

function Strip({ b, student, partners = [], risk, selected, dragging, unit, standing, dayOffset = 0, canDrag = true, title, onOpen, onDragStart, onHover, onHoverEnd }) {
  const t = typeById(b.typeId);
  /* colour says what kind of flight it is — dual, solo, sim, test — not the programme */
  const c = t.color;
  const height = Math.max(dur(b) * PX_PER_MIN - 2, 22);
  const cancelled = b.status === "cancelled";
  const out = OUT(b), back = BACK(b);
  const overdue = out && !!b.eta && toMin(b.eta) < toMin(nowHHMM());
  const covering = student && b.instructorId && b.instructorId !== student.instructorId;
  const showBar = height >= 40;
  /* space actually free for text, once the status bar and padding are taken out */
  const contentH = height - (showBar ? 15 : 0) - 6;
  const showNote = !!b.note && contentH >= 42;
  const showPartner = partners.length > 0 && contentH >= 28 + (showNote ? 14 : 0) + 14;
  const showFoot = contentH >= 28 + (showNote ? 14 : 0) + (showPartner ? 14 : 0) + 14;

  /* Fill tells you the state at a glance:
     airborne = bright green wash, complete = darker shade of the same colour. */
  const dark = darken(c, 0.55);
  const fill = cancelled
    ? `repeating-linear-gradient(45deg, ${tint(T.ink3, 0.14)} 0 5px, ${tint(T.ink3, 0.06)} 5px 10px)`
    : out
    ? `linear-gradient(180deg, ${tint(T.sage, 0.5)} 0%, ${tint(T.sage, 0.34)} 100%)`
    : back
    ? `linear-gradient(180deg, ${tint(dark, 0.52)} 0%, ${tint(dark, 0.4)} 100%)`
    : `linear-gradient(180deg, ${tint(c, 0.26)} 0%, ${tint(c, 0.15)} 100%)`;

  return (
    <div className="strip absolute" style={{
      top: (toMin(b.start) + dayOffset - OPEN_MIN) * PX_PER_MIN + 1, height, left: 2, right: 2,
      background: fill,
      border: `1px solid ${selected ? T.ink : out ? T.sage : back ? tint(dark, 0.7) : tint(c, 0.55)}`,
      borderLeft: `5px solid ${cancelled ? T.ink3 : out ? T.sage : back ? dark : c}`,
      borderRadius: 2,
      boxShadow: dragging ? (DARK_MODE ? "0 6px 16px rgba(0,0,0,0.55)" : "0 6px 16px rgba(23,36,43,0.28)")
        : selected ? `0 0 0 2px ${T.ink}`
        : out ? `0 0 0 2px ${T.sage}` : "none",
      opacity: cancelled ? 0.6 : dragging ? 0.92 : 1, overflow: "hidden",
      cursor: canDrag ? "grab" : "default", zIndex: dragging ? 30 : 1,
      boxShadow: selected ? `inset 0 0 0 1px ${T.ink}` : "none" }}
      onPointerDown={(e) => onDragStart(e, b, "move")} onClick={(e) => { e.stopPropagation(); onOpen(b); }}
      onMouseEnter={(e) => onHover && onHover(e, b)}
      onMouseMove={(e) => onHover && onHover(e, b)}
      onMouseLeave={() => onHoverEnd && onHoverEnd()}>

      <div style={{ padding: "3px 8px 3px 5px", paddingBottom: showBar ? 18 : 3, overflow: "hidden" }}>
        <div className="flex items-baseline justify-between gap-1">
          <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: T.ink2 }}>{b.start}</span>
          <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: tx(t.color), letterSpacing: "0.06em" }}>{t.code}</span>
        </div>
        <div title={title || bookingLabel(b, student, partners)}
          style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 13, lineHeight: "15px",
            textDecoration: cancelled ? "line-through" : "none",
            whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
          {title || bookingLabel(b, student, partners)}
        </div>
        {showNote && (
          <div title={b.note} style={{ fontFamily: FONT_BODY, fontSize: 11, lineHeight: "14px", color: T.ink2,
            fontStyle: "italic", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
            {b.note}
          </div>
        )}
        {title && student && (
          <div title={student.name}
            style={{ fontFamily: FONT_UI, fontSize: 12, lineHeight: "14px", color: T.ink2,
              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
            {student.name}
          </div>
        )}
        {showPartner && !title && (
          <div title={partners.map((p) => p.name).join(", ")}
            style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 13, lineHeight: "15px", color: T.ink,
              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
            {partners.length > 1 ? `+ ${partners.length} more` : partners[0].name}
          </div>
        )}
        {showFoot && (
          <div className="flex items-center justify-between gap-1" style={{ marginTop: 1 }}>
            <span style={{ fontFamily: FONT_MONO, fontSize: 10, fontWeight: 600, color: "#FFFFFF",
              background: solidBg(out ? T.sage : back ? dark : c), padding: "0 4px", borderRadius: 2 }}>
              {b.course ? lessonCode(b.course, b.lesson) : t.code}
            </span>
            <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: covering ? tx(T.violet) : tx(T.ink3) }}>
              {insShort(b.instructorId)}{covering ? " COV" : ""}
            </span>
          </div>
        )}
      </div>

      <SegmentLadder segments={b.segments} height={height} c={c} />

      {showBar && (
        <div className="absolute flex items-center justify-between gap-1" style={{
          left: 0, right: 5, bottom: 0, height: 15, padding: "0 4px",
          borderTop: `1px solid ${tint(out ? T.sage : back ? dark : c, 0.35)}`, background: veil(T.panel, 0.93) }}>
          {/* a fuel restriction is the thing you must not miss — solid red, white figures */}
          {b.aircraftId && b.fuelRequested !== "" ? (
            <span title={`Fuel restriction — ${b.fuelRequested} ${shortUnit(unit)}${b.fuelNote ? ` · ${b.fuelNote}` : ""}`}
              style={{ display: "inline-flex", alignItems: "center", gap: 3, whiteSpace: "nowrap",
                background: solidBg(T.red), color: "#FFFFFF", borderRadius: 2, padding: "1px 5px",
                fontFamily: FONT_MONO, fontSize: 11, fontWeight: 700, letterSpacing: "0.02em" }}>
              {b.fuelRequested} {shortUnit(unit)} MAX
              {standing !== "" && standing != null && Number(b.fuelRequested) > Number(standing) && (
                <span title={`Over the general restriction of ${standing} ${shortUnit(unit)}`}
                  style={{ fontSize: 10, fontWeight: 700 }}>OVER</span>
              )}
            </span>
          ) : <span />}
          <span className="flex items-center gap-1" style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em", whiteSpace: "nowrap" }}>
            {b.note && height <= 50 && <span title={b.note} style={{ color: tx(T.ink3) }}>NOTE</span>}
            {risk && <span title="This booking has a problem — open it for detail"
              style={{ background: solidBg(T.amber), color: "#FFFFFF", padding: "0 3px" }}>{risk}</span>}
            {out && b.dest && <span style={{ color: T.ink2, letterSpacing: "0.12em" }}>{b.dest}</span>}
            {out && b.eta && (
              <span title={`ETA ${b.eta}`} style={{ color: overdue ? tx(T.red) : T.ink2 }}>
                {overdue ? "OVERDUE" : `ETA ${b.eta}`}
              </span>
            )}
            {out && <span style={{ background: solidBg(overdue ? T.red : T.sage), color: "#FFFFFF", padding: "0 3px" }}>AIRBORNE {b.checkOutAt}</span>}
            {back && <span style={{ background: solidBg(dark), color: "#FFFFFF", padding: "0 3px" }}>COMPLETE {b.checkInAt}</span>}
          </span>
        </div>
      )}

      <div onPointerDown={(e) => onDragStart(e, b, "resize")} className="absolute"
        style={{ left: 0, right: 5, bottom: showBar ? 15 : 0, height: 8, cursor: "ns-resize" }} title="Drag to change the block length" />
    </div>
  );
}

/** The few things worth capturing as an aircraft goes out the door. */
function CheckOutPanel({ booking, setSel, stuById, fuelUnit, fuelFor, patchBooking, checkOut, say }) {
  const b = booking;
  const ac = b.aircraftId ? acById(b.aircraftId) : null;
  const cap = ac ? ac.fuelCap : 0;
  const restriction = ac ? fuelFor(ac.id).amount : "";
  const st = b.studentId ? stuById(b.studentId) : null;

  const [fuel, setFuel] = useState(b.fuelOnBoard !== "" ? b.fuelOnBoard : (b.fuelRequested !== "" ? b.fuelRequested : ""));
  const [oil, setOil] = useState(b.oilQts);
  const [dest, setDest] = useState(b.dest || "");
  const [eta, setEta] = useState(b.eta || toHHMM(toMin(b.end)));

  const destOk = dest === "" || dest.length === 4;
  const go = () => {
    patchBooking(b.id, { fuelOnBoard: fuel, oilQts: oil, dest, eta });
    checkOut(b);
    setSel(null);
  };

  return (
    <div className="fixed inset-0 z-40 flex justify-end"
      style={{ background: DARK_MODE ? "rgba(0,0,0,0.6)" : "rgba(23,36,43,0.35)" }} onClick={() => setSel(null)}>
      <div className="w-full sm:max-w-sm h-full overflow-y-auto"
        style={{ background: T.panel, borderLeft: `1px solid ${T.line}` }} onClick={(e) => e.stopPropagation()}>

        <div className="sticky top-0 flex items-start justify-between gap-3 px-4 py-3 z-10"
          style={{ background: DARK_MODE ? T.panelAlt : T.ink, color: DARK_MODE ? T.ink : T.paper,
            borderBottom: DARK_MODE ? `1px solid ${T.line}` : "none" }}>
          <div>
            <Label style={{ color: DARK_MODE ? T.ink3 : "rgba(233,234,226,0.6)" }}>Check out</Label>
            <div style={{ fontFamily: FONT_UI, fontSize: 20, fontWeight: 600 }}>
              {ac ? ac.reg : "Ground"} · {st ? st.name : typeById(b.typeId).name}
            </div>
            <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: DARK_MODE ? T.ink2 : "rgba(233,234,226,0.75)" }}>
              {b.start}–{b.end} · {typeById(b.typeId).code}
            </div>
          </div>
          <button onClick={() => setSel(null)} style={{ color: DARK_MODE ? T.ink : T.paper, fontFamily: FONT_MONO, fontSize: 20 }}>✕</button>
        </div>

        <div className="p-4 space-y-4">
          <div className="grid grid-cols-2 gap-3">
            <div>
              <Label>Fuel on board</Label>
              <div className="flex items-center gap-2 mt-1">
                <input type="number" min={0} max={cap || undefined} step="1" value={fuel} placeholder="—"
                  disabled={!ac} onChange={(e) => setFuel(clampFuel(e.target.value, cap))}
                  style={{ width: 84, fontSize: 20, fontWeight: 600, textAlign: "right", padding: "4px 8px" }} />
                <span style={{ fontFamily: FONT_MONO, fontSize: 13, color: tx(T.amber) }}>{shortUnit(fuelUnit)}</span>
                {ac && <Btn small onClick={() => setFuel(cap)}>Full</Btn>}
              </div>
              {restriction !== "" && (
                <div style={{ fontFamily: FONT_MONO, fontSize: 10, marginTop: 3,
                  color: fuel !== "" && Number(fuel) > Number(restriction) ? tx(T.red) : tx(T.ink3) }}>
                  RESTRICTION {restriction} {shortUnit(fuelUnit)} MAX
                </div>
              )}
            </div>
            <div>
              <Label>Oil added</Label>
              <div className="flex items-center gap-2 mt-1">

                  onChange={(e) => setOil(clampOil(e.target.value))}

              </div>

              <Label>Arrival aerodrome</Label>

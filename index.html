<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shift Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Firebase (Firestore) — shared cloud storage so everyone's availability persists across visits/devices -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    color-scheme: dark;
    --bg:#0A1211;
    --panel:#111C1B;
    --panel-2:#182726;
    --border:#274240;
    --text:#E6F2F0;
    --text-dim:#8AA6A2;
    --amber:#16A79C;
    --cyan:#3FC7B8;
    --overlap:#3FC7B8;
    --danger:#EF5350;
    --success:#2FBF7E;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    padding:0 0 60px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:1080px;margin:0 auto;padding:14px 20px 0;}

  /* header */
  header{
    display:flex;justify-content:space-between;align-items:center;
    background:#0C3D39;border-radius:12px;
    padding:20px 24px;margin:0 0 26px;
    flex-wrap:wrap;gap:16px;
  }
  .brand{display:flex;flex-direction:column;gap:4px;}
  .brand .eyebrow{
    font-family:'Space Grotesk',sans-serif;
    font-size:11px;letter-spacing:.18em;color:#7FD9CE;
    text-transform:uppercase;font-weight:600;
  }
  .brand h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;margin:0;font-weight:700;letter-spacing:-0.01em;color:#FFFFFF;
  }
  .clocks{display:flex;gap:22px;}
  .clock{text-align:right;}
  .clock .label{font-size:10px;letter-spacing:.14em;color:#9CCFC9;text-transform:uppercase;}
  .clock .time{font-size:20px;font-weight:600;color:#FFFFFF;}
  .clock.pt .time{color:#7FD9CE;}
  .clock.utc .time{color:#FFFFFF;}

  /* panel */
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:12px;
  }
  .panel h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;margin:0 0 2px;font-weight:600;
    display:flex;align-items:center;gap:6px;
  }
  .panel h2 .idx{color:var(--text-dim);font-weight:500;}
  .panel .desc{color:var(--text-dim);font-size:11.5px;margin:0 0 10px;line-height:1.4;}

  /* timeline */
  .axis{position:relative;height:22px;margin-left:118px;margin-bottom:6px;}
  .tick{position:absolute;top:0;font-size:10px;color:var(--text-dim);transform:translateX(-50%);text-align:center;}
  .tick .pt{color:var(--text);font-weight:600;}
  .tick .utc{color:var(--cyan);}
  .tick::before{content:'';position:absolute;left:50%;top:18px;width:1px;height:6px;background:var(--border);}

  .track-area{position:relative;margin-left:118px;height:2px;background:var(--border);margin-bottom:14px;}

  .rows{display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:0;}
  .row .rlabel{
    width:118px;flex:0 0 118px;font-size:12px;color:var(--text-dim);
    padding-right:12px;
  }
  .row .rlabel b{display:block;color:var(--text);font-size:13px;}
  .track{position:relative;flex:1;height:34px;background:var(--panel-2);border-radius:6px;overflow:visible;}
  .bar{
    position:absolute;top:0;bottom:0;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;
    color:#FFFFFF;
  }
  .bar.bar-open{
    opacity:.5;font-style:italic;color:var(--text)!important;
    background:var(--panel-2)!important;border:1px dashed var(--text-dim);
  }
  .bar-extend-btn{
    background:var(--overlap);color:#FFFFFF;border:none;border-radius:4px;
    padding:2px 6px;font-size:9.5px;font-weight:600;font-style:normal;
    cursor:pointer;margin-left:4px;font-family:'Inter',sans-serif;white-space:nowrap;
  }
  .bar-extend-btn:hover{opacity:.85;}
  .bar-handle{
    position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:3;
    transition:background .1s;
  }
  .bar-handle-left{left:-3px;border-radius:6px 0 0 6px;}
  .bar-handle-right{right:-3px;border-radius:0 6px 6px 0;}
  .bar-handle:hover,.bar-handle.dragging{background:rgba(255,255,255,.45);}
  .shift4-toggle-row{
    display:inline-flex;align-items:center;gap:7px;font-size:11.5px;
    color:var(--text-dim);text-transform:none;letter-spacing:normal;
    margin:0 0 12px;cursor:pointer;
  }
  .shift4-toggle-row input{width:15px;height:15px;accent-color:var(--overlap);}
  .row-available{
    display:none;
    font-size:11px;color:var(--text-dim);margin-left:118px;line-height:1.5;
    margin-bottom:10px;padding:8px 10px;
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
  }
  .row-available.avail-open{display:block;}
  .row{cursor:pointer;}
  .row-available .ra-label{
    font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:9.5px;
    color:var(--overlap);margin-right:6px;
  }
  .avail-chip{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);
    border-radius:12px;padding:3px 9px;margin:0 4px 4px 0;font-size:10.5px;
    cursor:pointer;font-family:'Inter',sans-serif;transition:all .12s;
  }
  .avail-chip:hover{border-color:var(--overlap);color:var(--text);}
  .avail-chip.avail-on{
    background:rgba(22,167,156,.22);border-color:var(--amber);color:var(--text);font-weight:600;
  }
  .avail-chip-plain{
    display:inline-block;padding:3px 7px;margin:0 3px 3px 0;font-size:10.5px;
  }
  .avail-chip-plain.avail-on{color:var(--text);font-weight:600;}
  .overlap-band{
    background-color:rgba(63,199,184,.20);
    border-left:1px dashed var(--overlap);
    border-right:1px dashed var(--overlap);
    z-index:2;
  }
  .overlap-tag{
    position:absolute;top:-22px;transform:translateX(-50%);
    font-size:9.5px;letter-spacing:.06em;color:var(--overlap);
    text-transform:uppercase;white-space:nowrap;font-weight:600;
  }

  .legend{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap;}
  .legend .item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-dim);}
  .legend .swatch{width:10px;height:10px;border-radius:3px;}

  /* form */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:760px){.grid2{grid-template-columns:1fr;}}
  label{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;margin-top:9px;}
  .quick-link{color:var(--overlap);text-decoration:none;font-weight:600;letter-spacing:.03em;cursor:pointer;}
  .quick-link:hover{text-decoration:underline;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=date],input[type=number]{
    width:100%;background:var(--panel-2);border:1px solid var(--border);
    color:var(--text);padding:6px 9px;border-radius:6px;font-size:13px;
    font-family:'Inter',sans-serif;
  }
  input:focus{outline:none;border-color:var(--amber);}
  select{
    width:100%;background:var(--panel-2);border:1px solid var(--border);
    color:var(--text);padding:7px 9px;border-radius:6px;font-size:13px;
    font-family:'Inter',sans-serif;
  }
  select:focus{outline:none;border-color:var(--amber);}
  select option{background:var(--panel-2);color:var(--text);}
  .shift-check{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--panel-2);border:1px solid var(--border);
    border-radius:6px;padding:10px 12px;margin-bottom:8px;cursor:pointer;
    transition:border-color .15s;
  }
  .shift-check:hover{border-color:#3A5F5B;}
  .shift-check.checked{border-color:var(--amber);}
  .shift-check .sname{font-size:13px;}
  .shift-check .stime{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);}
  .shift-check input{width:16px;height:16px;accent-color:var(--amber);}

  button{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;
    letter-spacing:.03em;border:none;border-radius:6px;padding:8px 14px;
    cursor:pointer;transition:opacity .15s;
  }
  button:hover{opacity:.88;}
  .btn-primary{background:var(--amber);color:#FFFFFF;margin-top:10px;width:100%;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:6px 10px;font-size:11px;}

  /* roster */
  .roster-shift{margin-bottom:10px;}
  .roster-shift:last-child{margin-bottom:0;}
  .roster-shift .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .roster-shift .rh .name{font-size:12.5px;font-weight:600;}
  .roster-shift .rh .count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);}
  .person-chip{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--panel-2);border:1px solid var(--border);
    border-radius:20px;padding:5px 6px 5px 12px;margin:0 6px 6px 0;font-size:12.5px;
  }
  .person-chip.person-chip-select{cursor:pointer;transition:all .12s;}
  .person-chip.person-chip-select:hover{border-color:var(--overlap);color:var(--text);}
  .person-chip.person-chip-select.active{
    background:rgba(22,167,156,.20);border-color:var(--amber);color:var(--text);font-weight:600;
  }
  .person-chip .del{
    background:var(--panel);border:none;color:var(--text-dim);
    width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:11px;
    display:flex;align-items:center;justify-content:center;
  }
  .person-chip .del:hover{color:var(--overlap);}
  .empty{color:var(--text-dim);font-size:12.5px;font-style:italic;}

  .status{font-size:12px;color:var(--success);margin-top:10px;min-height:16px;}
  .note{font-size:11.5px;color:var(--text-dim);margin-top:14px;line-height:1.5;}

  /* day strip */
  .daystrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
  .daystrip::-webkit-scrollbar{height:6px;}
  .daystrip::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .daychip{
    flex:0 0 56px;background:var(--panel-2);border:1px solid var(--border);
    border-radius:8px;padding:9px 4px;text-align:center;cursor:pointer;
    transition:border-color .15s,background .15s;
  }
  .daychip:hover{border-color:#3A5F5B;}
  .daychip.active{border-color:var(--amber);background:rgba(22,167,156,.18);}
  .daychip.today .dnum{color:var(--amber);}
  .daychip .dow{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);}
  .daychip .dnum{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;margin:3px 0;}
  .daychip .dcount{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--overlap);}
  .daychip .dcount.zero{color:var(--text-dim);opacity:.5;}
  .selected-date-label{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--amber);}

  .sunrise-note{font-size:11.5px;color:var(--cyan);margin-top:14px;}

  .shift-select-group{display:flex;flex-direction:column;gap:8px;}
  .shift-btn{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--panel-2);border:1px solid var(--border);
    border-radius:6px;padding:10px 12px;cursor:pointer;
    transition:border-color .15s;
  }
  .shift-btn:hover{border-color:#3A5F5B;}
  .shift-btn.active{border-color:var(--amber);background:rgba(22,167,156,.16);}
  .shift-btn .sname{font-size:13px;}
  .shift-btn .stime{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);}

  .dow-group{display:flex;gap:6px;flex-wrap:wrap;}
  .dow-btn{
    flex:1 1 0;min-width:40px;padding:9px 0;text-align:center;
    background:var(--panel-2);border:1px solid var(--border);border-radius:6px;
    cursor:pointer;font-size:11.5px;color:var(--text-dim);
    transition:border-color .15s,color .15s,background .15s;
  }
  .dow-btn:hover{border-color:#3A5F5B;}
  .dow-btn.active{border-color:var(--cyan);background:rgba(63,199,184,.18);color:var(--text);}

  .template-shift{margin-bottom:18px;}
  .template-shift:last-child{margin-bottom:0;}
  .template-shift .th{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .template-shift .th .name{font-size:12.5px;font-weight:600;}
  .check-mark{color:var(--success);font-weight:700;}
  .template-chip{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel-2);border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;
  }
  .template-chip .tname{font-weight:500;}
  .template-chip .tdays{color:var(--cyan);font-family:'JetBrains Mono',monospace;font-size:10.5px;}
  .template-chip .del{
    background:var(--panel);border:none;color:var(--text-dim);
    width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:11px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
  }
  .template-chip .del:hover{color:var(--overlap);}

  .stat-banner{border-color:var(--amber);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .stat-banner h2{font-size:12px;margin:0;}
  .buffer-control{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .buffer-control label{
    margin:0;font-size:10px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--text-dim);white-space:nowrap;
  }
  .buffer-control #bufferValue{
    font-family:'JetBrains Mono',monospace;color:var(--amber);font-weight:700;
    font-size:11.5px;
  }
  .buffer-control input[type=range]{
    width:120px;accent-color:var(--amber);cursor:pointer;
  }
  .stat-grid{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .stat{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;min-width:0;display:flex;align-items:baseline;gap:6px;}
  .stat-num{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--amber);line-height:1;}
  .stat-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;}

  .gap-banner{
    border-color:var(--danger);background:rgba(239,83,80,.10);
    padding:12px 16px;margin-top:12px;
  }
  .gap-banner-head{margin-bottom:8px;}
  .gap-banner-title{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--danger);
  }
  .gap-row{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--danger);
    border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:12px;
  }
  .gap-row:last-child{margin-bottom:0;}
  .gap-main{display:flex;align-items:baseline;gap:8px;}
  .gap-day{font-family:'Space Grotesk',sans-serif;font-weight:700;}
  .gap-shift{color:var(--text-dim);font-size:11.5px;}
  .gap-detail{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--danger);font-weight:600;white-space:nowrap;}
  .gap-more{font-size:11px;color:var(--text-dim);margin-top:4px;}

  .slotsrow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .slotitem{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-width:110px;}
  .slotitem label{margin:0 0 6px;font-size:10px;}
  .slotitem input{width:56px;padding:6px 8px;font-size:13px;}

  .schedule-scroll{max-height:440px;overflow-y:auto;margin-top:6px;border:1px solid var(--border);border-radius:8px;}
  .schedule-table{width:100%;border-collapse:collapse;font-size:12px;}
  .schedule-table th{
    position:sticky;top:0;background:var(--panel-2);text-align:left;color:var(--text-dim);
    font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;
    border-bottom:1px solid var(--border);
  }
  .schedule-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  .schedule-table td.datecell{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);white-space:nowrap;}
  .schedule-table td.unfilled{color:var(--text-dim);font-style:italic;}
  .schedule-table tr.today td{background:rgba(22,167,156,.10);}

  .drag-roster{
    display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px;
    padding:10px;background:var(--panel-2);border:1px dashed var(--border);border-radius:8px;
  }
  .drag-roster:empty{display:none;}
  .drag-chip{
    background:var(--panel);border:1px solid var(--border);border-radius:20px;
    padding:5px 12px;font-size:12px;cursor:grab;user-select:none;
  }
  .drag-chip:active{cursor:grabbing;}

  .hours-summary{margin-top:18px;}
  .hours-summary:empty{display:none;}
  .hours-summary-title{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12.5px;
    margin-bottom:4px;
  }
  .hours-summary-sub{font-size:11px;color:var(--text-dim);margin-bottom:10px;}
  .hours-row{
    display:flex;align-items:center;gap:10px;
    padding:6px 4px;border-bottom:1px solid var(--border);font-size:12px;
  }
  .hours-row:last-child{border-bottom:none;}
  .hours-name{min-width:120px;flex:0 0 auto;font-weight:500;}
  .hours-bar-track{
    flex:1 1 auto;height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;min-width:40px;
  }
  .hours-bar-fill{height:100%;background:var(--amber);border-radius:4px;}
  .hours-bar-fill.hours-low{background:var(--text-dim);}
  .hours-bar-fill.hours-high{background:var(--overlap);}
  .hours-val{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;
    min-width:74px;text-align:right;flex:0 0 auto;
  }
  .hours-shifts{
    font-size:10.5px;color:var(--text-dim);min-width:56px;text-align:right;flex:0 0 auto;
  }
  .schedule-table td.schedule-cell{transition:background .1s;}
  .schedule-table td.schedule-cell.drag-over{background:rgba(63,199,184,.18);outline:2px dashed var(--overlap);outline-offset:-2px;}
  .schedule-chip{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--panel-2);border:1px solid var(--border);border-radius:14px;
    padding:3px 4px 3px 10px;margin:2px 4px 2px 0;font-size:12px;cursor:grab;
  }
  .schedule-chip:active{cursor:grabbing;}
  .schedule-chip .chip-x{
    background:var(--panel);border:none;color:var(--text-dim);
    width:16px;height:16px;border-radius:50%;cursor:pointer;font-size:10px;
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .schedule-chip .chip-x:hover{color:var(--danger);}
  .schedule-chip .chip-clock{
    background:none;border:none;color:var(--text-dim);cursor:pointer;
    font-size:10px;padding:0 2px;flex:0 0 auto;line-height:1;
  }
  .schedule-chip .chip-clock:hover{color:var(--overlap);}
  .schedule-chip-wrap{display:inline-flex;flex-direction:column;vertical-align:top;}
  .chip-custom-time{
    font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--overlap);
    font-weight:600;
  }
  .chip-time-editor{
    background:var(--panel-2);border:1px solid var(--overlap);border-radius:8px;
    padding:8px;margin:4px 0 6px;
  }
  .chip-time-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .chip-time-row input{
    width:58px;padding:5px 7px;font-size:11.5px;font-family:'JetBrains Mono',monospace;
    background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:5px;
  }
  .chip-time-row span{color:var(--text-dim);font-size:11px;}
  .chip-time-save,.chip-time-clear{
    padding:5px 9px;font-size:10.5px;border-radius:5px;border:none;cursor:pointer;
    font-family:'Inter',sans-serif;font-weight:600;
  }
  .chip-time-save{background:var(--amber);color:#FFFFFF;}
  .chip-time-clear{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);}
  .chip-time-status{font-size:10.5px;color:var(--danger);margin-top:5px;min-height:13px;}
  .unfilled-label{color:var(--text-dim);font-style:italic;}

  #weeklyShiftList{max-height:420px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:2px 10px;}
  .weekly-shift-row{
    display:flex;align-items:center;gap:10px;

<script>
// ============================================================
// FIREBASE SETUP — replace this with YOUR OWN project's config.
// Firebase console → Project settings → General → "Your apps" → SDK setup and
// configuration → pick "Config". Paste the object it gives you here.
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyB-IhM1Uw-prmF6BVFn_6FmyTHfmIRUJOQ",
  authDomain: "shift-scheduler-3f812.firebaseapp.com",
  projectId: "shift-scheduler-3f812",
  storageBucket: "shift-scheduler-3f812.firebasestorage.app",
  messagingSenderId: "775953843243",
  appId: "1:775953843243:web:62a8937065bef4a40bd66e"
};

let db = null;
let firebaseReady = false;
try{
  // fails on purpose while firebaseConfig above still has placeholder values —
  // caught here so the rest of the app stays usable (falls back to this browser's
  // localStorage) instead of the whole page silently breaking.
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebaseReady = true;
}catch(e){
  console.warn('Firebase not configured yet (or failed to connect) — using this browser\'s local storage instead. Replace firebaseConfig with your real project settings to share data across everyone.', e);
}

const FS_COLLECTION = 'shiftboard'; // all data lives as one doc per key in this collection

// Thin shim matching the storage.get/set/delete calls used throughout this file.
//
// Every write goes to localStorage as well as Firestore, and reads fall back to
// localStorage whenever Firestore doesn't return a document — not just when it
// throws. That matters: if Firestore is reachable for reads but writes are being
// rejected (expired security rules are the usual cause), the old code saved to
// localStorage but then read straight past it, so everything looked lost on reload.
function localGet(key){
  try{
    const raw = localStorage.getItem(FS_COLLECTION+':'+key);
    return raw ? JSON.parse(raw).value : null;
  }catch(e){ return null; }
}
function localSet(key, value){
  try{ localStorage.setItem(FS_COLLECTION+':'+key, JSON.stringify({ value })); }
  catch(e){ console.warn('Local save failed (storage full or blocked):', e); }
}

let storageWarned = false;
function warnStorage(msg){
  if(storageWarned) return;
  storageWarned = true;
  const el = document.getElementById('storageWarning');
  if(el){ el.textContent = msg; el.style.display = 'block'; }
}

const storage = {
  async get(key){
    if(firebaseReady){
      try{
        const snap = await db.collection(FS_COLLECTION).doc(key).get();
        if(snap.exists) return { key, value: snap.data().value };
        // no cloud copy — fall through to whatever this browser has
      }catch(e){
        console.warn('Firestore get failed, using local copy:', e);
        warnStorage('Cloud sync unavailable — your data is being saved in this browser only.');
      }
    }
    const v = localGet(key);
    return v !== null ? { key, value: v } : null;
  },
  async set(key, value){
    localSet(key, value); // always keep a local copy, even when the cloud write works
    if(firebaseReady){
      try{
        await db.collection(FS_COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
      }catch(e){
        console.warn('Firestore set failed — saved locally instead:', e);
        warnStorage('Cloud sync unavailable — your data is being saved in this browser only.');
      }
    }
    return { key, value };
  },
  async delete(key){
    try{ localStorage.removeItem(FS_COLLECTION+':'+key); }catch(e){}
    if(firebaseReady){
      try{
        await db.collection(FS_COLLECTION).doc(key).delete();
      }catch(e){ console.warn('Firestore delete failed:', e); }
    }
    return { key, deleted: true };
  }
};

const DEFAULT_SHIFTS = [
  {id:'s1', name:'Shift 1', start:6.0,  end:11.5, color:'#12857C'},
  {id:'s2', name:'Shift 2', start:10.5, end:15.5, color:'#1FB3A5'},
  {id:'s3', name:'Shift 3', start:14.5, end:19.0, color:'#4FD1C0'},
  {id:'s4', name:'Shift 4', start:19.0, end:24.0, color:'#4A6B70'},
];
let BASE_SHIFTS = DEFAULT_SHIFTS.map(s=>({...s}));
let shift4Enabled = true;
let shift1AutoStart = true; // true = follow sunrise automatically; false = manually dragged, fixed start

// per-date exceptions to the period-wide Shift 4 setting — lets you run (or drop)
// Shift 4 on individual days without changing the whole month. dateStr -> true/false.
let shift4DayOverrides = {};
function isShift4OnDate(dateStr){
  if(Object.prototype.hasOwnProperty.call(shift4DayOverrides, dateStr)) return shift4DayOverrides[dateStr];
  return shift4Enabled;
}
// the shifts in use on a specific date, honoring any per-day Shift 4 override
function shiftsForDate(dateStr){
  const on = isShift4OnDate(dateStr);
  return BASE_SHIFTS.filter(s => s.id!=='s4' || on);
}
// the shifts actually in use right now — everything downstream (timeline, pickers,
// schedule generation) should read from this, not BASE_SHIFTS directly, so turning
// Shift 4 off (or editing shift lengths) takes effect everywhere at once
function activeShifts(){
  return BASE_SHIFTS.filter(s => s.id!=='s4' || shift4Enabled);
}
// overlap windows are derived from whatever the shift times currently are, rather than
// fixed clock times, so editing shift lengths (or dropping Shift 4) keeps them correct
function computeOverlaps(shifts){
  const overlaps = [];
  for(let i=0;i<shifts.length-1;i++){
    const a = shifts[i], b = shifts[i+1];
    if(a.end > b.start) overlaps.push({start:b.start, end:a.end, affects:[a.id,b.id]});
  }
  return overlaps;
}
let staffingBufferPct = 30; // % on top of the bare minimum headcount, set by the slider
let currentSchedule = null; // dateStr -> {shiftId: [names]}, once generated/loaded

// editing is always enabled — this board is single-user, so there's no passcode gate.
// isAdmin is kept as a flag since the edit controls throughout still check it.
let isAdmin = true;
// window is 24h wide but offset from midnight so shifts have room to drift earlier/later with sunrise
const AXIS_START = 3, AXIS_END = 27;
function pct(h){ return (h-AXIS_START)/(AXIS_END-AXIS_START)*100; }

// ---- drag-to-resize shift bars on the timeline ----
let barDragState = null;
// which shift's assign panel is open on the timeline — kept outside renderTimeline so
// it survives the re-render that follows each assignment
let openAssignShiftId = null;
function hourFromClientX(clientX, trackEl){
  const rect = trackEl.getBoundingClientRect();
  let frac = (clientX - rect.left) / rect.width;
  frac = Math.max(0, Math.min(1, frac));
  const hour = AXIS_START + frac*(AXIS_END-AXIS_START);
  return Math.round(hour*2)/2; // snap to nearest 30 minutes
}
function startBarDrag(e, shiftId, edge, trackEl){
  e.preventDefault();
  e.stopPropagation();
  barDragState = {shiftId, edge, trackEl};
  if(shiftId===BASE_SHIFTS[0].id && edge==='start') shift1AutoStart = false;
  e.currentTarget.classList.add('dragging');
  document.addEventListener('mousemove', onBarDragMove);
  document.addEventListener('mouseup', onBarDragEnd);
}
function onBarDragMove(e){
  if(!barDragState) return;
  const s = BASE_SHIFTS.find(x=>x.id===barDragState.shiftId);
  if(!s) return;
  const hour = hourFromClientX(e.clientX, barDragState.trackEl);
  if(barDragState.edge==='start'){
    if(hour <= s.end - 0.5) s.start = hour;
  }else{
    if(hour >= s.start + 0.5) s.end = hour;
  }
  const bar = barDragState.trackEl.querySelector('.bar');
  if(bar){
    bar.style.left = pct(s.start)+'%';
    bar.style.width = (pct(s.end)-pct(s.start))+'%';
  }
}
async function onBarDragEnd(){
  if(!barDragState) return;
  document.querySelectorAll('.bar-handle.dragging').forEach(el=>el.classList.remove('dragging'));
  document.removeEventListener('mousemove', onBarDragMove);
  document.removeEventListener('mouseup', onBarDragEnd);
  barDragState = null;
  await saveCurrentShiftConfig();
  await refreshAfterShiftConfigChange();
}


function fmt24(hDec){
  let h = Math.floor(hDec), m = Math.round((hDec-h)*60);
  if(m===60){m=0;h+=1;}
  h = ((h%24)+24)%24;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

// Pacific is on permanent DST — fixed UTC-7 year-round, no seasonal offset changes.
const PT_OFFSET = -7;

function ptToUtc(hDec){
  let u = hDec - PT_OFFSET; // UTC = PT - offset
  const dayShift = Math.floor(u/24);
  u = ((u%24)+24)%24;
  return {label: fmt24(u), dayShift};
}

// converts a UTC instant to decimal hours in fixed-offset Pacific time (no DST lookup)
function utcToFixedPT(date){
  const shifted = new Date(date.getTime() + PT_OFFSET*3600000);
  return shifted.getUTCHours() + shifted.getUTCMinutes()/60 + shifted.getUTCSeconds()/3600;
}
function fixedPTTimeString(date){
  const shifted = new Date(date.getTime() + PT_OFFSET*3600000);
  const h = String(shifted.getUTCHours()).padStart(2,'0');
  const m = String(shifted.getUTCMinutes()).padStart(2,'0');
  const s = String(shifted.getUTCSeconds()).padStart(2,'0');
  return `${h}:${m}:${s}`;
}

// ---- Sunrise calculation (solar position algorithm, ~1 min accuracy) ----
const rad = Math.PI/180;
const dayMs = 1000*60*60*24, J1970 = 2440588, J2000 = 2451545;
function toJulian(date){ return date.valueOf()/dayMs - 0.5 + J1970; }
function fromJulian(j){ return new Date((j+0.5-J1970)*dayMs); }
function toDays(date){ return toJulian(date) - J2000; }
const obliquity = rad*23.4397;
function declination(l){ return Math.asin(Math.sin(l)*Math.sin(obliquity)); }
function solarMeanAnomaly(d){ return rad*(357.5291+0.98560028*d); }
function eclipticLongitude(M){
  const C = rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
  const P = rad*102.9372;
  return M+C+P+Math.PI;
}
function julianCycle(d,lw){ return Math.round(d - 0.0009 - lw/(2*Math.PI)); }
function approxTransit(Ht,lw,n){ return 0.0009 + (Ht+lw)/(2*Math.PI) + n; }
function solarTransitJ(ds,M,L){ return J2000+ds+0.0053*Math.sin(M)-0.0069*Math.sin(2*L); }
function hourAngle(h,phi,d){ return Math.acos((Math.sin(h)-Math.sin(phi)*Math.sin(d))/(Math.cos(phi)*Math.cos(d))); }

function getSunriseUTC(date, lat, lng){
  const lw = rad*-lng, phi = rad*lat;
  const d = toDays(date), n = julianCycle(d,lw), ds = approxTransit(0,lw,n);
  const M = solarMeanAnomaly(ds), L = eclipticLongitude(M);
  const dec = declination(L);
  const Jnoon = solarTransitJ(ds,M,L);
  const w = hourAngle(-0.833*rad, phi, dec);
  const Jset = solarTransitJ(approxTransit(w,lw,n),M,L);
  const Jrise = Jnoon - (Jset - Jnoon);
  return fromJulian(Jrise);
}

// location used for the sunrise calculation (Kelowna, BC) — not exposed in the UI
const SUNRISE_LAT = 49.888, SUNRISE_LON = -119.496;

function getShiftsForDate(dateStr){
  const sunriseUTC = getSunriseUTC(new Date(dateStr+'T12:00:00Z'), SUNRISE_LAT, SUNRISE_LON);
  const sunrisePT = utcToFixedPT(sunriseUTC);
  const rawStart = sunrisePT - 0.5;
  let roundedStart = Math.round(rawStart*2)/2; // nearest :00 or :30
  roundedStart = Math.min(roundedStart, 8.0); // never start later than 8:00 AM, regardless of sunrise
  // Shift 1's start normally moves with sunrise automatically, unless it's been manually
  // dragged — in which case it stays exactly where it was set, like any other shift.
  // Everything else stays fixed so the two overlap windows (10:30–11:30 and 14:30–15:30)
  // never drift, no matter the day.
  const shifts = shiftsForDate(dateStr).map((s,i)=> i===0 ? {...s, start: shift1AutoStart ? roundedStart : s.start} : {...s});
  return {shifts, sunrisePT};
}

// ---- Timeline build (re-run whenever the date or location changes) ----
const axis = document.getElementById('axis');
const rows = document.getElementById('rows');

async function renderTimeline(dateStr){
  // same problem as the schedule table: rebuilding the rows resets the page scroll,
  // so hold the position and put it back once the redraw is done
  const tlSavedPage = window.scrollY;
  const tlRestore = ()=> window.scrollTo(0, tlSavedPage);
  const {shifts, sunrisePT} = getShiftsForDate(dateStr);
  const roster = await loadRoster();
  const exceptions = await loadExceptions();
  const dateExceptions = exceptions.filter(e=>e.date===dateStr);
  const overrides = await loadTimeOverrides();

  axis.innerHTML = '';
  [3,6,9,12,15,18,21,24].forEach(h=>{
    const utc = ptToUtc(h);
    const d = document.createElement('div');
    d.className = 'tick';
    d.style.left = pct(h)+'%';
    d.innerHTML = `<div class="pt">${fmt24(h)}</div><div class="utc">${utc.label}${utc.dayShift?'+'+utc.dayShift:''}</div>`;
    axis.appendChild(d);
  });

  rows.innerHTML = '';
  shifts.forEach(s=>{
    const row = document.createElement('div');
    row.className = 'row';
    const ptStart = fmt24(s.start), ptEnd = fmt24(s.end);
    const uStart = ptToUtc(s.start), uEnd = ptToUtc(s.end);
    row.title = isAdmin ? 'Click to change who works this shift' : '';
    row.innerHTML = `
      <div class="rlabel"><b>${s.name}</b>${ptStart}–${ptEnd} PT</div>
      <div class="track" data-shift="${s.id}"></div>
    `;
    rows.appendChild(row);
    const track = row.querySelector('.track');
    const assigned = (currentSchedule && currentSchedule[dateStr] && currentSchedule[dateStr][s.id]) || [];
    const hasPartial = assigned.some(n=> overrides[overrideKey(dateStr, s.id, n)]);

    if(hasPartial){
      // someone here only covers part of the shift — show exactly what's covered and
      // what's still open instead of one solid bar, so the gap is obvious at a glance
      const segs = assigned.map(n=>{
        const ov = overrides[overrideKey(dateStr, s.id, n)];
        return {start: ov ? ov.start : s.start, end: ov ? ov.end : s.end, label:n};
      }).sort((a,b)=> a.start-b.start);

      let cursor = s.start;
      const pieces = [];
      segs.forEach(seg=>{
        const segStart = Math.max(seg.start, cursor);
        if(segStart > cursor) pieces.push({start:cursor, end:segStart, gap:true});
        if(seg.end > segStart) pieces.push({start:segStart, end:seg.end, gap:false, label:seg.label});
        cursor = Math.max(cursor, seg.end);
      });
      if(cursor < s.end) pieces.push({start:cursor, end:s.end, gap:true});

      const shiftIdx = shifts.indexOf(s);
      const prevShift = shiftIdx>0 ? shifts[shiftIdx-1] : null;
      const nextShift = shiftIdx<shifts.length-1 ? shifts[shiftIdx+1] : null;

      pieces.forEach(p=>{
        const bar = document.createElement('div');
        bar.className = 'bar' + (p.gap ? ' bar-open' : '');
        bar.style.left = pct(p.start)+'%';
        bar.style.width = (pct(p.end)-pct(p.start))+'%';
        if(!p.gap) bar.style.background = s.color;
        bar.title = `${fmt24(p.start)}–${fmt24(p.end)} PT${p.gap ? ' — needs coverage' : ''}`;

        if(p.gap){
          // this gap borders whichever shift comes right before or after — if exactly
          // one person is on that neighboring shift, offer to extend their hours to
          // close the gap instead of needing a separate person for it
          let neighbor = null, dir = null;
          if(Math.abs(p.start - s.start) < 0.001 && prevShift){ neighbor = prevShift; dir = 'forward'; }
          else if(Math.abs(p.end - s.end) < 0.001 && nextShift){ neighbor = nextShift; dir = 'backward'; }

          const neighborAssigned = neighbor ? ((currentSchedule && currentSchedule[dateStr] && currentSchedule[dateStr][neighbor.id]) || []) : [];

          if(neighbor && neighborAssigned.length===1){
            const nName = neighborAssigned[0];
            const extendBtn = document.createElement('button');
            extendBtn.type = 'button';
            extendBtn.className = 'bar-extend-btn';
            extendBtn.textContent = `→ Extend ${nName}`;
            extendBtn.title = `Extend ${nName}'s hours on ${neighbor.name} to cover this gap instead of needing someone else`;
            extendBtn.addEventListener('click', async (e)=>{
              e.stopPropagation();
              try{
                await extendNeighborToCoverGap(dateStr, neighbor.id, nName, neighbor, p.start, p.end, dir);
              }catch(err){
                console.error('Extend failed:', err);
              }
            });
            bar.appendChild(document.createTextNode('Open '));
            bar.appendChild(extendBtn);
          }else{
            bar.textContent = 'Open';
          }
        }else{
          bar.textContent = p.label;
        }
        track.appendChild(bar);
      });
    }else{
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.left = pct(s.start)+'%';
      bar.style.width = (pct(s.end)-pct(s.start))+'%';
      bar.style.background = s.color;
      bar.textContent = assigned.length ? assigned.join(', ') : 'Open';
      if(!assigned.length) bar.classList.add('bar-open');
      bar.title = `${ptStart}–${ptEnd} PT`;
      track.appendChild(bar);

      const isS1 = s.id===BASE_SHIFTS[0].id;
      const leftHandle = document.createElement('div');
      leftHandle.className = 'bar-handle bar-handle-left';
      leftHandle.title = isS1 ? (shift1AutoStart ? 'Drag to set a fixed start time (currently following sunrise)' : 'Drag to adjust the fixed start time') : '';
      leftHandle.addEventListener('mousedown', (e)=> startBarDrag(e, s.id, 'start', track));
      bar.appendChild(leftHandle);

      const rightHandle = document.createElement('div');
      rightHandle.className = 'bar-handle bar-handle-right';
      rightHandle.addEventListener('mousedown', (e)=> startBarDrag(e, s.id, 'end', track));
      bar.appendChild(rightHandle);
    }

    const excepted = new Set(dateExceptions.filter(e=>e.shiftIds.includes(s.id)).map(e=>e.name));
    const available = roster.map(p=>p.name).filter(n=>!excepted.has(n)).sort((a,b)=>a.localeCompare(b));
    const availRow = document.createElement('div');
    availRow.className = 'row-available' + (openAssignShiftId===s.id ? ' avail-open' : '');

    const label = document.createElement('span');
    label.className = 'ra-label';
    label.textContent = 'Assign';
    availRow.appendChild(label);

    if(!available.length){
      const none = document.createElement('span');
      none.className = 'empty';
      none.textContent = 'nobody on the roster';
      availRow.appendChild(none);
    }else{
      available.forEach(n=>{
        const isOn = assigned.includes(n);
        if(isAdmin){
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'avail-chip' + (isOn ? ' avail-on' : '');
          chip.textContent = n;
          chip.title = isOn
            ? `${n} is on ${s.name} — click to take them off`
            : `Click to put ${n} on ${s.name}`;
          chip.addEventListener('click', async (e)=>{
            e.stopPropagation();
            try{
              await assignFromTimeline(dateStr, s.id, n);
            }catch(err){
              console.error('Assign failed:', err);
              alert('Could not update that shift: ' + err.message);
            }
          });
          availRow.appendChild(chip);
        }else{
          const plain = document.createElement('span');
          plain.className = 'avail-chip-plain' + (isOn ? ' avail-on' : '');
          plain.textContent = n;
          availRow.appendChild(plain);
        }
      });
    }
    rows.appendChild(availRow);

    // click a shift row to open its assign list — stays open (and survives the redraw
    // after each assignment) so you can make several changes in a row
    row.addEventListener('click', (e)=>{
      if(e.target.closest('.bar-handle') || e.target.closest('.bar-extend-btn')) return;
      openAssignShiftId = (openAssignShiftId===s.id) ? null : s.id;
      rows.querySelectorAll('.row-available').forEach(el=> el.classList.remove('avail-open'));
      if(openAssignShiftId===s.id) availRow.classList.add('avail-open');
    });
  });

  // overlay area aligned to the track columns only (excludes the row-label gutter)
  rows.style.position = 'relative';
  const overlayArea = document.createElement('div');
  overlayArea.style.position = 'absolute';
  overlayArea.style.left = '118px';
  overlayArea.style.right = '0';
  overlayArea.style.top = '0';
  overlayArea.style.bottom = '0';
  overlayArea.style.pointerEvents = 'none';
  rows.appendChild(overlayArea);

  // overlap bands — computed from the current shift times, so edits and Shift 4 stay in sync
  computeOverlaps(shifts).forEach(o=>{
    const affectedTracks = o.affects.map(id => rows.querySelector(`.track[data-shift="${id}"]`));
    const top = Math.min(...affectedTracks.map(t=>t.offsetTop));
    const bottom = Math.max(...affectedTracks.map(t=>t.offsetTop+t.offsetHeight));
    const oStart = o.start, oEnd = o.end;

    const band = document.createElement('div');
    band.className = 'overlap-band';
    band.style.position = 'absolute';
    band.style.left = pct(oStart)+'%';
    band.style.width = (pct(oEnd)-pct(oStart))+'%';
    band.style.top = (top-4)+'px';
    band.style.height = (bottom-top+8)+'px';
    overlayArea.appendChild(band);
  });

  const niceDate = new Date(dateStr+'T00:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',month:'short',day:'numeric'});
  const cappedNote = shifts[0].start <= 8.0 && (sunrisePT-0.5) > 8.0 ? ' (capped at 8:00 latest start)' : '';
  document.getElementById('sunriseNote').textContent =
    `Sunrise on ${niceDate}: ${fmt24(sunrisePT)} PT → Shift 1 starts ${fmt24(shifts[0].start)} PT${cappedNote}.`;

  tlRestore();
  requestAnimationFrame(tlRestore); // after layout settles
  return shifts;
}

  if(hasIt){

      .map(e=> (e.name===name && e.date===dateStr && e.shiftIds.includes(shiftId))

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function daysInMonth(y,m){ return new Date(Date.UTC(y,m+1,0)).getUTCDate(); } // m is 0-indexed
function pad2(n){ return String(n).padStart(2,'0'); }

// 20 years of calendar months, 2026 through 2045
// Starts at 2026 and always keeps 20 years of runway ahead of the current year, so
// the list extends itself as time passes instead of ever running out.
const FIRST_YEAR = 2026;
const YEARS_AHEAD = 20;
const LAST_YEAR = Math.max(FIRST_YEAR + YEARS_AHEAD - 1, new Date().getUTCFullYear() + YEARS_AHEAD);

function generatePeriods(){
  const list = [];
  for(let y=FIRST_YEAR; y<=LAST_YEAR; y++){
    for(let m=0; m<12; m++){
      const mm = pad2(m+1);
      list.push({
        id: `${y}-${mm}`,
        label: `${MONTH_NAMES[m]} ${y}`,
        start: `${y}-${mm}-01`,
        end: `${y}-${mm}-${pad2(daysInMonth(y,m))}`
      });
    }
  }
  return list;
}
const PERIODS = generatePeriods();

function enumerateDates(startISO, endISO){
  const list = [];
  let d = new Date(startISO+'T00:00:00Z');
  const end = new Date(endISO+'T00:00:00Z');
  while(d.getTime() <= end.getTime()){
    list.push(d.toISOString().slice(0,10));
    d = new Date(d.getTime() + 86400000);
  }
  return list;
}

function parseHHMM(str){
  const m = /^(\d{1,2}):(\d{2})$/.exec((str||'').trim());
  if(!m) return null;
  const h = parseInt(m[1],10), mi = parseInt(m[2],10);
  if(h<0||h>24||mi<0||mi>59||(h===24&&mi>0)) return null;
  return h + mi/60;
}
function formatHHMM(hDec){
  const h = Math.floor(hDec), m = Math.round((hDec-h)*60);
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

function renderStaffingEstimate(dateStr){

  activeShifts().forEach(s=>{
    const n = parseInt((document.getElementById('slots-'+s.id)||{}).value, 10) || 0;
    slots[s.id] = n;
    bareMinPeople += n;

  const bufferedPeople = Math.max(1, Math.ceil(bareMinPeople * (1 + staffingBufferPct/100)));
  const weeklyHours = shifts.reduce((sum,s)=> sum + (s.end - s.start) * (slots[s.id]||0), 0) * 7;

async function renderCoverageGaps(){
  const roster = await loadRoster();
  const exceptions = await loadExceptions();
  const slots = {};
  activeShifts().forEach(s=>{ slots[s.id] = parseInt((document.getElementById('slots-'+s.id)||{}).value, 10) || 0; });

  // For each date+shift in the period, figure out how many people could actually
  // cover it (roster minus anyone marked unavailable that day for that shift). If a
  // schedule's already been generated, use its real assigned count instead — that
  // reflects what actually happened (including cases where fairness/Rule 1 left a
  // shift short even though enough people were nominally available).
  const gaps = [];
  DAYS.forEach(dateStr=>{
    const dateExceptions = exceptions.filter(e=>e.date===dateStr);
    activeShifts().forEach(s=>{
      const need = slots[s.id];
      if(need<=0) return;

      let have;
      if(currentSchedule && currentSchedule[dateStr] && currentSchedule[dateStr][s.id]){
        have = currentSchedule[dateStr][s.id].length;
      }else{
        const excepted = new Set(dateExceptions.filter(e=>e.shiftIds.includes(s.id)).map(e=>e.name));
        have = roster.filter(p=>!excepted.has(p.name)).length;
      }

      if(have < need) gaps.push({date:dateStr, shift:s, have, need});
    });
  });

  gaps.sort((a,b)=> a.date.localeCompare(b.date) || (b.need-b.have)-(a.need-a.have));

  const banner = document.getElementById('gapBanner');
  const countEl = document.getElementById('gapBannerCount');
  const wrap = document.getElementById('gapBannerList');

  if(gaps.length===0){
    banner.style.display = 'none';
    wrap.innerHTML = '';
    return;
  }

  banner.style.display = 'block';
  countEl.textContent = ` — ${gaps.length} shift${gaps.length===1?'':'s'} short-staffed`;

  const MAX_SHOWN = 6;
  wrap.innerHTML = '';
  gaps.slice(0, MAX_SHOWN).forEach(g=>{
    const label = new Date(g.date+'T00:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'});
    const detail = g.have===0 ? 'nobody available' : `${g.have} available, needs ${g.need}`;
    const row = document.createElement('div');
    row.className = 'gap-row';
    row.innerHTML = `
      <div class="gap-main"><span class="gap-day">${label}</span><span class="gap-shift">${g.shift.name}</span></div>
      <div class="gap-detail">${detail}</div>
    `;
    wrap.appendChild(row);
  });
  if(gaps.length > MAX_SHOWN){
    const more = document.createElement('div');
    more.className = 'gap-more';
    more.textContent = `+ ${gaps.length - MAX_SHOWN} more`;
    wrap.appendChild(more);
  }
}
renderCoverageGaps();

// tallies what each person is ACTUALLY scheduled for across the whole period, honoring
// any partial-hours overrides rather than assuming everyone works the full shift — the
// point is to surface real imbalance, not the idealized even split
function renderHoursSummary(datedSchedule, overrides){
  const wrap = document.getElementById('hoursSummary');
  if(!wrap) return;
  wrap.innerHTML = '';
  if(!datedSchedule) return;

  const shiftById = {};
  activeShifts().forEach(s=>{ shiftById[s.id] = s; });

  const totals = {}; // name -> {hours, shifts}
  DAYS.forEach(dateStr=>{
    const dayRow = datedSchedule[dateStr] || {};
    activeShifts().forEach(s=>{
      (dayRow[s.id] || []).forEach(name=>{
        const ov = overrides ? overrides[overrideKey(dateStr, s.id, name)] : null;
        const start = ov ? ov.start : s.start;
        const end = ov ? ov.end : s.end;
        if(!totals[name]) totals[name] = {hours:0, shifts:0};
        totals[name].hours += (end - start);
        totals[name].shifts += 1;
      });
    });
  });

  const names = Object.keys(totals);
  if(names.length===0) return;

  const rows = names.map(n=>({name:n, ...totals[n]})).sort((a,b)=> b.hours-a.hours || a.name.localeCompare(b.name));
  const maxHours = rows[0].hours;
  const avg = rows.reduce((sum,r)=>sum+r.hours, 0) / rows.length;
  const weeks = DAYS.length / 7;

  const title = document.createElement('div');
  title.className = 'hours-summary-title';
  title.textContent = 'Scheduled hours this period';
  wrap.appendChild(title);

  const sub = document.createElement('div');
  sub.className = 'hours-summary-sub';
  sub.textContent = `Average ${avg.toFixed(1)} hrs (${(avg/weeks).toFixed(1)} hrs/week) across ${rows.length} ${rows.length===1?'person':'people'} — actual totals, including anyone on partial hours.`;
  wrap.appendChild(sub);

  rows.forEach(r=>{
    const row = document.createElement('div');
    row.className = 'hours-row';

    const nameEl = document.createElement('span');
    nameEl.className = 'hours-name';
    nameEl.textContent = r.name;

    const track = document.createElement('span');
    track.className = 'hours-bar-track';
    const fill = document.createElement('div');
    fill.className = 'hours-bar-fill';
    // flag anyone meaningfully off the average so imbalance is visible at a glance
    if(r.hours < avg * 0.85) fill.classList.add('hours-low');
    else if(r.hours > avg * 1.15) fill.classList.add('hours-high');
    fill.style.width = maxHours > 0 ? (r.hours / maxHours * 100) + '%' : '0%';
    track.appendChild(fill);

    const val = document.createElement('span');
    val.className = 'hours-val';
    val.textContent = `${r.hours.toFixed(1)} hrs`;

    const shiftsEl = document.createElement('span');
    shiftsEl.className = 'hours-shifts';
    shiftsEl.textContent = `${r.shifts} shift${r.shifts===1?'':'s'}`;

    row.title = `${r.name}: ${r.hours.toFixed(1)} hrs over ${r.shifts} shift${r.shifts===1?'':'s'} (${(r.hours/weeks).toFixed(1)} hrs/week)`;
    row.appendChild(nameEl);
    row.appendChild(track);
    row.appendChild(val);
    row.appendChild(shiftsEl);
    wrap.appendChild(row);
  });
}

function buildTimeEditor(dateStr, shiftId, name, shift, existingOverride){
  const editor = document.createElement('div');
  editor.className = 'chip-time-editor';

  const startInput = document.createElement('input');
  startInput.type = 'text';
  startInput.placeholder = 'HH:MM';
  startInput.value = existingOverride ? formatHHMM(existingOverride.start) : formatHHMM(shift.start);

  const dash = document.createElement('span');
  dash.textContent = '–';

  const endInput = document.createElement('input');
  endInput.type = 'text';
  endInput.placeholder = 'HH:MM';
  endInput.value = existingOverride ? formatHHMM(existingOverride.end) : formatHHMM(shift.end);

  const saveBtn = document.createElement('button');
  saveBtn.type = 'button';
  saveBtn.className = 'chip-time-save';
  saveBtn.textContent = 'Save';
  saveBtn.addEventListener('click', async ()=>{
    const start = parseHHMM(startInput.value);
    const end = parseHHMM(endInput.value);
    const status = editor.querySelector('.chip-time-status');
    if(start===null || end===null){ status.textContent = 'Use HH:MM (24-hour).'; return; }
    if(start >= end){ status.textContent = 'Start must be before end.'; return; }
    const overrides = await loadTimeOverrides();
    overrides[overrideKey(dateStr, shiftId, name)] = {start, end};
    await saveTimeOverrides(overrides);
    await renderScheduleTable(currentSchedule);
    renderTimeline(selectedDate);
  });

  const clearBtn = document.createElement('button');
  clearBtn.type = 'button';
  clearBtn.className = 'chip-time-clear';
  clearBtn.textContent = 'Clear';
  clearBtn.addEventListener('click', async ()=>{
    const overrides = await loadTimeOverrides();
    delete overrides[overrideKey(dateStr, shiftId, name)];
    await saveTimeOverrides(overrides);
    await renderScheduleTable(currentSchedule);
    renderTimeline(selectedDate);
  });

  const status = document.createElement('div');
  status.className = 'chip-time-status';

  const row = document.createElement('div');
  row.className = 'chip-time-row';
  row.appendChild(startInput);
  row.appendChild(dash);
  row.appendChild(endInput);
  row.appendChild(saveBtn);
  row.appendChild(clearBtn);

  editor.appendChild(row);
  editor.appendChild(status);
  return editor;
}

// extends whoever's on the neighboring shift to cover a gap left by someone's partial
// hours, instead of needing a separate person — scoped to just this one date via the
// same per-person override system, so it never touches the shift's normal hours on
// other days
async function extendNeighborToCoverGap(dateStr, neighborShiftId, neighborName, neighborShift, gapStart, gapEnd, direction){
  const overrides = await loadTimeOverrides();
  const key = overrideKey(dateStr, neighborShiftId, neighborName);
  const existing = overrides[key];
  if(direction==='forward'){
    // neighbor's shift ends right where the gap begins — push their end later to close it
    const start = existing ? existing.start : neighborShift.start;
    overrides[key] = {start, end: gapEnd};
  }else{
    // neighbor's shift starts right where the gap ends — pull their start earlier to close it
    const end = existing ? existing.end : neighborShift.end;
    overrides[key] = {start: gapStart, end};
  }
  await saveTimeOverrides(overrides);
  await renderScheduleTable(currentSchedule);
  renderTimeline(selectedDate);
}

// checks the one hard rule against a proposed manual placement — used to block drag
// moves the same way the generator already blocks itself
function wouldViolateCloseOpenRule(name, targetDate, targetShiftId){
  const FIRST_ID = activeShifts()[0].id, LAST_ID = activeShifts()[activeShifts().length-1].id;
  const idx = DAYS.indexOf(targetDate);
  if(targetShiftId===FIRST_ID && idx>0){
    const prevDate = DAYS[idx-1];
    const prevLast = (currentSchedule && currentSchedule[prevDate] && currentSchedule[prevDate][LAST_ID]) || [];
    if(prevLast.includes(name)){
      const prevLabel = new Date(prevDate+'T00:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'});
      return `${name} closed the last shift on ${prevLabel} — can't open the very next day.`;
    }
  }
  if(targetShiftId===LAST_ID && idx<DAYS.length-1){
    const nextDate = DAYS[idx+1];
    const nextFirst = (currentSchedule && currentSchedule[nextDate] && currentSchedule[nextDate][FIRST_ID]) || [];
    if(nextFirst.includes(name)){
      const nextLabel = new Date(nextDate+'T00:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'});
      return `${name} opens the first shift on ${nextLabel} — can't close the night before.`;
    }
  }
  return null;
}

// click-to-assign from the Shift Timeline's available list — same rules the generator
// and drag-and-drop follow, so you can't sidestep them by editing here instead
async function assignFromTimeline(dateStr, shiftId, name){
  if(!currentSchedule) currentSchedule = {};
  if(!currentSchedule[dateStr]) currentSchedule[dateStr] = {};
  activeShifts().forEach(s=>{ if(!currentSchedule[dateStr][s.id]) currentSchedule[dateStr][s.id] = []; });

  const list = currentSchedule[dateStr][shiftId];
  const overrides = await loadTimeOverrides();
  let overridesChanged = false;

  if(list.includes(name)){
    // already on this shift — clicking again takes them off
    currentSchedule[dateStr][shiftId] = list.filter(n=>n!==name);
    const k = overrideKey(dateStr, shiftId, name);
    if(overrides[k]){ delete overrides[k]; overridesChanged = true; }
  }else{
    const violation = wouldViolateCloseOpenRule(name, dateStr, shiftId);
    if(violation && !confirm(`${violation}\n\nAdd them anyway?`)) return;

    const alreadyToday = activeShifts().some(s=> s.id!==shiftId && (currentSchedule[dateStr][s.id]||[]).includes(name));
    if(alreadyToday && !confirm(`${name} is already working another shift that day.\n\nPut them on this one too?`)) return;

    // if the shift is already at its headcount, the person clicked replaces whoever
    // was there first — that's the "swap someone out" case
    const need = parseInt((document.getElementById('slots-'+shiftId)||{}).value, 10) || 1;
    while(list.length >= need && list.length > 0){
      const removed = list.shift();
      const rk = overrideKey(dateStr, shiftId, removed);
      if(overrides[rk]){ delete overrides[rk]; overridesChanged = true; }
    }
    list.push(name);
  }

  if(overridesChanged) await saveTimeOverrides(overrides);
  await persistCurrentSchedule();
  await renderScheduleTable(currentSchedule);
  renderTimeline(selectedDate);
  await renderCoverageGaps();
}

async function handleScheduleDrop(data, targetDate, targetShift){
  if(!data || !data.name) return;
  const name = data.name;

  const alreadyThere = currentSchedule && currentSchedule[targetDate] && currentSchedule[targetDate][targetShift] && currentSchedule[targetDate][targetShift].includes(name);
  if(!alreadyThere){
    const violation = wouldViolateCloseOpenRule(name, targetDate, targetShift);
    if(violation && !confirm(`${violation}\n\nPlace them there anyway?`)) return;
  }

  if(!currentSchedule) currentSchedule = {};
  if(!currentSchedule[targetDate]) currentSchedule[targetDate] = {};
  activeShifts().forEach(s=>{ if(!currentSchedule[targetDate][s.id]) currentSchedule[targetDate][s.id] = []; });

  if(data.fromDate && data.fromShift && currentSchedule[data.fromDate] && currentSchedule[data.fromDate][data.fromShift]){
    currentSchedule[data.fromDate][data.fromShift] = currentSchedule[data.fromDate][data.fromShift].filter(n=>n!==name);
    const overrides = await loadTimeOverrides();
    const oldKey = overrideKey(data.fromDate, data.fromShift, name);
    if(overrides[oldKey]){ delete overrides[oldKey]; await saveTimeOverrides(overrides); }
  }
  if(!currentSchedule[targetDate][targetShift].includes(name)){
    currentSchedule[targetDate][targetShift].push(name);
  }

  await persistCurrentSchedule();
  await renderScheduleTable(currentSchedule);
  renderTimeline(selectedDate);
  await renderCoverageGaps();
}

async function removePersonFromSlot(dateStr, shiftId, name){
  if(!currentSchedule || !currentSchedule[dateStr] || !currentSchedule[dateStr][shiftId]) return;
  currentSchedule[dateStr][shiftId] = currentSchedule[dateStr][shiftId].filter(n=>n!==name);
  const overrides = await loadTimeOverrides();
  const key = overrideKey(dateStr, shiftId, name);
  if(overrides[key]){ delete overrides[key]; await saveTimeOverrides(overrides); }
  await persistCurrentSchedule();
  await renderScheduleTable(currentSchedule);
  renderTimeline(selectedDate);
  await renderCoverageGaps();
}

async function generateSchedule(){
  const roster = await loadRoster();
  const rosterNames = roster.map(p=>p.name);
  const exceptions = await loadExceptions();
  const slots = {};
  activeShifts().forEach(s=>{ slots[s.id] = parseInt(document.getElementById('slots-'+s.id).value,10) || 0; });

  const FIRST_ID = activeShifts()[0].id, LAST_ID = activeShifts()[activeShifts().length-1].id;

  // Walks the period date by date — no recurring weekly pattern, so every day is
  // scheduled on its own and two Mondays won't look alike. Balance comes from always
  // preferring whoever has the fewest hours so far; ties break randomly so repeated
  // runs give genuinely different (but still fair) schedules.
  const hoursSoFar = {};
  rosterNames.forEach(n=>{ hoursSoFar[n] = 0; });

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const datedSchedule = {};

  DAYS.forEach((dateStr, dateIdx)=>{
    const dateExceptions = exceptions.filter(e=>e.date===dateStr);
    const dayAssign = {};
    const todaysShifts = shiftsForDate(dateStr); // honors any per-day Shift 4 override
    todaysShifts.forEach(s=>{ dayAssign[s.id] = []; });

    // who closed yesterday — the one hard rule is they can't open today
    const prevDateStr = dateIdx>0 ? DAYS[dateIdx-1] : null;
    const closedYesterday = new Set(
      prevDateStr && datedSchedule[prevDateStr] ? (datedSchedule[prevDateStr][LAST_ID] || []) : []
    );

    const assignedToday = new Set(); // nobody works two shifts in one day

    todaysShifts.forEach(s=>{
      const need = slots[s.id];
      if(need <= 0) return;

      const excepted = new Set(dateExceptions.filter(e=>e.shiftIds.includes(s.id)).map(e=>e.name));

      let pool = rosterNames.filter(name=>
        !assignedToday.has(name) &&
        !excepted.has(name) &&
        !(s.id===FIRST_ID && closedYesterday.has(name))
      );

      // shuffle first so equal-hours people are picked in a different order each run,
      // then stable-sort by hours so the fairness ordering still wins overall
      pool = shuffle(pool).sort((a,b)=> hoursSoFar[a]-hoursSoFar[b]);

      const shiftHours = s.end - s.start;
      pool.slice(0, need).forEach(name=>{
        dayAssign[s.id].push(name);
        assignedToday.add(name);
        hoursSoFar[name] += shiftHours;
      });
    });

    datedSchedule[dateStr] = dayAssign;
  });

  try{
    await storage.set('generated-schedule-dated:'+activePeriodId, JSON.stringify(datedSchedule), true);
  }catch(e){}
  currentSchedule = datedSchedule;
  await renderScheduleTable(datedSchedule);
  renderTimeline(selectedDate);
  await renderCoverageGaps();
}

    {id:'r-r6', name:'Frankie Lopez'},
  ];

  // a few one-off unavailability entries, placed inside whatever month is active so
  // they're actually visible instead of sitting outside the current period
  const d = n => DAYS[Math.min(n-1, DAYS.length-1)];
  const exampleExceptions = [
    {id:'x-r1', name:'Alex Chen',     date:d(4),  shiftIds:['s2']},
    {id:'x-r2', name:'Bailey Rivera', date:d(9),  shiftIds:['s3']},
    {id:'x-r3', name:'Casey Nguyen',  date:d(8),  shiftIds:['s1','s2','s3','s4']},
    {id:'x-r4', name:'Dana Kim',      date:d(6),  shiftIds:['s4']},
    {id:'x-r5', name:'Frankie Lopez', date:d(15), shiftIds:['s3','s4']},
    {id:'x-r6', name:'Emerson Park',  date:d(3),  shiftIds:['s1']},
  ];

  try{
    await storage.set('team-roster:'+activePeriodId, JSON.stringify(exampleRoster), true);
    await storage.set('availability-exceptions:'+activePeriodId, JSON.stringify(exampleExceptions), true);
    try{ await storage.delete('generated-schedule-dated:'+activePeriodId, true); }catch(e){}
    await storage.set(SEED_KEY, 'done', true);
  }catch(e){ console.error('reset/seed failed', e); }

  renderPeriodTabs();
  renderRosterNameList();
  renderWslPersonSelect();
  renderStaffingEstimate(selectedDate);
  renderDayStrip();
  renderTimeline(selectedDate);
  renderCoverageGaps();
  renderStaffingEstimate(selectedDate);
  await generateSchedule();
})();
</script>
